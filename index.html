<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GESMAR</title>
<script>/* version web : réglages Supabase dans config.js (à côté de index.html). Programme PC : fournis par le programme. Sur fabz91.github.io : code d'accès GT1 de GESTIME Web (même adresse). */if(!window.api&&!/github\.io$/.test(location.hostname))document.write('<script src="config.js"><\/script>')</script>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="GES"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="ges-icon.png"><link rel="manifest" href="manifest.webmanifest">
<meta name="gm-version" content="160">
<style>
/* Layout (repris de GESTIME) : bandeau blanc [icône + titre + magasin ⌂] [logo] [⚙], rangée de 4 grands onglets verts, sélecteur de période, puis cartes coiffées d'un bandeau rouge. */
:root{
  --bg:#eef1ed; --surface:#ffffff; --sunk:#f1f4f0; --line:#d6ddd5; --fg:#18231b; --muted:#5d6b60;
  --green:#17613a; --green-2:#23824d; --green-soft:#e2f0e6; --on-green:#ffffff;
  --red:#c4161c; --red-2:#e2342b; --red-soft:#fbe5e3; --on-red:#ffffff;
  --accent:var(--green); --accent-soft:var(--green-soft); --accent-fg:var(--on-green);
  --warn:#9a5b00; --warn-soft:#fbefd9; --bad:#b3261e; --bad-soft:#fbe4e1; --good:#17613a; --good-soft:#e2f0e6; --info:#2d5a8a; --info-soft:#e2ebf5;
  --bar-empty:#dfe5dd; --n1:#e7a3a0; --hdr:#ffffff; --tab-on:#3cb44b; --teal:#2fa89e; --on-teal:#ffffff; --panel:#ffffff; --logo-bg:transparent; --logo-pad:0; --shadow:0 1px 2px rgba(20,40,25,.08),0 2px 8px rgba(20,40,25,.05);
  --display:system-ui,-apple-system,"Segoe UI",sans-serif; --body:system-ui,-apple-system,"Segoe UI",sans-serif; /* police de Windows, comme GESTIME */
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#2a2e32; --surface:#33383c; --sunk:#3b4045; --line:#4a5055; --fg:#eef0f1; --muted:#a8b0b5;
  --green:#36a84a; --green-2:#45c05a; --green-soft:#2c3f31; --on-green:#ffffff;
  --hdr:#1f2326; --tab-on:#3cb44b; --teal:#5fd0c6; --on-teal:#10302d; --panel:#3a3f44;
  --red:#b8191f; --red-2:#d6322a; --red-soft:#3d1d1c; --on-red:#ffffff;
  --warn:#f0b65a; --warn-soft:#3a2e17; --bad:#f08a80; --bad-soft:#3d1f1c; --good:#5cc28d; --good-soft:#1c3325; --info:#8db7e6; --info-soft:#1d2a3a;
  --bar-empty:#2b332d; --n1:#8a4441; --logo-bg:#ffffff; --logo-pad:4px 8px; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#2a2e32; --surface:#33383c; --sunk:#3b4045; --line:#4a5055; --fg:#eef0f1; --muted:#a8b0b5;
  --green:#36a84a; --green-2:#45c05a; --green-soft:#2c3f31; --on-green:#ffffff;
  --hdr:#1f2326; --tab-on:#3cb44b; --teal:#5fd0c6; --on-teal:#10302d; --panel:#3a3f44;
  --red:#b8191f; --red-2:#d6322a; --red-soft:#3d1d1c; --on-red:#ffffff;
  --warn:#f0b65a; --warn-soft:#3a2e17; --bad:#f08a80; --bad-soft:#3d1f1c; --good:#5cc28d; --good-soft:#1c3325; --info:#8db7e6; --info-soft:#1d2a3a;
  --bar-empty:#2b332d; --n1:#8a4441; --logo-bg:#ffffff; --logo-pad:4px 8px; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
.wrap.wide{max-width:none;padding-inline:12px}
.wrap.wide .sub{max-width:none}
.sheet-scroll{max-height:none;min-height:0;overflow:visible} /* v38 : plus de barre de défilement dans la saisie : toute la page défile */

/* ---- bandeau du haut (repris de GESTIME) ---- */
header.top{background:var(--hdr)}
.bar{max-width:1280px;margin:0 auto;padding:12px 16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.ident{display:flex;align-items:center;gap:12px;min-width:0}
.appico{flex:none;width:46px;height:46px;border-radius:11px;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.appico svg{width:100%;height:100%;display:block}
.apptitle{font-family:var(--display);font-weight:900;font-size:27px;line-height:1;letter-spacing:.02em;color:var(--fg)}
.apptitle b{color:var(--red-2)}
.store{display:flex;align-items:center;gap:8px;margin-top:5px;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.24em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.house{border:1px solid var(--line);background:var(--surface);color:var(--fg);width:26px;height:26px;display:grid;place-items:center;cursor:pointer;padding:0;border-radius:8px} /* v32 : petite case autour de la maison, comme GESTIME */
.house svg{width:16px;height:16px}
.logo{justify-self:center;display:flex;align-items:center;min-height:46px}
.logo img{max-height:46px;max-width:120px;display:block;background:var(--logo-bg);border-radius:6px;padding:var(--logo-pad)}
.logo .ph{border:1.5px dashed var(--line);color:var(--muted);background:none;border-radius:8px;padding:8px 12px;font:600 12px var(--body);cursor:pointer}
.tools{justify-self:end;display:flex;gap:8px}
.ibtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:grid;place-items:center;padding:0}
.ibtn svg{width:17px;height:17px}
.ibtn:disabled{opacity:.35;cursor:default}
.ibtn:not(:disabled):hover,.house:hover{color:var(--green-2);border-color:var(--green-2)}
.stripe{height:5px;background:linear-gradient(var(--green) 0 2px,transparent 2px 3px,var(--red-2) 3px 5px)}
.menu{position:absolute;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.25);padding:6px;min-width:200px}
.menu button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:none;color:var(--fg);font:600 14px var(--body);padding:8px 10px;border-radius:6px;cursor:pointer;text-align:left}
.menu button:hover{background:var(--sunk)}
.menu button[aria-current="true"]{background:var(--green-soft);color:var(--green-2)}
nav.tabs{max-width:1280px;margin:0 auto;padding:16px 16px 4px;display:flex;justify-content:center;flex-wrap:wrap;gap:10px}
nav.tabs button{font:800 13px var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 20px;cursor:pointer;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.12)}
nav.tabs button:hover{border-color:var(--tab-on)}
nav.tabs button[aria-selected="true"]{background:var(--tab-on);border-color:var(--tab-on);color:#fff;box-shadow:0 2px 8px rgba(60,180,75,.35)}
.avlate{display:inline-flex;vertical-align:-3px;margin-left:5px}.avlate[hidden]{display:none}.avlate svg.warn{width:17px;height:17px;display:block} /* v45 */
nav.tabs .cnt.blink{animation:updBlink 1s ease-in-out infinite}
nav.tabs .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--red-2);color:var(--on-red);font-size:11px;letter-spacing:0}
@media (max-width:640px){
  .bar{grid-template-columns:1fr auto}
  .logo{grid-column:1/-1;grid-row:2;justify-self:center;min-height:0}
  .apptitle{font-size:23px}
  nav.tabs button{padding:8px 12px;font-size:12px}
}

/* ---- période ---- */
.periode{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.periode .nav{width:34px;height:34px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;cursor:pointer;font-size:16px}
.periode select,.periode input{height:34px}
.periode input{width:80px}
.periode .sp{flex:1}

/* ---- cartes à bandeau rouge ---- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;box-shadow:var(--shadow)}
.panel.flush{padding:0;overflow:hidden}
.band{background:linear-gradient(180deg,var(--red-2),var(--red));color:var(--on-red);font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;text-align:center}
.panel>.band{margin:-16px -16px 14px;border-radius:var(--r) var(--r) 0 0}
.panel.flush>.band{margin:0}
.band .pillbtn{font:700 12px var(--body);letter-spacing:0;text-transform:none;color:var(--on-red);background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.7);border-radius:14px;padding:3px 12px;cursor:pointer}
.band .pillbtn:hover{background:rgba(255,255,255,.28)}

h2{font-family:var(--display);font-weight:800;font-size:22px;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px;max-width:75ch}
.lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(175px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.kpi .v{font-family:var(--display);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums}
.kpi.hl .v{color:var(--green)}
.kpi.alert .v{color:var(--red)}
.kpi .d{font-size:12px;color:var(--muted)}
.two{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.three{grid-template-columns:minmax(0,1fr)} /* v144 : 3 graphiques du tableau de bord */
svg.chm .vl{font-size:12px}svg.chm .vl1{font-size:11px;fill:var(--muted);font-weight:600}
@media (max-width:860px){.two{grid-template-columns:minmax(0,1fr)}}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface);position:sticky;top:0}
td.l,th.l{text-align:left}
tr.tot td{font-weight:800;border-top:2px solid var(--fg);border-bottom:0}
tr.muted td{color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:700;white-space:nowrap}
.s-a_reclamer{background:var(--warn-soft);color:var(--warn)}
.s-declare{background:var(--warn-soft);color:var(--warn)}
.s-reclame,.s-relance{background:var(--info-soft);color:var(--info)}
.s-accepte,.s-deduit{background:var(--good-soft);color:var(--good)}
.s-refuse{background:var(--bad-soft);color:var(--bad)}
.late{color:var(--bad);font-weight:700}
button.btn,.btn{font:700 13px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:7px 12px;cursor:pointer}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--on-green)}
.btn.red{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.small{padding:3px 8px;font-size:12px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav.tabs button:focus-visible,.gear:focus-visible,.house:focus-visible,.band .pillbtn:focus-visible{outline:2px solid var(--green);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* saisie */
/* grille de saisie : colonnes toutes égales qui se partagent la largeur (elles rétrécissent quand on ajoute un fournisseur) */
.sheet{table-layout:fixed;width:100%}
.sheet td{padding:0;border-right:1px solid var(--line);height:32px;overflow:hidden}
.sheet th{border-right:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;padding:5px 4px;font-size:10.5px}
.sheet th.day,.sheet td.day{width:78px;position:sticky;left:0;background:var(--surface);z-index:1;text-align:left;padding:4px 10px;font-weight:700}
.sheet th.day{z-index:2}
.sheet td.we{color:var(--red)}
.sheet td.hasfac{position:relative}.sheet td.hasfac input{padding-right:20px}
.facdoc{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:13px;height:15px;padding:0;margin:0;border:0;background:none;color:var(--muted,#8a8f98);cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.facdoc:hover{color:var(--accent,#e0592a)}.facdoc svg{width:11px;height:13px}
.sheet td input{display:block;width:100%;height:100%;min-width:0;box-sizing:border-box;border:0;border-radius:0;background:transparent;text-align:right;padding:6px 6px;font-variant-numeric:tabular-nums;font-size:13px}
.sheet td input::placeholder{font-size:12px}
/* sélection verte = exactement la case */
.sheet td input:focus,.sheet td input:focus-visible{background:var(--green-soft);outline:2px solid var(--green-2);outline-offset:-2px}
.sheet td.calc{padding:6px 6px;background:var(--sunk);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet tr.tot td{padding:7px 6px;background:var(--sunk);overflow:hidden;text-overflow:ellipsis}
.sheet tr.tot td.day{padding:7px 10px}
.sheet .ca input{font-weight:700}
.fhead{display:flex;flex-direction:column;align-items:stretch;gap:3px;min-width:0}
.fctl{display:flex;justify-content:space-between;align-items:center;gap:3px}
.fmv{flex:none;width:20px;height:20px;border-radius:6px;border:1px solid var(--line);background:var(--sunk);color:var(--fg);font:900 13px/1 var(--body);cursor:pointer;padding:0;display:grid;place-items:center}
.fmv:hover:not(:disabled),.fmv:focus-visible{background:var(--green-2);border-color:var(--green-2);color:#fff}
.fmv:disabled{opacity:.3;cursor:default}
.sheet input.fname{flex:1;min-width:0;width:100%;box-sizing:border-box;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:5px 5px;font:800 10px var(--display);letter-spacing:.02em;text-transform:uppercase;color:var(--fg);text-align:left;text-overflow:ellipsis}
.sheet input.fname:focus{border-color:var(--green-2);background:var(--surface);outline:none}
.fx{flex:none;width:20px;height:20px;border-radius:6px;border:1px solid var(--line);background:var(--sunk);color:var(--red-2);font:900 11px/1 var(--body);cursor:pointer;padding:0;display:grid;place-items:center}
.fx:hover,.fx:focus-visible{background:var(--red-2);border-color:var(--red-2);color:#fff}
.rn{cursor:text;border-bottom:1px dashed transparent}
.rn:hover{border-bottom-color:currentColor;color:var(--fg)}
.rnin{width:120px;font:700 11px var(--body);text-transform:uppercase;padding:2px 4px}
.colx{position:absolute;top:3px;right:3px;width:17px;height:17px;border-radius:50%;border:0;background:transparent;color:var(--muted);font:700 13px/17px var(--body);padding:0;cursor:pointer;opacity:.55}
.colx:hover,.colx:focus-visible{opacity:1;background:var(--red-2);color:#fff}
.hidden-cols{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.hidden-cols button{font:600 12px var(--body);border:1px dashed var(--line);background:none;color:var(--fg);border-radius:14px;padding:3px 10px;cursor:pointer}
.hidden-cols button:hover{border-color:var(--green-2);color:var(--green-2)}
.rchip{display:inline-flex;align-items:center;gap:3px}
.hidden-cols button.rdel{border:1px solid var(--line);border-radius:6px;padding:0;width:20px;height:20px;display:grid;place-items:center;color:var(--red-2);font:900 11px/1 var(--body);background:var(--sunk)}
.hidden-cols button.rdel:hover{background:var(--red-2);border-color:var(--red-2);color:#fff}
.sheet td.gtot{background:var(--green-soft);font-weight:700}
/* chart */
svg text{fill:var(--muted);font:11px var(--body)}
svg .vl{fill:var(--fg);font-weight:700}
/* bars list */
.hb{display:grid;grid-template-columns:120px minmax(0,1fr) 90px;gap:4px 8px;align-items:center;font-size:13px}
.aft td{padding-block:9px}.aft tr.afsub td{color:var(--muted);font-size:13px;padding-block:5px}.aft tr.afsub td.l{padding-left:30px}
.afbar{display:inline-block;vertical-align:middle;width:calc(100% - 64px);height:12px;background:var(--sunk);border-radius:6px;overflow:hidden}.afbar i{display:block;height:100%;background:var(--green);border-radius:6px}.afsub .afbar i{background:var(--n1)}.afp{display:inline-block;width:56px;text-align:right;font-variant-numeric:tabular-nums;margin-left:8px}
.hb.hbw{grid-template-columns:200px minmax(0,1fr) 110px;gap:7px 14px;font-size:14px}.hb.hbw .tr{height:14px} /* v146 : achats par fournisseur sur toute la largeur */
.hb .tr{height:10px;background:var(--sunk);border-radius:2px;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--green)}
.hb .n{text-align:right;font-variant-numeric:tabular-nums}
.hb span.hsub{font-size:12px;color:var(--muted)} .hb span.hname{padding-left:14px}
.hb .tr.hsub{height:6px} .hb .tr.hsub i{opacity:.55}
/* avoirs */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:5px 12px;font:700 13px var(--body);color:var(--fg);cursor:pointer;display:flex;gap:6px;align-items:baseline}
.chip[aria-pressed="true"]{border-color:var(--green);background:var(--green);color:var(--on-green)}
.chip[aria-pressed="true"] .c{color:var(--on-green)}
.chip .c{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 12px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:700;color:var(--muted)}
.form .wide{grid-column:1/-1}
.hist{font-size:12px;color:var(--muted)}
.empty-state{padding:32px 16px;text-align:center;color:var(--muted)}
.note{background:var(--red-soft);color:var(--fg);border-radius:var(--r);padding:10px 12px;font-size:13px;border:1px solid var(--line)}
.foot{font-size:12px;color:var(--muted);padding:8px 14px}
/* réglages (repris de GESTIME) */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.18)}
.reglages{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));right:max(16px,calc((100vw - 1280px)/2 + 16px));width:min(380px,calc(100vw - 32px));max-height:calc(100vh - 90px);overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.35);padding:16px 18px 18px;z-index:41}
.reglages .head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.reglages .head h3{margin:0;flex:1;font-family:var(--display);font-weight:800;font-size:24px;color:var(--fg);text-shadow:0 0 10px rgba(69,192,90,.45)}
.reglages .cloud{color:var(--green-2);display:grid;place-items:center}
.reglages .cloud svg{width:24px;height:24px}
.reglages .x{border:0;background:none;color:var(--fg);font-size:26px;line-height:1;cursor:pointer;padding:2px 4px}
.reglages h4{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg);margin:16px 0 8px;opacity:.85}
.rbtn{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;margin-bottom:8px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);font:700 16px var(--display);color:var(--fg);cursor:pointer;text-align:left}
.rbtn:hover{border-color:var(--green-2)}
.rbtn .ic{font-size:18px;width:22px;text-align:center}
.ibtn.upd{position:relative}.ibtn.upd::after{content:"";position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--red-2);border:2px solid var(--hdr)}
.rver{font-size:13px;font-weight:700;color:var(--muted);margin:-2px 0 4px 2px}
.rtheme{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rtheme button{padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);color:var(--fg);font:700 16px var(--display);cursor:pointer}
.rtheme button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}

  --green:#3fbf3a;--green-2:#3fbf3a;--green-soft:#2d4a33;--good:#3fbf3a;--good-soft:#2d4a33;--red:#f0473d;--red-2:#f0473d;--bad:#ff7a72;
  --tab-on:#3fbf3a;--teal:#3fbf3a;--on-teal:#fff;--hdr:#151617;--panel:#2a2b2e;--bar-empty:#303134}}

.vtfn{font:800 20px var(--display)}.vtfh{margin-bottom:12px}
.vtabc{cursor:pointer}.vtabc.on{outline:2px solid var(--green)}.vtabc .v small{font-size:13px;font-weight:600;color:var(--muted)}

body.ph nav.tabs button[data-tab="fourn"],body.ph nav.tabs button[data-tab="vente"]{display:none}
body.ph nav.tabs{flex-wrap:nowrap;gap:6px}
body.ph nav.tabs button{width:auto;flex:1 1 0;min-width:0;padding:6px 4px;font-size:12px;white-space:normal;line-height:1.15;min-height:44px}
body.ph .appico{position:relative;cursor:pointer}
body.ph .appico .sw{position:absolute;left:-6px;bottom:-6px;width:18px;height:18px;border-radius:50%;background:#fff;border:1.5px solid var(--green);color:var(--green);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
body.ph .appico .sw svg{width:12px;height:12px}
body.ph #undoBtn,body.ph #redoBtn{display:none}
body.ph .kpis,body.ph .kpis-s{grid-template-columns:1fr 1fr;gap:8px}body.ph .kpis .kpi{padding:9px 10px}body.ph .kpis .kpi .v{font-size:19px}
body.ph .kpis-s .kpi{padding:9px 10px}body.ph .kpis-s .kpi .v{font-size:19px}body.ph .kpis-s .kpi .vm{font-size:13px}
body.ph .kpis-s .kpi.hl{grid-column:1/-1}
.phday .band{justify-content:space-between;padding:6px 8px}
.phday .band button{width:40px;height:34px;border-radius:8px;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.16);color:var(--on-red);font-size:20px;line-height:1;cursor:pointer}
.phday .band button:disabled{opacity:.35}
.phday .band .dl{flex:1;text-align:center;white-space:nowrap}
.phr{display:flex;align-items:center;gap:10px;padding:7px 14px;border-bottom:1px solid var(--line)}
.phr:last-child{border-bottom:none}
.phr .n{flex:1;min-width:0;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.phr .n small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.phr input{width:132px;font-size:17px;padding:8px 10px;text-align:right;font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.phr input[readonly]{background:var(--sunk)}
.phr.ca{background:var(--green-soft)}.phr.ca .n{color:var(--green)}
.phr.n1 .n,.phr.n1 input{color:var(--muted)}
.phg{padding:6px 14px 4px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--sunk);border-bottom:1px solid var(--line)}
.phr.tot{background:var(--sunk)}.phr.tot .v{font:800 17px var(--display);font-variant-numeric:tabular-nums}
.phlist{list-style:none;margin:0;padding:0}
.phlist li{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-variant-numeric:tabular-nums}
.phlist li:last-child{border-bottom:none}
.phlist li .j{width:62px;font-weight:700}.phlist li.we .j{color:var(--red)}
.phlist li .c{flex:1;text-align:right}.phlist li .a{flex:1;text-align:right;color:var(--muted)}
.phlist li.on{background:var(--green-soft);box-shadow:inset 4px 0 0 var(--green)}
.phlist li.vide .c,.phlist li.vide .a{color:var(--muted);opacity:.6}
.phlist .hd{cursor:default;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--sunk)}
.phav{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.phav.late{border-color:var(--red);box-shadow:inset 4px 0 0 var(--red),var(--shadow)}
.phav .t{display:flex;align-items:flex-start;gap:8px}.phav .t b{flex:1;font-size:16px}
.phav .m{color:var(--muted);font-size:13px;margin-top:3px}
.phav .mt{font:800 17px var(--display);color:var(--fg)}
.phav .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.phav .acts .btn{flex:1 1 auto}
body.ph .form{grid-template-columns:1fr}
body.ph .chips{gap:6px}body.ph .chips .chip{padding:5px 10px;font-size:13px}
.phnote{font-size:12px;color:var(--muted);text-align:center;margin:14px 0 4px}
#lg{position:fixed;inset:0;background:var(--bg);z-index:99;display:flex;align-items:center;justify-content:center;padding:20px}
.lgb{display:flex;flex-direction:column;gap:10px;width:min(340px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--shadow)}
.lgb h2{margin:0;font-size:20px}.lgb p{margin:0 0 4px;font-size:13px;color:var(--muted)}
.lgb input{font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.lgb #lgm{color:var(--muted);font-size:13px;min-height:1em}

const MOIS=["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
const MC=["Janv","Févr","Mars","Avr","Mai","Juin","Juil","Août","Sept","Oct","Nov","Déc"];
const STATUTS=[
  ["declare","Déclaré"],["relance","Relancé"],["accepte","Accepté"],["refuse","Refusé"]]; /* v157 : plus de « Déduit » : Accepté = avoir obtenu (déduit), terminé */
const SLABEL=Object.assign({a_reclamer:"Déclaré",reclame:"Déclaré",deduit:"Accepté"},Object.fromEntries(STATUTS));
// v52 : « À réclamer » et « Réclamé » deviennent « Déclaré » (en mémoire ; enregistré à la prochaine modification)
const avNorm=()=>S.avoirs.forEach(a=>{if(a.statut==="a_reclamer"||a.statut==="reclame")a.statut="declare";else if(a.statut==="deduit")a.statut="accepte"});
const EN_COURS=["declare","relance"];
const OBTENU=["accepte","deduit"];
const MOTIFS=["Manquant","Invendable","Inversion","Non commandé","DLC courte","Erreur de prix","Double facturation","Erreur de quantité","Autre"];
const APP_VERSION=160;
const RELANCE_JOURS=7;
const TVA_AVOIRS=1.055; // v70 : avoirs = alimentaire, TVA 5,5 % (par défaut)
const avTva=a=>a&&+a.tva===20?1.2:TVA_AVOIRS; // v158 : TVA de la déclaration ; v160 : case retirée (la déclaration ne compte plus), 5,5 % sauf anciennes fiches à 20 % — sert seulement au rapprochement « montant proche »
const DEM_MOTIFS=["Casse","DLC dépassée","Produit abîmé","Vol constaté","Consommation interne","Erreur de réception","Autre"];
const DEFAULT_COEF=0.919; // HT / TTC du tableau d'analyse de septembre 2026 (262 556,21 / 285 581,84)

const S={db:null,store:null,magasins:[],config:{},assets:null,modal:false,fourn:[],mois:{},avoirs:[],year:2026,tab:"saisie",month:new Date().getMonth(),
  fStat:"en_cours",fFourn:"",fText:"",edit:null,confirmDel:null,loaded:{f:false,m:false,a:false}};
try{S.avVue=localStorage.getItem("gesmar.avvue")||"man";S.tab=localStorage.getItem("gesmar.tab")||"saisie";if(!["bord","saisie","avoirs","fourn"].includes(S.tab))S.tab="bord"; /* v155 : onglet VENTE retiré (remplacé par GESTAT) */S.store=localStorage.getItem("gesmar.store")}catch(e){}
const P=x=>"magasins/"+S.store+"/"+x;
const slug=t=>t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"");
const storeNom=()=>(S.magasins.find(m=>m.id===S.store)||{}).nom||"—";

const eur=new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const eur2=new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",minimumFractionDigits:2,maximumFractionDigits:2});
const n2=new Intl.NumberFormat("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=v=>v==null||!isFinite(v)?"—":(v*100).toFixed(1).replace(".",",")+" %";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const parseNum=s=>{s=String(s??"").trim().replace(/\s/g,"").replace(/€/g,"").replace(",",".");if(s==="")return null;const v=Number(s);return isFinite(v)?Math.round(v*100)/100:NaN};
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const frDate=iso=>iso?iso.slice(8,10)+"/"+iso.slice(5,7)+"/"+iso.slice(2,4):"—";
const daysSince=iso=>iso?Math.floor((Date.parse(todayISO())-Date.parse(iso))/864e5):null;
const mkey=(y,m)=>y+"-"+String(m+1).padStart(2,"0");
const $=s=>document.querySelector(s);

/* ================= v154 : GESMAR Web sur téléphone =================
   Même adresse que GESTIME Web (fabz91.github.io) : une seule icône « GES » sur l'iPhone ; on passe de GESMAR à GESTIME
   en touchant l'icône du logiciel (en haut à gauche). Connexion G20 partagée avec GESTIME (même jeton, gardé sur le téléphone).
   Sur le téléphone : 3 onglets (Tableau de bord, Saisie, Avoirs), saisie d'un jour à la fois, avoirs en cartes. */
const WEBM=!window.api;
const PHW=()=>WEBM&&Math.min(window.innerWidth||9999,(screen&&screen.width)||9999)<=640;
const PH_TABS=["bord","saisie","avoirs"];
function phApply(){const on=PHW();document.body.classList.toggle("ph",on);if(on&&!PH_TABS.includes(S.tab))S.tab="bord";if(on&&S.avVue==="auto")S.avVue="man";return on}
let phW=window.innerWidth;window.addEventListener("resize",()=>{if(Math.abs(window.innerWidth-phW)<40)return;phW=window.innerWidth;const was=document.body.classList.contains("ph");if(phApply()!==was)render()});
try{if(WEBM)localStorage.setItem("ges-app","gesmar")}catch(e){}
// Toucher l'icône GESMAR : passe à GESTIME Web (même magasin)
function phSwitch(){try{localStorage.setItem("ges-app","gestime");if(S.store)localStorage.setItem("gt-store",S.store)}catch(e){}location.href="../gestime/"}
(function(){const ic=document.querySelector(".appico");if(!ic||!WEBM)return;
  ic.removeAttribute("aria-hidden");ic.setAttribute("role","button");ic.setAttribute("tabindex","0");ic.setAttribute("aria-label","Passer à GESTIME");ic.title="Passer à GESTIME";
  ic.insertAdjacentHTML("beforeend",'<span class="sw" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg></span>');
  ic.addEventListener("click",phSwitch);ic.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();phSwitch()}})})();

/* --- connexion G20 (version web) : même session que GESTIME Web ---
   horaires-auth = jeton de renouvellement (commun), horaires-auth-at = jeton d'accès en cours (commun, évite deux renouvellements). */
const GA=(()=>{const SK="horaires-auth",ID_DOM="@hotmail.com";let tok=null,exp=0,pr=null;
  const idMail=v=>{v=String(v||"").trim().toLowerCase();return !v?"":v.includes("@")?v:v+ID_DOM};
  const has=()=>{try{return !!localStorage.getItem(SK)}catch(e){return false}};
  function shared(){try{const o=JSON.parse(localStorage.getItem(SK+"-at")||"null");if(o&&o.t&&o.e>Date.now()+60000){tok=o.t;exp=o.e;return true}}catch(e){}return false}
  async function grant(c,body,g){let r;try{r=await fetch(c.url+"/auth/v1/token?grant_type="+g,{method:"POST",headers:{apikey:c.key,"Content-Type":"application/json"},body:JSON.stringify(body)})}catch(e){throw new Error("OFFLINE")}
    const j=await r.json().catch(()=>({}));
    if(!r.ok){const t=String(j.error_description||j.msg||j.message||""),x=new Error(/invalid login|invalid_credentials|invalid_grant/i.test(t+" "+(j.error_code||j.code||j.error||""))&&g==="password"?"identifiant ou mot de passe incorrect":(t||"refusé"));x.st=r.status||400;throw x}
    tok=j.access_token;exp=Date.now()+(j.expires_in||3600)*1000;
    try{localStorage.setItem(SK,j.refresh_token);localStorage.setItem(SK+"-at",JSON.stringify({t:tok,e:exp}));if(j.user&&j.user.email)localStorage.setItem(SK+"-mail",j.user.email)}catch(e){}}
  async function token(c){if(tok&&exp>Date.now()+60000)return tok;if(shared())return tok;
    let rt=null;try{rt=localStorage.getItem(SK)}catch(e){}if(!rt){const x=new Error("AUTH");x.st=401;throw x}
    if(!pr)pr=grant(c,{refresh_token:rt},"refresh_token").catch(e=>{if(e.message!=="OFFLINE"&&e.st>=400&&e.st<500)lost();throw e}).finally(()=>{pr=null});
    await pr;return tok}
  function drop(){tok=null;exp=0;try{localStorage.removeItem(SK+"-at")}catch(e){}}
  function lost(){tok=null;exp=0;try{localStorage.removeItem(SK);localStorage.removeItem(SK+"-at")}catch(e){}}
  const login=(c,id,pw)=>grant(c,{email:idMail(id),password:pw},"password");
  const who=()=>{let m="";try{m=localStorage.getItem(SK+"-mail")||""}catch(e){}return m.toLowerCase().endsWith(ID_DOM)?m.slice(0,-ID_DOM.length).toUpperCase():m};
  return{has,token,lost,drop,login,who}})();
// Code d'accès GT1 (collé une fois dans GESTIME Web ou ici) : adresse + clé publishable de Supabase, gardés sur le téléphone, jamais dans le dépôt.
function gtCfg(){try{const c=JSON.parse(localStorage.getItem("gt-cfg")||"null");if(c&&c.url&&c.key)return c}catch(e){}return null}
function gtCode(t){const m=/^GT1-([A-Za-z0-9+/=_-]+)$/.exec(String(t||"").replace(/\s+/g,""));if(!m)return null;try{const p=atob(m[1].replace(/-/g,"+").replace(/_/g,"/")).split("|");if(/^https:\/\/[a-z0-9]+\.supabase\.co$/.test(p[0])&&p[1])return{url:p[0],key:p[1]}}catch(e){}return null}
function gmLogin(msg){if(!WEBM)return;let o=$("#lg");if(!o){o=document.createElement("div");o.id="lg";document.body.appendChild(o)}
  const need=!SYNC.cfg();
  o.innerHTML=`<div class="lgb"><h2>🔒 Connexion à GESMAR</h2><p>Une seule fois sur ce téléphone : ensuite GESMAR (et GESTIME) restent connectés.</p>${need?'<input id="lgc" type="text" placeholder="Code d’accès (GT1-…)" autocomplete="off" autocapitalize="off" spellcheck="false">':""}<input id="lge" type="text" placeholder="Identifiant" autocomplete="username" autocapitalize="off" spellcheck="false"><input id="lgp" type="password" placeholder="Mot de passe" autocomplete="current-password"><button class="btn primary" id="lgo" style="padding:11px;font-size:15px">Se connecter</button><div id="lgm">${esc(msg||"")}</div></div>`}
async function gmDoLogin(){const m=$("#lgm"),ci=$("#lgc");let nc=null,c=SYNC.cfg();
  if(!c){nc=gtCode(ci&&ci.value);if(!nc){m.textContent="Code d’accès incorrect : collez-le en entier (il commence par GT1-).";return}c=nc}
  const id=$("#lge").value,pw=$("#lgp").value;if(!id.trim()||!pw){m.textContent="Tapez l’identifiant et le mot de passe.";return}
  m.textContent="Connexion…";$("#lgo").disabled=true;
  try{await GA.login(c,id,pw);if(nc)try{localStorage.setItem("gt-cfg",JSON.stringify(nc))}catch(e){}
    $("#lg").remove();SYNC.start().catch(()=>{})}
  catch(e){const b=$("#lgo");if(b)b.disabled=false;m.textContent=e.message==="OFFLINE"?"Pas de connexion internet : réessayez.":"Connexion refusée : "+e.message+"."}}
document.addEventListener("click",e=>{if(e.target.id==="lgo"){gmDoLogin();return}const b=e.target.closest('[data-act="gmLogout"]');if(!b)return;
  if(!S.gmOut){S.gmOut=1;renderModal();setTimeout(()=>{S.gmOut=0;if(S.modal)renderModal()},4000);return}
  try{["horaires-auth","horaires-auth-at","horaires-auth-mail"].forEach(k=>localStorage.removeItem(k))}catch(_){}location.reload()});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="lgp")gmDoLogin()});

/* --- Saisie sur téléphone : un jour à la fois --- */
const WD=["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"],WDL=["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
function phCols(y,key,J){const used=new Set();Object.values(J).forEach(j=>Object.keys((j&&j.achats)||{}).forEach(k=>used.add(k)));
  const mc=monthCols(key),cols=S.fourn.filter(f=>(mc.includes(f.id)&&!isInactif(f))||used.has(f.id));
  used.forEach(k=>{if(!cols.find(f=>f.id===k)&&!S.fourn.find(f=>f.id===k))cols.push({id:k,nom:k})});
  return cols.sort((a,b)=>(a.ordre??99)-(b.ordre??99))}
function phDayGo(dir){const nd=new Date(S.year,S.month+1,0).getDate();let d=(S.phDay||1)+dir;
  if(d<1){S.month--;if(S.month<0){S.month=11;S.year--}d=new Date(S.year,S.month+1,0).getDate()}
  else if(d>nd){S.month++;if(S.month>11){S.month=0;S.year++}d=1}
  S.phDay=d;S.phDayKey=mkey(S.year,S.month);render()}
function vSaisiePh(){
  const y=S.year,m=S.month,key=mkey(y,m),doc=S.mois[key]||{jours:{}},J=doc.jours||{},nd=new Date(y,m+1,0).getDate(),now=new Date();
  if(S.phDayKey!==key){S.phDayKey=key;S.phDay=now.getFullYear()===y&&now.getMonth()===m?now.getDate():1}
  const d=Math.min(Math.max(S.phDay||1,1),nd),dd=String(d).padStart(2,"0"),j=J[dd]||{},a=j.achats||{},wd=new Date(y,m,d).getDay();
  const cols=phCols(y,key,J),st=monthStats(y,m),n1st=monthStats(y-1,m),LOCK=saisieBloquee();
  const n1Day=(dx,jx)=>{if(jx.caN1!=null&&jx.caN1!=="")return jx.caN1;const t=new Date(y,m,+dx-364),k=mkey(t.getFullYear(),t.getMonth()),J1=((S.mois[k]||{}).jours)||{},d1=String(t.getDate()).padStart(2,"0");return (J1[d1]&&J1[d1].ca)||null};
  const inp=(field,val)=>`<input id="c-${dd}-${field}" data-d="${dd}" data-f="${field}" inputmode="decimal" enterkeyhint="done"${LOCK?' readonly tabindex="-1"':""} value="${val==null?"":n2.format(val)}" aria-label="${esc(field)}">`;
  const row=(cls,nom,sub,field,val)=>`<div class="phr ${cls}"><span class="n">${esc(nom)}${sub?`<small>${esc(sub)}</small>`:""}</span>${inp(field,val)}</div>`;
  // groupes (ex. DIAPAR : Épicerie, A/A, Frais) puis les autres fournisseurs
  let body="",lastG=null;
  for(const f of cols){const g=f.groupe||null;if(g&&g!==lastG){const gf=S.fourn.find(x=>x.id===g);body+=`<div class="phg">${esc(gf?gf.nom:g)}</div>`}
    if(!g&&lastG)body+=`<div class="phg">Autres fournisseurs</div>`;lastG=g;body+=row("",f.nom,"","a:"+f.id,a[f.id])}
  const tot=Object.values(a).reduce((s,v)=>s+(v||0),0);
  let lst="";for(let x=1;x<=nd;x++){const xd=String(x).padStart(2,"0"),jx=J[xd]||{},ax=Object.values(jx.achats||{}).reduce((s,v)=>s+(v||0),0),w=new Date(y,m,x).getDay();
    lst+=`<li data-phgo="${x}" class="${x===d?"on":""}${w===0?" we":""}${!jx.ca&&!ax?" vide":""}"><span class="j">${WD[w]} ${x}</span><span class="c">${jx.ca?eur.format(jx.ca):"—"}</span><span class="a">${ax?eur.format(ax):"—"}</span></li>`}
  return `${periode("mois")}
  <div class="grid kpis kpis-s" style="margin-bottom:12px">
    <div class="kpi"><span class="lbl">CA TTC du mois</span><span class="v">${eur.format(st.caTTC)}</span><span class="d">N-1 : ${n1st.caTTC?eur.format(n1st.caTTC):"—"}</span></div>
    <div class="kpi"><span class="lbl">Achats</span><span class="v">${eur.format(st.achats)}</span><span class="d">N-1 : ${n1st.achats?eur.format(n1st.achats):"—"}</span></div>
    <div class="kpi hl"><span class="lbl">Taux de marge</span><span class="v">${pct(st.tauxCorr)} <span class="vm">(${eur.format(st.marge)})</span></span><span class="d">Taux N-1 : ${n1st.ca?pct(n1st.tauxCorr):"—"}</span></div>
  </div>
  <div class="panel flush"><div class="band">Jours de ${esc(MOIS[m].toLowerCase())}</div><ul class="phlist"><li class="hd"><span class="j">Jour</span><span class="c">CA TTC</span><span class="a">Achats</span></li>${lst}</ul></div>
  <div class="gap"></div>
  <div class="panel flush phday"><div class="band"><button data-phd="-1" aria-label="Jour précédent">‹</button><span class="dl">${WDL[wd]} ${d} ${esc(MOIS[m].toLowerCase())}</span><button data-phd="1" aria-label="Jour suivant">›</button></div>
    ${LOCK?`<div class="phg" style="text-transform:none;letter-spacing:0">🔒 Import automatique des factures : saisie faite par le PC</div>`:""}
    ${row("ca","CA TTC","","ca",j.ca)}
    ${row("n1","CA N-1","même jour l'an dernier","caN1",n1Day(dd,j))}
    ${body}
    <div class="phr tot"><span class="n">Total achats du jour</span><span class="v">${tot?eur2.format(tot):"—"}</span></div>
  </div>
  <p class="phnote">Démarque, factures et colonnes : sur le PC.</p>`}
document.addEventListener("click",e=>{const b=e.target.closest("[data-phd],[data-phgo]");if(!b||!document.body.classList.contains("ph"))return;
  if(b.dataset.phd){phDayGo(+b.dataset.phd);window.scrollTo({top:Math.max(0,($(".phday")||{}).offsetTop-70||0)});return}
  S.phDay=+b.dataset.phgo;S.phDayKey=mkey(S.year,S.month);render();const p=$(".phday");if(p)p.scrollIntoView({block:"start"})});

/* --- Avoirs sur téléphone : une carte par avoir --- */
function vAvoirsPh(){
  const all=S.avoirs;const cnt=k=>k==="en_cours"?all.filter(a=>EN_COURS.includes(a.statut)):k==="tous"?all:all.filter(a=>a.statut===k);
  const sum=l=>l.reduce((s,a)=>s+(a.montant||0),0);
  let list=cnt(S.fStat);if(S.fFourn)list=list.filter(a=>a.fournisseur===S.fFourn);
  list=list.slice().sort((a,b)=>(isLate(b)-isLate(a))||String(b.date).localeCompare(String(a.date)));
  const chip=(k,l)=>{const c=cnt(k);return `<button class="chip" data-fstat="${k}" aria-pressed="${S.fStat===k}">${l}<span class="c">${c.length} · ${eur.format(sum(c))}</span></button>`};
  const card=a=>{const la=lastAction(a),ds=daysSince(la),late=isLate(a),enc=EN_COURS.includes(a.statut);
    return `<div class="phav${late?" late":""}"><div class="t"><b>${esc(a.produit)}</b><span class="pill s-${a.statut}">${SLABEL[a.statut]||a.statut}</span></div>
      <div class="m">${esc(fName(a.fournisseur))} · ${frDate(a.date)}${a.quantite?" · "+esc(a.quantite):""} · ${esc(a.motif)}</div>
      ${a.code||a.facture?`<div class="m">${a.code?"Code "+esc(a.code):""}${a.code&&a.facture?" · ":""}${a.facture?"Facture "+esc(a.facture):""}</div>`:""}
      ${a.infos?`<div class="m">${esc(a.infos)}</div>`:""}
      <div class="m"><span class="mt">${a.montant?eur2.format(a.montant)+" HT":`<span class="pill s-a_reclamer">à chiffrer</span>`}</span> · ${late?"⚠️ ":""}dernière action ${frDate(la)}${ds!=null&&enc?` (${ds} j)`:""}${(a.relances||[]).length?` · ${a.relances.length} relance${a.relances.length>1?"s":""}`:""}</div>
      <div class="acts">${enc?`<button class="btn small" data-relance="${a.id}">Relancer</button>${avDetBtn(a)}<button class="btn small" data-setst="refuse" data-id="${a.id}">Refusé</button>`:""}<button class="btn small" data-edit="${a.id}">Modifier</button></div></div>`};
  return `<div class="row" style="margin-bottom:10px;gap:8px"><select id="fFourn" aria-label="Fournisseur" style="flex:1;min-width:0"><option value="">Tous les fournisseurs</option>${avOptsMois(S.fFourn)}</select><button class="btn red" data-act="new">+ Nouveau</button></div>
  <div class="chips">${chip("en_cours","En cours")}${STATUTS.map(([k,l])=>chip(k,l)).join("")}${chip("tous","Tous")}</div>
  <div class="gap"></div>
  ${S.edit?vForm():""}
  ${list.length?list.map(card).join(""):`<div class="empty-state">Aucun avoir dans ce filtre. Touchez « + Nouveau » pour en créer un.</div>`}
  <p class="phnote">En rouge : sans nouvelle depuis ${RELANCE_JOURS} jours.</p>`}

/* ---------- affichage clair / sombre (comme GESTIME) ---------- */
function getTheme(){try{return localStorage.getItem("gesmar.theme")}catch(e){return null}}
function applyTheme(){const t=getTheme();if(t==="clair")document.documentElement.dataset.theme="light";else if(t==="sombre")document.documentElement.dataset.theme="dark"}
function setTheme(t){try{localStorage.setItem("gesmar.theme",t)}catch(e){};applyTheme();render()}

applyTheme();

/* ---------- annuler / rétablir (flèches du bandeau) ----------
   Chaque écriture garde l'état précédent du document ; les écritures faites dans la même seconde forment une seule action. */
const HIST={undo:[],redo:[],lastT:0,busy:false};
const deepCopy=o=>o==null?null:JSON.parse(JSON.stringify(o));
function wrapDb(db){
  const rec=async(path,fn)=>{
    if(HIST.busy||path.startsWith("config/"))return fn();
    let before;try{const sn=await db.doc(path).get();before=sn.exists?deepCopy(sn.data()):null}catch(e){before=undefined}
    const r=await fn();
    if(before!==undefined){const now=Date.now(),ent={path,before};
      if(now-HIST.lastT<800&&HIST.undo.length)HIST.undo[HIST.undo.length-1].push(ent);else HIST.undo.push([ent]);
      HIST.lastT=now;if(HIST.undo.length>80)HIST.undo.shift();HIST.redo=[];updHist()}
    return r};
  const wd=path=>{const r=db.doc(path);return{id:r.id,path,get:()=>r.get(),onSnapshot:(a,b)=>r.onSnapshot(a,b),collection:p=>wc(path+"/"+p),
    set:b=>rec(path,()=>r.set(b)),update:b=>rec(path,()=>r.update(b)),delete:()=>rec(path,()=>r.delete())}};
  const wc=path=>{const c=db.collection(path);return{path,get:()=>c.get(),onSnapshot:(a,b)=>c.onSnapshot(a,b),
    doc:id=>wd(id?path+"/"+id:c.doc().path),add:async b=>{const ref=wd(c.doc().path);await ref.set(b);return ref}}};
  return{doc:wd,collection:wc,raw:db};
}
function updHist(){const u=$("#undoBtn"),r=$("#redoBtn");if(u)u.disabled=!HIST.undo.length||HIST.busy;if(r)r.disabled=!HIST.redo.length||HIST.busy}
async function histStep(from,to,msg){
  const g=from.pop();if(!g||!S.db)return;HIST.busy=true;updHist();const back=[];
  try{for(const e of g.slice().reverse()){const ref=S.db.raw.doc(e.path);const sn=await ref.get();back.push({path:e.path,before:sn.exists?deepCopy(sn.data()):null});
      if(e.before==null)await ref.delete();else await ref.set(e.before)}
    to.push(back);toast(msg)}catch(err){fail(err)}finally{HIST.busy=false;updHist()}}
const undo=()=>histStep(HIST.undo,HIST.redo,"Modification annulée");
const redo=()=>histStep(HIST.redo,HIST.undo,"Modification rétablie");

  const k=e.key.toLowerCase();if(k==="z"&&!e.shiftKey){e.preventDefault();undo()}else if(k==="y"||(k==="z"&&e.shiftKey)){e.preventDefault();redo()}});

async function majPc(){if(S.majBusy)return;S.majSeenV=S.majNew||0;majFlag();S.majBusy=true;S.majMsg="Recherche…";render();

const colFourn=()=>S.fourn.filter(f=>f.colonne);
// v74 : chaque mois a sa propre liste de colonnes affichées (champ « colonnes » du mois). Un mois sans liste suit la liste par défaut
// (fournisseurs « colonne »), qui devient la dernière liste modifiée : un nouveau mois démarre donc comme le dernier mois arrangé.
const monthCols=key=>{const d=S.mois[key];return d&&Array.isArray(d.colonnes)?d.colonnes.slice():colFourn().map(f=>f.id)};
const usedInYear=y=>{const u=new Set();Object.entries(S.mois).forEach(([k,d])=>{if(k.startsWith(y+"-")&&d&&d.jours)Object.values(d.jours).forEach(j=>Object.entries((j&&j.achats)||{}).forEach(([id,v])=>{if(v)u.add(id)}))});return u};
async function setMonthCols(key,ids){
  try{const glob=colFourn().map(f=>f.id);
    // les mois déjà créés qui suivaient la liste par défaut gardent leur affichage actuel
    for(const[k,d]of Object.entries(S.mois))if(/^\d{4}-\d{2}$/.test(k)&&k!==key&&d&&!Array.isArray(d.colonnes))await S.db.doc(P("mois/"+k)).update({colonnes:glob});
    const ref=S.db.doc(P("mois/"+key));if(S.mois[key])await ref.update({colonnes:ids});else await ref.set({annee:+key.slice(0,4),mois:+key.slice(5,7),jours:{},colonnes:ids});
    for(const f of S.fourn){const w=ids.includes(f.id);if(!!f.colonne!==w)await S.db.doc(P("fournisseurs/"+f.id)).update({colonne:w})}
  }catch(e){fail(e)}}
const fName=k=>(S.fourn.find(f=>f.id===k)||{}).nom||k;
const grp=k=>{const f=S.fourn.find(x=>x.id===k);return f&&f.groupe?f.groupe:null};
const coef=()=>{const c=S.reglages&&+S.reglages.coefHT;return c>0.5&&c<=1?c:DEFAULT_COEF};
let AVP={a:null,b:null,s:null};
function avPendants(){if(AVP.a!==S.avoirs||AVP.b!==S.avoirsAuto){AVP={a:S.avoirs,b:S.avoirsAuto,s:new Set(Object.keys(typeof facPourDecl==="function"?facPourDecl():{}))}}return AVP.s}
/* v130 (règle du gérant) : une déclaration DIAPAR (DIAPAR ou ses rayons), même Acceptée ou Déduite, ne compte JAMAIS dans « Après avoirs » : DIAPAR la déduit sur une facture (déjà dans les achats).
   Seul un avoir DIAPAR à part (facture DIAPAR négative, lue dans « Avoir sur facture », sans dansFacture) compte. Les avoirs lus dans une facture DIAPAR (dansFacture) ne comptent jamais et ne sont jamais retirés de la saisie. */
const avDiapar=id=>id==="diapar"||grp(id)==="diapar";
/* v159 (règle du gérant) : bouton « Détecter » d'une déclaration : grisé tant qu'aucun avoir sur facture ne lui correspond ; clignote dès qu'un avoir sur facture
   la détecte (proposition à valider) ; clic = ouvre « Avoir sur facture » sur cet avoir. On n'accepte plus une déclaration à la main. */
function avDetBtn(a){const p=avPendants().has(a.id)&&(facPourDecl()[a.id]||{}).x;
  return p?`<button class="btn small det on" data-avdet="${esc(p.id)}" title="Un avoir sur facture correspond : cliquez pour le voir et valider">Détecter</button>`:`<button class="btn small det" disabled title="Aucun avoir sur facture ne correspond pour l'instant">Détecter</button>`}
/* v141 : avoirs obtenus (mêmes règles que la pastille) avec leur date de comptage : {d, v TTC} */
let AVO={a:null,b:null,c:null,L:null};
function avoirsObtenus(){const PEND=avPendants();if(AVO.L&&AVO.a===S.avoirs&&AVO.b===S.avoirsAuto&&AVO.c===PEND)return AVO.L;const L=[];
  /* v159 (règle du gérant) : seuls les avoirs sur facture comptent ; une déclaration ne compte plus jamais (elle sert à retrouver l'avoir et à le dater) */
  for(const x of (S.avoirsAuto||[])){const dm=x.manuel&&(S.avoirs.find(z=>z.id===x.manuel)||{}).date,dt=dm||x.date;if(!x.dansFacture&&x.total&&dt)L.push({d:String(dt),v:Math.abs(+x.total)})}
  AVO={a:S.avoirs,b:S.avoirsAuto,c:PEND,L};return L}
function monthStats(y,m){
  const doc=S.mois[mkey(y,m)];const r={ca:0,caTTC:0,caN1:0,achats:0,par:{},jours:0,estimes:0,avoirs:0};
  if(doc&&doc.jours){for(const j of Object.values(doc.jours)){if(!j)continue;
    if(j.ca){r.jours++;r.caTTC+=j.ca;r.ca+=j.ca} /* v51 : tout en TTC (CA, achats, avoirs) */ if(j.caN1)r.caN1+=j.caN1;
    for(const [k,v] of Object.entries(j.achats||{})){if(v){r.achats+=v;r.par[k]=(r.par[k]||0)+v}}}}
  /* v51 : plus de HT : le CA HT du mois et le HT par jour ne sont plus utilisés */
  {const k=mkey(y,m);for(const a of avoirsObtenus())if(a.d.startsWith(k))r.avoirs+=a.v} /* v124-v130 : règles dans avoirsObtenus() */
  r.demarque=(doc&&Array.isArray(doc.demarque))?doc.demarque.reduce((t,x)=>t+(+x.montant||0),0):0;
  /* v141 : marge et taux = avoirs compris partout (pastilles, graphique, récapitulatif, N-1, inventaires) */
  r.margeBrute=r.ca-r.achats;r.marge=r.margeBrute+r.avoirs;r.taux=r.ca?r.marge/r.ca:null;r.tauxCorr=r.taux;r.tauxHD=r.ca?(r.marge+r.demarque)/r.ca:null;return r}
const dayISO=(y,m,d)=>y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
/* Totaux entre deux inventaires : jours strictement après d1, jusqu'à d2 inclus (stock compté le soir de l'inventaire). */
function periodStats(d1,d2){
  const r={ca:0,caTTC:0,achats:0,demarque:0,jours:0,estimes:0,avoirs:0};
  for(const a of avoirsObtenus())if(a.d>d1&&a.d<=d2)r.avoirs+=a.v; /* v141 : avoirs obtenus de la période */
  let y=+d1.slice(0,4),m=+d1.slice(5,7)-1;const ye=+d2.slice(0,4),me=+d2.slice(5,7)-1;
  while(y<ye||(y===ye&&m<=me)){
    const first=dayISO(y,m,1),last=dayISO(y,m,new Date(y,m+1,0).getDate());const doc=S.mois[mkey(y,m)];
    if(first>d1&&last<=d2){const t=monthStats(y,m);r.ca+=t.ca;r.caTTC+=t.caTTC;r.achats+=t.achats;r.demarque+=t.demarque;r.jours+=t.jours;r.estimes+=t.estimes}
    else if(doc){
      for(const[dd,j]of Object.entries(doc.jours||{})){const iso=dayISO(y,m,+dd);if(!j||iso<=d1||iso>d2)continue;
        if(j.ca){r.jours++;r.caTTC+=j.ca;r.ca+=j.ca} /* v51 : tout en TTC (CA, achats, avoirs) */
        for(const v of Object.values(j.achats||{}))r.achats+=v||0}
      for(const x of(doc.demarque||[]))if(x.date>d1&&x.date<=d2)r.demarque+=+x.montant||0}
    m++;if(m>11){m=0;y++}}
  return r}
// v72 : dernière activité = dernière relance, déclaration ou changement de statut (Accepté) ; un avoir déclaré, relancé ou accepté sans activité depuis 7 jours passe en rouge
function lastAction(a){const l=[...(a.relances||[]),a.dateReclamation||a.date,a.dateStatut||(a.statut==="accepte"?a.majLe:null)].filter(Boolean).sort();return l.length?l[l.length-1]:null}
function isLate(a){return EN_COURS.includes(a.statut)&&daysSince(lastAction(a))>=RELANCE_JOURS}

function vBord(){
  const y=S.year;const ms=MOIS.map((_,m)=>monthStats(y,m));const act=ms.filter(s=>s.ca>0);
  // comparaison avec l'année précédente : CA et taux du même mois (sinon colonne N-1 saisie à la main)
  const pv=MOIS.map((_,m)=>monthStats(y-1,m));
  ms.forEach((s,m)=>{const p=pv[m];s.n1=p.caTTC||s.caN1||0;s.n1Taux=p.ca&&p.jours>=20?p.taux:null;s.n1Inc=p.caTTC>0&&p.jours<20});
  const comp=ms.map((s,m)=>[s,pv[m],m]).filter(([s,p])=>s.jours>=20&&p.jours>=20);
  const C=comp.reduce((a,[s,p])=>({n:a.n+s.caTTC,p:a.p+p.caTTC,nHT:a.nHT+s.ca,pHT:a.pHT+p.ca,nA:a.nA+s.achats-s.avoirs,pA:a.pA+p.achats-p.avoirs}),{n:0,p:0,nHT:0,pHT:0,nA:0,pA:0});
  const evo=C.p?C.n/C.p-1:null, tN=C.nHT?(C.nHT-C.nA)/C.nHT:null, tP=C.pHT?(C.pHT-C.pA)/C.pHT:null;
  const compLbl=comp.length?(comp.length===1?MOIS[comp[0][2]]:`${MC[comp[0][2]]}–${MC[comp[comp.length-1][2]]}`):"";
  const pAct=pv.filter(p=>p.ca>0&&p.jours>=20);const PT=pAct.reduce((a,p)=>({ca:a.ca+p.ca,ac:a.ac+p.achats-p.avoirs}),{ca:0,ac:0});const tauxPrev=PT.ca?(PT.ca-PT.ac)/PT.ca:null;
  const pts=(a,b)=>a==null||b==null?"—":((a-b)*100>=0?"+":"−")+Math.abs((a-b)*100).toFixed(1).replace(".",",")+" pt";
  const T=act.reduce((a,s)=>({ca:a.ca+s.ca,caTTC:a.caTTC+s.caTTC,achats:a.achats+s.achats,avoirs:a.avoirs+s.avoirs,caN1:a.caN1+s.caN1,jours:a.jours+s.jours,estimes:a.estimes+s.estimes,n1:a.n1+s.n1,dem:a.dem+s.demarque}),{ca:0,caTTC:0,achats:0,avoirs:0,caN1:0,jours:0,estimes:0,n1:0,dem:0});
  const taux=T.ca?(T.ca-T.achats+T.avoirs)/T.ca:null, tauxC=taux; /* v141 : avoirs compris */
  /* v142 : N-1 des pastilles = mêmes mois de l'année d'avant (mois avec du CA cette année) */
  const P1=ms.reduce((a,s,m)=>s.ca>0?{ca:a.ca+pv[m].ca,achats:a.achats+pv[m].achats,avoirs:a.avoirs+pv[m].avoirs,dem:a.dem+pv[m].demarque}:a,{ca:0,achats:0,avoirs:0,dem:0});
  const enc=S.avoirs.filter(a=>EN_COURS.includes(a.statut));const encM=enc.reduce((s,a)=>s+(a.montant||0),0);
  const late=S.avoirs.filter(isLate);const sansMontant=enc.filter(a=>!a.montant).length;
  const actF=act.filter(s=>s.jours>=20); /* v144 : meilleur / plus faible mois parmi les mois d'au moins 20 jours */
  const best=actF.length?actF.reduce((a,b)=>a.taux>b.taux?a:b):null, worst=actF.length?actF.reduce((a,b)=>a.taux<b.taux?a:b):null;
  /* v144 : meilleur / plus faible mois du CA et des achats (mois d'au moins 20 jours) */
  const full=act.filter(s=>s.jours>=20);const bestCA=full.length?full.reduce((a,b)=>a.caTTC>b.caTTC?a:b):null,worstCA=full.length?full.reduce((a,b)=>a.caTTC<b.caTTC?a:b):null;
  const fullA=full.filter(s=>s.achats);const bestAc=fullA.length?fullA.reduce((a,b)=>a.achats>b.achats?a:b):null,worstAc=fullA.length?fullA.reduce((a,b)=>a.achats<b.achats?a:b):null;
  // achats par fournisseur
  const par={};act.forEach(s=>{for(const[k,v]of Object.entries(s.par))par[k]=(par[k]||0)+v});
  // v73 : plus aucun regroupement par nom (SAINT PRIM, ISLA, MARIANO, MONTPERAL : chaque fournisseur sur sa ligne) ;
  // v80 : classés du plus gros au plus petit montant d'achats (rayons de DIAPAR aussi) ; seuls les fournisseurs avec des achats dans l'année sont affichés
  const nkD=t=>String(t||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/gi,"").toUpperCase();
  const ordOne=k=>{const o=S.fourn.filter(f=>f.id===k||f.groupe===k).map(f=>f.ordre).filter(x=>x!=null);return o.length?Math.min(...o):999};
  const ordOf=k=>nkD(fName(k))==="DIAPAR"?-1:ordOne(k);
  const G={};for(const[k,v]of Object.entries(par)){const g=grp(k)||k;G[g]=G[g]||{tot:0,sub:{}};G[g].tot+=v;if(grp(k))G[g].sub[k]=(G[g].sub[k]||0)+v}

  const P1f=k=>Object.entries(par1).filter(([j])=>j===k||grp(j)===k).reduce((t,[,v])=>t+v,0);
  const evoF=e=>(e>=0?"+":"")+pct(e);

    return `<tr class="${sub?"afsub":""}"><td class="l">${esc(fName(k))}</td><td>${eur.format(v)}</td><td class="l"><span class="afbar"><i style="width:${Math.max(0,pa*100).toFixed(1)}%"></i></span><span class="afp">${pct(pa)}</span></td><td>${n1?eur.format(n1):"—"}</td><td>${e==null?"—":evoF(e)}</td></tr>`};
  const hbRow=(k,v,sub)=>`<span class="${sub?"hsub hname":""}">${esc(fName(k))}</span><span class="tr ${sub?"hsub":""}"><i style="width:${(v/maxP*100).toFixed(1)}%"></i></span><span class="n ${sub?"hsub":""}">${eur.format(v)}</span>`;
  return `
  ${periode("annee")}

    <div class="kpi ${evo==null?"":evo>=0?"hl":"alert"}"><span class="lbl">CA vs ${y-1}</span><span class="v">${evo==null?"—":(evo>=0?"+":"")+pct(evo)}</span><span class="d" ${comp.length?`title="Marge ${pct(tN)} contre ${pct(tP)} (${pts(tN,tP)}) sur les mêmes mois"`:""}>${comp.length?`${compLbl}, mois comparables`:`Pas de mois complet en ${y-1}`}</span></div>
  </div>

/* v144 : graphique mensuel générique (année en vert, N-1 en rose), même présentation que l'ancien « Taux de marge par mois » */
function chartM(cur,prev,inc,yr,kind,title){
  const W=1180,H=270,pl=44,pr=8,pt=30,pb=24; /* v145 : graphiques sur toute la largeur */
  const vals=[...cur,...prev].filter(v=>v!=null&&isFinite(v));
  let step,mx;
  if(kind==="pct"){mx=Math.max(0.4,...vals.map(v=>Math.ceil(v*10)/10));step=0.1}
  else{const m=Math.max(1,...vals);const raw=m/4,p10=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p10;step=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p10;mx=Math.ceil(m/step)*step}
  const ax=v=>kind==="pct"?Math.round(v*100)+"%":(v>=1000?Math.round(v/1000)+"k":Math.round(v));
  const lab=v=>kind==="pct"?(v*100).toFixed(0):(v>=1000?Math.round(v/1000):Math.round(v));
  const full=v=>kind==="pct"?pct(v):eur.format(v);
  const bw=(W-pl-pr)/12;const y=v=>pt+(H-pt-pb)*(1-v/mx);
  let g="";for(let t=0;t<=mx+1e-9;t+=step){g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end">${ax(t)}</text>`}
  const hasP=prev.some(v=>v!=null);
  const bars=cur.map((c,i)=>{const cx=pl+i*bw+bw/2;const lb=`<text x="${cx}" y="${H-6}" text-anchor="middle">${MC[i]}</text>`;
    const w=hasP?bw*0.3:bw*0.5;const xN=hasP?cx+2:cx-w/2,xP=cx-w-2;let out="";const pv=prev[i];
    if(hasP&&pv!=null){const v=Math.max(0,pv);out+=`<rect x="${xP}" y="${y(v)}" width="${w}" height="${y(0)-y(v)}" rx="2" fill="var(--n1)"><title>${MOIS[i]} ${yr-1} : ${full(pv)}</title></rect><text class="vl1" x="${xP+w/2}" y="${y(v)-5}" text-anchor="middle">${lab(pv)}</text>`} /* v146 : valeur N-1 aussi */
    if(c==null)return out+`<rect x="${xN}" y="${y(0)-3}" width="${w}" height="3" fill="var(--bar-empty)"/>`+lb;
    const v=Math.max(0,c);return out+`<rect x="${xN}" y="${y(v)}" width="${w}" height="${y(0)-y(v)}" rx="2" fill="var(--accent)" opacity="${inc[i]?0.45:1}"><title>${MOIS[i]} ${yr} : ${full(c)}${inc[i]?" (mois incomplet)":""}</title></rect><text class="vl" x="${xN+w/2}" y="${y(v)-5}" text-anchor="middle">${lab(c)}</text>`+lb}).join("");
  const leg=hasP?`<rect x="${W-pr-118}" y="6" width="10" height="10" rx="2" fill="var(--n1)"/><text x="${W-pr-104}" y="15">${yr-1}</text><rect x="${W-pr-62}" y="6" width="10" height="10" rx="2" fill="var(--accent)"/><text x="${W-pr-48}" y="15">${yr}</text>`:"";
  const unit=kind==="pct"?"":`<text x="4" y="15">en k€</text>`;
  return `<div class="scroll"><svg class="chm" viewBox="0 0 ${W} ${H}" width="100%" style="min-width:600px;display:block" role="img" aria-label="${esc(title)}, ${yr} comparé à ${yr-1}">${g}${bars}${leg}${unit}</svg></div>`;
}

function vSaisie(){

  const mc=monthCols(key),cols=S.fourn.filter(f=>(mc.includes(f.id)&&!isInactif(f))||used.has(f.id)); // v77 : un fournisseur qui a des montants ce mois reste affiché
  used.forEach(k=>{if(!cols.find(f=>f.id===k)&&!S.fourn.find(f=>f.id===k))cols.push({id:k,nom:k})});

  cols.sort((a,b)=>(a.ordre??99)-(b.ordre??99));

      ${runs.map(r=>r.mem.map(f=>{const pdf=a[f.id]&&FD&&FD[key+"-"+dd+"|"+f.id];return `<td class="${r.groupe?"":"fc"}${pdf?" hasfac":""}">${cell(dd,"a:"+f.id,a[f.id])}${pdf?`<button class="facdoc" data-facdoc="${esc(pdf.join("\n"))}" title="Ouvrir la facture (PDF)" aria-label="Ouvrir la facture"><svg viewBox="0 0 12 14" aria-hidden="true"><path d="M1.5 .5h6l3 3v10h-9z" fill="currentColor" fill-opacity=".18" stroke="currentColor"/><path d="M7.5 .5v3h3M3.5 7h5M3.5 9.5h5" stroke="currentColor" fill="none"/></svg></button>`:""}</td>`}).join("")).join("")}<td class="calc">${tot?n2.format(tot):""}</td></tr>`}

function fUsage(id){const ans=new Set();Object.entries(S.mois).forEach(([k,d])=>{if(d&&d.jours&&Object.values(d.jours).some(j=>j&&j.achats&&j.achats[id]))ans.add(k.slice(0,4))});
  return {ans:[...ans].sort(),av:S.avoirs.filter(a=>a.fournisseur===id).length}}
const isRayon=f=>!!f.groupe,isParent=f=>S.fourn.some(x=>x.groupe===f.id);
const isInactif=f=>f.actif===false||!!f.supprime; // v79 : fournisseur inactif (retiré, avec historique)
// v106 : onglet Fournisseurs en cartes : saisie du mois en cours, dernière facture, alerte « facture en retard », avoirs en cours, mail, facture modèle
function fIds(f){return isParent(f)?[f.id,...S.fourn.filter(x=>x.groupe===f.id).map(x=>x.id)]:[f.id]}
function fRythme(ids){const set=new Set(ids),t=todayISO(),min=new Date(Date.now()-200*864e5).toISOString().slice(0,10),D=new Set();
  Object.entries(S.mois).forEach(([k,d])=>{if(!/^\d{4}-\d{2}$/.test(k)||!d||!d.jours)return;Object.entries(d.jours).forEach(([dd,j])=>{const iso=k+"-"+dd;if(iso<min||iso>t)return;if(Object.entries((j&&j.achats)||{}).some(([id,v])=>set.has(id)&&v))D.add(iso)})});
  const L=[...D].sort();if(!L.length)return null;const last=L[L.length-1],since=daysSince(last);
  if(L.length<4)return {last,since};
  const g=[];for(let i=1;i<L.length;i++)g.push((Date.parse(L[i])-Date.parse(L[i-1]))/864e5);g.sort((a,b)=>a-b);const med=g[Math.floor(g.length/2)];
  return {last,since,med,retard:since>Math.max(med*2,med+7)&&since<=120}}
function fDerniere(f){const ids=new Set(fIds(f));if(isParent(f))ids.add("diapar");let best=null;
  Object.entries(S.facImp||{}).forEach(([k,x])=>{if(x&&x.s==="i"&&ids.has(x.f)&&(!best||String(x.d)>String(best.x.d)))best={k,x}});return best}
function vFourn(){

  const mt=f=>fIds(f).reduce((s,id)=>s+(tot[id]||0),0);
  const tri=(a,b)=>mt(b)-mt(a)||nk(a.nom).localeCompare(nk(b.nom)); // classement silencieux : les plus gros d'abord
  const act=S.fourn.filter(f=>!isInactif(f)&&!isRayon(f)).sort(tri),ina=S.fourn.filter(f=>isInactif(f)&&!f.supprime&&!isRayon(f)).sort(tri),sup=S.fourn.filter(f=>f.supprime&&!isRayon(f)&&!isParent(f)); // v112 : supprimés = cachés partout, gardés en mémoire

    return `<div class="fcard">

async function saveCell(inp){
  if(saisieBloquee()&&inp.readOnly)return;
  const d=inp.dataset.d,f=inp.dataset.f;const v=parseNum(inp.value);
  if(Number.isNaN(v)){toast("Montant illisible : utilisez des chiffres, par ex. 1234,56");inp.focus();return}
  const key=mkey(S.year,S.month);const doc=S.mois[key];const j=(doc&&doc.jours&&doc.jours[d])||{};
  const old=f.startsWith("a:")?(j.achats||{})[f.slice(2)]:j[f];if((old??null)===v)return;
  const patch=f.startsWith("a:")?{achats:{[f.slice(2)]:v}}:{[f]:v};
  const ref=S.db.doc(P("mois/"+key));
  try{ if(doc) await ref.update({jours:{[d]:patch}}); else await ref.set({annee:S.year,mois:S.month+1,jours:{[d]:patch}}) }catch(e){fail(e)}
}

/* v115 : import de la démarque exportée de Videor (Casses et Démarques → sélectionner tout → Export, fichier CSV « ; »).
   Une ligne par article ; on garde un relevé par n° (NODOC) : date (DATE_DOC), total TTC (TOT_TTC, prix d'achat), magasin (RAISOC).
   Chaque relevé devient une ligne de démarque connue du mois de sa date (motif « Videor », detail « Relevé n° … », champ videor = n°).
   Un relevé déjà importé n'est jamais ajouté deux fois ; s'il a changé dans Videor (montant ou date), sa ligne est corrigée. */
function demVideorChoisir(){const inp=document.createElement("input");inp.type="file";inp.accept=".csv,text/csv,.txt";
  inp.onchange=async()=>{const f=inp.files&&inp.files[0];if(!f)return;try{const buf=await f.arrayBuffer();let t;try{t=new TextDecoder("utf-8",{fatal:true}).decode(buf)}catch(_){t=new TextDecoder("windows-1252").decode(buf)}await demVideorImporter(t)}catch(e){console.error(e);toast("Lecture du fichier impossible")}};inp.click()}
function demVideorLire(t){const L=String(t).replace(/^\ufeff/,"").split(/\r?\n/).filter(x=>x.trim());if(!L.length)return null;
  const H=L[0].split(";").map(x=>x.trim().toUpperCase()),ix=n=>H.indexOf(n);
  const iN=ix("NODOC"),iD=ix("DATE_DOC"),iT=ix("TOT_TTC"),iH=ix("TOT_HT"),iR=ix("RAISOC"),iTy=ix("TYPDOC");if(iN<0||iD<0||iT<0)return null;
  const R={};for(const l of L.slice(1)){const c=l.split(";");const n=(c[iN]||"").trim();if(!n)continue;if(iTy>=0&&c[iTy]&&c[iTy].trim()&&c[iTy].trim()!=="Q")continue;
    const m=(c[iD]||"").match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(!m)continue;const ttc=parseFloat(String(c[iT]).replace(",","."));if(!isFinite(ttc))continue;
    R[n]={n,date:m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0"),ttc:Math.round(ttc*100)/100,ht:iH>=0?parseFloat(String(c[iH]).replace(",",".")):null,raisoc:iR>=0?(c[iR]||"").trim():""}}
  return Object.values(R).sort((a,b)=>a.date.localeCompare(b.date)||a.n.localeCompare(b.n))}
async function demVideorImporter(t){const R=demVideorLire(t);if(!R){toast("Ce fichier n'est pas un export « Casses et Démarques » de Videor (colonnes NODOC, DATE_DOC, TOT_TTC)");return}
  if(!R.length){toast("Aucun relevé dans ce fichier");return}
  const mags=[...new Set(R.map(r=>FAC.magasin(r.raisoc||"")).filter(Boolean))];
  if(mags.length>1){toast("Ce fichier mélange plusieurs magasins : exportez-les séparément");return}
  if(mags.length&&mags[0]!==S.store){const g=S.magasins.find(x=>x.id===mags[0]);toast("Ce fichier concerne "+(g?g.nom:mags[0])+" : changez de magasin (maison) puis réimportez");return}
  // où est déjà chaque relevé (tous les mois du magasin)
  const ou={};Object.entries(S.mois).forEach(([k,d])=>{(Array.isArray(d&&d.demarque)?d.demarque:[]).forEach((x,i)=>{if(x&&x.videor)ou[x.videor]={k,i,x}})});
  const nouv=R.filter(r=>!ou[r.n]),modif=R.filter(r=>ou[r.n]&&(ou[r.n].x.date!==r.date||Math.abs((+ou[r.n].x.montant||0)-r.ttc)>0.004));
  if(!nouv.length&&!modif.length){toast("Démarque Videor déjà à jour ("+R.length+" relevé(s) déjà importé(s))");return}
  const tot=nouv.reduce((s,r)=>s+r.ttc,0),mois=[...new Set(nouv.concat(modif).map(r=>r.date.slice(0,7)))].sort().map(k=>MOIS[+k.slice(5)-1].toLowerCase()+" "+k.slice(0,4));
  if(!await askConfirm("Importer la démarque Videor dans "+storeNom()+" ?\n\n"+nouv.length+" nouveau(x) relevé(s) : "+eur2.format(tot)+" TTC"+(modif.length?"\n"+modif.length+" relevé(s) modifié(s) dans Videor : corrigé(s)":"")+(R.length-nouv.length-modif.length?"\n"+(R.length-nouv.length-modif.length)+" déjà importé(s) : ignoré(s)":"")+"\n\nMois : "+mois.join(", ")))return;
  const parMois={};const get=k=>parMois[k]||(parMois[k]=(Array.isArray(S.mois[k]&&S.mois[k].demarque)?S.mois[k].demarque:[]).slice());
  for(const r of modif){const o=ou[r.n],a=get(o.k);const i=a.findIndex(x=>x&&x.videor===r.n);if(i>=0)a.splice(i,1)}
  for(const r of nouv.concat(modif))get(r.date.slice(0,7)).push({date:r.date,motif:"Videor",detail:"Relevé n° "+String(+r.n||r.n),montant:r.ttc,videor:r.n});
  try{HIST.lastT=Date.now();for(const[k,a]of Object.entries(parMois)){const ref=S.db.doc(P("mois/"+k));if(S.mois[k])await ref.update({demarque:a});else await ref.set({annee:+k.slice(0,4),mois:+k.slice(5,7),jours:{},demarque:a})}
    toast("Démarque Videor : "+nouv.length+" relevé(s) ajouté(s)"+(modif.length?", "+modif.length+" corrigé(s)":""));render()}catch(e){fail(e)}}

const FAC=(()=>{

  // Documents qui ne sont pas des factures (bons de livraison, relevés, extraits de compte, RIB, commandes…)

    if(m){r.date=iso(m[4],m[3],m[2]);r.numero=m[5];r.rayon=m[1].toUpperCase()}else{r.verif.push("Nom de fichier DIAPAR inhabituel")}

    const avoir=pos==null&&neg!=null;r.type=avoir?"avoir":"facture";

    let col="epicerie";
    if(r.rayon==="FRAIS"){const th=L.some(l=>/^\s*THERMOTAINER\s+N/i.test(l.t)),pa=L.some(l=>/^\s*PALETTE\s+N/i.test(l.t));

      else{col=avoir?"frais":ttc!=null&&ttc<3000?"aa":"frais";r.verif.push(avoir?"Avoir : rayon FRAIS ou A/A à vérifier":"Rayon A/A ou FRAIS deviné d'après le montant")}}

  // Montant dans le texte : « 1 222,25 », « 1222,25 », « 1222.25 »

const facFournAv=id=>id==="diapar"?["diapar","epicerie","aa","frais"]:[id];
function facCandidats(x){const codes=new Set([...(x.lignes||[]).map(a=>String(a.code||"").replace(/^0+/,"")),...(x.codes||[]).map(c=>String(c).replace(/^0+/,""))].filter(Boolean));
  const out=[];
  for(const a of S.avoirs){const ded=a.statut==="accepte"||a.statut==="deduit"; /* v125 : une déclaration passée en Déduit à la main est aussi rapprochée (sinon comptée deux fois) */
    if(!(EN_COURS.includes(a.statut)||ded)||a.avoirAuto||(x.refus||[]).includes(a.id))continue;
    if(ded&&a.date&&x.date&&(Date.parse(x.date)-Date.parse(a.date))>120*864e5)continue;
    if(!facFournAv(x.fournisseur).includes(a.fournisseur))continue;
    if(a.date&&x.date&&a.date>x.date)continue;
    const c=String(a.code||"").replace(/\s/g,"").replace(/^0+/,"");let sc=0,raison="";
    if(c&&codes.has(c)){sc=10;raison="même code article ("+a.code+")"}
    else if(a.montant){const ht=a.montant,lig=(x.lignes||[]).find(l=>l.ht!=null&&Math.abs(l.ht-ht)<=0.02);
      if(lig){sc=6;raison="même montant HT ("+eur2.format(ht)+")"}
      else if(!(x.lignes||[]).length&&Math.abs(ht*avTva(a)-x.total)<=Math.max(0.05,x.total*0.01)){sc=5;raison="montant proche ("+eur2.format(x.total)+" TTC)"}}
    if(sc)out.push({a,sc,raison})}
  return out.sort((p,q)=>q.sc-p.sc)}
