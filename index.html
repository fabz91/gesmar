// v64 : fichier « GESMAR-AJOUT » préparé par Claude à partir du tableau de marge Excel. Deux façons, choisies dans le fichier :
// - mois « remplacer » : CA et achats du mois = exactement ceux du fichier (le CA N-1, la démarque et la note du mois sont gardés) ;
// - sinon : chaque case remplie du fichier remplace celle du logiciel, les autres ne bougent pas.
// Fournisseurs reconnus par leur nom (la colonne affichée d'abord) ; un nom inconnu crée une colonne. Avoirs : ajoutés sauf doublon.
const ajNk=t=>String(t||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/gi,"").toUpperCase();
function isAjout(t){try{const j=JSON.parse(t);return j&&j.app==="GESMAR-AJOUT"?j:null}catch(e){return null}}
async function applyAjout(j){
  if(!S.db||!S.store){toast("Données pas encore chargées, réessayez dans un instant");return}
  if(j.magasin&&j.magasin!==S.store){const g=S.magasins.find(m=>m.id===j.magasin);toast("Ce fichier concerne "+(g?g.nom:j.magasin)+" : changez de magasin (maison) puis réimportez");return}
  const ms=(j.mois||[]).map(m=>MOIS[+m.cle.slice(5,7)-1]+" "+m.cle.slice(0,4)+(m.remplacer?" (remplacé)":"")).join(", "),nA=(j.avoirs||[]).length;
  if(!confirm("Importer dans "+storeNom()+" :"+(ms?"\n- "+ms+"\n  CA et achats du mois = ceux du fichier (CA N-1, démarque et note gardés)":"")+(nA?"\n- "+nA+" avoir(s) (sauf ceux déjà présents)":"")+"\n\nContinuer ?"))return;
  const FI={};S.fourn.filter(f=>!f.groupe||true).slice().sort((a,b)=>(b.colonne&&b.actif!==false)-(a.colonne&&a.actif!==false)).forEach(f=>{const k=ajNk(f.nom);if(!(k in FI))FI[k]=f.id});
  let crees=0;
  const fid=async(nom,col=true)=>{const k=ajNk(nom);if(FI[k])return FI[k];let id=k.toLowerCase().slice(0,30)||"fournisseur",n=1;while(S.fourn.find(f=>f.id===id)){n++;id=k.toLowerCase().slice(0,26)+n}
    const ordre=S.fourn.reduce((m,f)=>Math.max(m,f.ordre??0),0)+1,nm=String(nom).toUpperCase();
    await S.db.doc(P("fournisseurs/"+id)).set({nom:nm,ordre,actif:true,colonne:col,avoirs:true,contact:""});S.fourn.push({id,nom:nm,ordre,actif:true,colonne:col});FI[k]=id;crees++;return id};
  let cases=0,avOk=0,avDeja=0;
  try{
    for(const mo of (j.mois||[])){const key=mo.cle,doc=S.mois[key],old=(doc&&doc.jours)||{};
      const jours=mo.remplacer?Object.fromEntries(Object.entries(old).filter(([d,v])=>v&&v.caN1!=null&&v.caN1!=="").map(([d,v])=>[d,{caN1:v.caN1}])):JSON.parse(JSON.stringify(old));
      for(const[d,v]of Object.entries(mo.jours||{})){const jj=jours[d]||{};
        if(v.ca!=null){jj.ca=v.ca;cases++} if(v.caN1!=null){jj.caN1=v.caN1;cases++}
        for(const[nom,val]of Object.entries(v.achats||{})){jj.achats=Object.assign({},jj.achats||{});
          const same=S.fourn.filter(f=>ajNk(f.nom)===ajNk(nom)).map(f=>f.id),id=same.find(x=>x in jj.achats)||await fid(nom);
          same.forEach(x=>{if(x!==id)delete jj.achats[x]});jj.achats[id]=val;cases++}
        jours[d]=jj}
      const ref=S.db.doc(P("mois/"+key));if(doc)await ref.update({jours});else await ref.set({annee:+key.slice(0,4),mois:+key.slice(5,7),jours})}
    for(const a of (j.avoirs||[])){const id=await fid(a.fournisseur,false);
      if(S.avoirs.some(x=>x.fournisseur===id&&ajNk(x.produit)===ajNk(a.produit)&&String(x.date||"")===String(a.date||"")&&ajNk(x.code)===ajNk(a.code))){avDeja++;continue}
      const t=todayISO();await S.db.collection(P("avoirs")).add({fournisseur:id,date:a.date||t,produit:a.produit||"",code:a.code||"",facture:a.facture||"",quantite:a.quantite||"",motif:a.motif||"Autre",
        montant:a.montant==null?null:a.montant,statut:a.statut||"declare",infos:a.infos||"",relances:a.relances||[],dateReclamation:a.dateReclamation||a.date||t,creeLe:t,majLe:t});avOk++}
    toast("Import terminé : "+[cases?cases+" case(s)":"",nA?avOk+" avoir(s) ajouté(s)"+(avDeja?", "+avDeja+" déjà présent(s)":""):"",crees?crees+" fournisseur(s) créé(s)":""].filter(Boolean).join(", "));render()
  }catch(e){fail(e)}}
function applyImportText(t){const aj=isAjout(t);if(aj){applyAjout(aj);return}
  try{const j=JSON.parse(t);const d=j&&j.data;if(!d||typeof d!=="object")throw 0;
    const before=Object.keys(STORE);STORE=clone(d);for(const k of Object.keys(STORE))if(k.startsWith("__meta/"))delete STORE[k];
    for(const id in META)META[id].base={};before.forEach(k=>{const m=meta(blobOf(k));m.dirty[k]=(m.dirty[k]||0)+1});SYNC.markAll();
    rawSave("gesmar-index",JSON.stringify(knownIds()));S.store=null;try{localStorage.removeItem("gesmar.store")}catch(_){};toast("Sauvegarde importée");setTimeout(()=>location.reload(),1500)}
  catch(e){toast("Fichier non reconnu : choisissez un export GESMAR (.json).")}}
function importData(file){if(!file)return;const r=new FileReader();r.onload=()=>applyImportText(r.result);r.readAsText(file)}
function importPC(){window.api.importData().then(t=>{if(t){const aj=isAjout(t);if(aj){applyAjout(aj);return}S.importPending=[["__fichier__",t]];S.modalPanel="importpc";render()}}).catch(()=>toast("Import impossible"))}

let unsubs=[];
function subscribeStore(){
  unsubs.forEach(u=>{try{u()}catch(_){}});unsubs=[];
  S.fourn=[];S.mois={};S.avoirs=[];S.inv=[];S.reglages=null;S.confirmDem=null;S.confirmInv=null;S.fFourn="";S.edit=null;S.confirmDel=null;
  if(!S.store)return render();
  const db=S.db,err=e=>console.error(e);
  unsubs.push(db.collection(P("fournisseurs")).onSnapshot(s=>{S.fourn=s.docs.map(d=>({id:d.id,...d.data()}));schedule()},err));
  unsubs.push(db.collection(P("mois")).onSnapshot(s=>{S.mois={};s.docs.forEach(d=>S.mois[d.id]=d.data());schedule()},err));
  unsubs.push(db.doc(P("reglages/general")).onSnapshot(d=>{S.reglages=d.exists?d.data():null;schedule()},err));
  unsubs.push(db.collection(P("avoirs")).onSnapshot(s=>{S.avoirs=s.docs.map(d=>({id:d.id,...d.data()}));schedule()},err));
  unsubs.push(db.collection(P("inventaires")).onSnapshot(s=>{S.inv=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.date);schedule()},err));
  render();
}
function switchStore(id){if(id===S.store)return;S.store=id;try{localStorage.setItem("gesmar.store",id)}catch(_){};subscribeStore();toast("Magasin : "+storeNom())}

/* ---------- magasins, logo, paramètres ---------- */
function closeMenu(){$("#storeMenu").hidden=true}
function toggleStoreMenu(){const m=$("#storeMenu");if(!m.hidden){m.hidden=true;return}
  m.innerHTML=S.magasins.map(g=>`<button role="menuitem" data-store="${esc(g.id)}" aria-current="${g.id===S.store}">⌂ ${esc(g.nom)}</button>`).join("");
  const r=$("#houseBtn").getBoundingClientRect();m.style.top=(r.bottom+window.scrollY+6)+"px";m.style.left=Math.max(8,Math.min(r.left+window.scrollX,window.innerWidth-220))+"px";m.hidden=false}
document.addEventListener("click",e=>{if(!e.target.closest("#storeMenu,#houseBtn"))closeMenu()},true);
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeMenu();if(S.modal){S.modal=false;render()}}});
async function addStore(){
  const nom=$("#mgNom").value.trim();if(!nom)return;let id=slug(nom)||("m"+Date.now());if(S.magasins.find(m=>m.id===id))id+=Date.now()%1000;
  const copy=$("#mgCopy")&&$("#mgCopy").checked;const src=S.fourn.slice();
  try{await S.db.doc("magasins/"+id).set({nom:nom.toUpperCase(),ordre:S.magasins.length});
    if(copy){for(const f of src){const {id:fid,...body}=f;await S.db.doc("magasins/"+id+"/fournisseurs/"+fid).set(body)}}
    toast("Magasin "+nom.toUpperCase()+" créé");switchStore(id)}catch(e){fail(e)}
}
async function uploadLogo(file){
  if(!file)return;if(!S.assets){toast("Seuls les éditeurs peuvent changer le logo.");return}
  try{const old=S.config.logoId;const r=await S.assets.upload(file);
    await S.db.doc("config/app").set({...S.config,logoId:r.id});
    if(old&&old!==r.id){S.assets.delete(old).catch(()=>{})}
    toast("Logo enregistré")}catch(e){console.error(e);toast(e&&e.code==="too_large"?(S.local?"Image trop lourde (1,5 Mo maximum).":"Image trop lourde (20 Mo maximum)."):e&&e.code==="unsupported_type"?"Format non accepté : PNG, JPG, WebP ou SVG.":"Envoi du logo impossible pour le moment.")}
}
async function removeLogo(){const old=S.config.logoId;if(!old)return;
  try{await S.db.doc("config/app").set({...S.config,logoId:null});if(S.assets)S.assets.delete(old).catch(()=>{});toast("Logo retiré")}catch(e){fail(e)}}
const COLS_STORE=["mois","fournisseurs","avoirs","reglages","inventaires"];
async function collectOnline(){const raw=S.db.raw,out={};
  const cfg=await raw.doc("config/app").get();if(cfg.exists)out["config/app"]=cfg.data();
  const mg=await raw.collection("magasins").get();
  for(const d of mg.docs){out["magasins/"+d.id]=d.data();for(const c of COLS_STORE){const q=await raw.collection("magasins/"+d.id+"/"+c).get();q.docs.forEach(x=>out["magasins/"+d.id+"/"+c+"/"+x.id]=x.data())}}
  return out}
async function exporterDonnees(){
  if(S.local&&typeof exportData==="function"){exportData();return}
  if(!S.downloads){toast("L'export n'est pas disponible dans cette vue.");return}
  try{const data=await collectOnline();const txt=JSON.stringify({app:"GESMAR",version:APP_VERSION,exporte:new Date().toISOString(),data},null,1);
    const r=await S.downloads.save({filename:"GESMAR-sauvegarde-"+todayISO()+".json",data:txt});if(r&&r.status==="saved")toast("Sauvegarde exportée")}
  catch(e){console.error(e);if(!(e&&e.code==="cancelled"))toast("Export impossible pour le moment.")}}
function importerDonnees(file){if(!file)return;
  if(S.local&&typeof importData==="function"){importData(file);return}
  const rd=new FileReader();rd.onload=()=>{try{const j=JSON.parse(rd.result);const d=j&&j.data;if(!d||typeof d!=="object")throw 0;
      S.importPending=Object.entries(d).filter(([k])=>!k.startsWith("__")&&k.split("/").length%2===0);S.modalPanel="import";render()}
    catch(e){toast("Fichier non reconnu : choisissez un export GESMAR (.json).")}};rd.readAsText(file)}
async function confirmImport(){const E=S.importPending||[];S.importPending=null;HIST.busy=true;let n=0;
  try{for(const[k,v]of E){await S.db.raw.doc(k).set(v);n++}toast(n+" éléments importés")}catch(e){fail(e)}
  finally{HIST.busy=false;HIST.undo=[];HIST.redo=[];updHist();S.modalPanel=null;render()}}
function infoDonnees(){
  const nb={mois:Object.keys(S.mois).length,f:S.fourn.length,av:S.avoirs.length,inv:(S.inv||[]).length};
  const detail=`Magasin <b>${esc(storeNom())}</b> : ${nb.mois} mois, ${nb.f} fournisseurs, ${nb.av} avoirs, ${nb.inv} inventaires.`;
  if(S.local){let ko=0;try{ko=Math.round(((typeof LS_KEY!=="undefined"&&localStorage.getItem(LS_KEY))||"").length/1024)}catch(e){}
    return `Les données sont enregistrées <b>dans le navigateur de cet ordinateur</b> (environ ${ko} Ko), pas dans un dossier du disque. Pour les sauvegarder ou les passer sur un autre poste, utilisez <b>Exporter</b> puis <b>Importer</b>.<br>${detail}`}
  return `Les données sont enregistrées <b>en ligne</b> et partagées avec les personnes qui ont accès à GESMAR.<br>${detail}`}
const SY_OK='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 9.5a4 4 0 0 1-.5 8.5z"/><path d="M9 13.2l2.2 2.2L15.4 11"/></svg>',SY_KO='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 9.5a4 4 0 0 1-.5 8.5z"/><path d="M4 4l16 16"/></svg>',SY_WT='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 9.5a4 4 0 0 1-.5 8.5z"/></svg>';
/* Nuage en haut des réglages (comme GESTIME) : vert = synchronisé avec les autres postes, rouge = pas synchronisé. */
function syncSt(){return S.local&&typeof SYNC!=="undefined"?SYNC.st:{state:"ok",msg:"Synchronisé en ligne"}}
function syncIcoHtml(){const st=syncSt();const c=st.state==="ok"?"ok":st.state==="wait"?"wait":"ko";
  const t=c==="ok"?st.msg:c==="wait"?"Synchronisation en cours…":"Non synchronisé : "+st.msg;
  return `<span id="syncIco" class="syi ${c}" role="img" aria-label="${esc(t)}" title="${esc(t)}">${c==="ok"?SY_OK:c==="ko"?SY_KO:SY_WT}</span>`}
const majBadge=()=>S.majNew&&S.majNew>(S.majSeenV||0);
function renderModal(){
  const root=$("#modalRoot");
  if(!S.modal){root.innerHTML="";return}
  const a=document.activeElement;if(a&&root.contains(a)&&a.tagName!=="BUTTON"&&a.type!=="file"&&root.innerHTML)return; // ne pas effacer une saisie en cours
  const lid=S.config&&S.config.logoId;const dark=isDark();const P1=S.modalPanel;
  const cloud=syncIcoHtml();
  root.innerHTML=`<div class="overlay" data-act="closeModalBg"></div><div class="reglages" role="dialog" aria-label="Réglages">
    <div class="head"><h3>Réglages</h3>${cloud}<button class="x" data-act="closeModal" aria-label="Fermer">✕</button></div>
    <h4>Données</h4>
    <button class="rbtn" data-act="export"><span class="ic">💾</span>Exporter</button>
    <button class="rbtn" data-act="import"><span class="ic">📂</span>Importer</button><input type="file" id="importFile" accept="application/json,.json" hidden>
    ${P1==="importpc"&&S.importPending?`<div class="rinfo">Remplacer <b>toutes les données</b> de GESMAR par ce fichier ? Exportez d'abord une sauvegarde si vous n'êtes pas sûr.<div class="row" style="margin-top:8px"><button class="btn red small" data-act="importPcOk">Remplacer</button><button class="btn small" data-act="importNo">Annuler</button></div></div>`:""}
    ${P1==="import"&&S.importPending?`<div class="rinfo">Importer <b>${S.importPending.length} éléments</b> ? Les données portant le même nom seront remplacées.<div class="row" style="margin-top:8px"><button class="btn red small" data-act="importOk">Importer</button><button class="btn small" data-act="importNo">Annuler</button></div></div>`:""}
    <button class="rbtn" ${S.pc?'data-act="openFolder"':'data-panel="dossier"'}><span class="ic">📁</span>Dossier des données</button>
    ${P1==="dossier"?`<div class="rinfo">${infoDonnees()}</div>`:""}
    <h4>Logiciel</h4>
    <button class="rbtn" ${S.pc&&window.api.updateCheck?'data-act="majPc"':'data-panel="maj"'} ${S.majBusy?"disabled":""}><span class="ic">🔄</span>Mettre à jour le logiciel${majBadge()?'<span class="pas" aria-label="1 nouvelle version">1</span>':""}</button>
    ${S.pc?`<div class="rmaj">${esc(S.majMsg||("Version installée : "+APP_VERSION))}</div>`:""}
    ${P1==="maj"?`<div class="rinfo">${S.local?"Pour mettre à jour, remplacez ce fichier GESMAR.html par la nouvelle version et ouvrez-la dans le même navigateur : vos données sont reprises automatiquement. Exportez une sauvegarde avant, par précaution.":"La version en ligne se met à jour toute seule : vous avez la dernière version."}</div>`:""}
    <h4>Affichage</h4>
    <div class="rtheme"><button data-theme="clair" aria-pressed="${!dark}">☀️ Clair</button><button data-theme="sombre" aria-pressed="${dark}">🌙 Sombre</button></div>
  </div>`;
}
document.addEventListener("click",e=>{if(e.target.dataset&&e.target.dataset.act==="closeModalBg"){S.modal=false;S.modalPanel=null;render()}});

(async()=>{
  const db=LocalDB;S.local=true;S.assets=LocalAssets;S.pc=PC;
  // Vérifie au démarrage, puis toutes les 10 minutes et quand on revient sur la fenêtre (au plus une fois par minute) :
  // la pastille « 1 » apparaît même si le logiciel est resté ouvert pendant la publication.
  if(PC&&window.api.updateCheck){let last=0;const auto=()=>{if(Date.now()-last<60000||S.majBusy)return;last=Date.now();const was=majBadge();majCheck(true).then(()=>{if(majBadge()!==was)render()}).catch(()=>{})};
    setTimeout(auto,4000);setInterval(()=>{last=0;auto()},600000);window.addEventListener("focus",auto);document.addEventListener("visibilitychange",()=>{if(!document.hidden)auto()})
    // v28 : en plus du bouton, mise à jour automatique chaque soir à 21 h (heure du PC).
    // Contrôle chaque minute ; si le PC était en veille à 21 h, c'est fait au réveil (avant minuit).
    // Logiciel ouvert après 21 h : rien ce soir-là (pas de redémarrage pendant qu'on s'en sert).
    // On n'installe jamais pendant une saisie : on attend qu'aucune case ne soit en cours de frappe.
    // Sans internet : nouvel essai chaque minute jusqu'à minuit.
    const H=21;let fait=new Date().getHours()>=H?new Date().toDateString():"",soir=false;
    const soirGo=async()=>{const el=document.activeElement;
      if(S.majBusy||(el&&/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)))return;
      if(new Date().getHours()<H){soir=false;return}
      S.majBusy=true;try{const r=await window.api.updateCheck(majUrl());soir=r.status==="error";
        if(r.status==="new"){await new Promise(f=>setTimeout(f,2000));const x=await window.api.updateApply(majUrl());if(x.status==="done")return;soir=true}}catch(e){soir=true}
      S.majBusy=false};
    setInterval(()=>{const n=new Date(),d=n.toDateString();if(n.getHours()>=H&&fait!==d){fait=d;soir=true}if(soir)soirGo()},60000)}
  S.db=wrapDb(db);render();
  setTimeout(()=>SYNC.start().catch(()=>{}),300);
  db.doc("config/app").onSnapshot(d=>{S.config=d.exists?d.data():{};schedule()},e=>console.error(e));
  db.collection("magasins").onSnapshot(s=>{
    S.magasins=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.ordre??99)-(b.ordre??99));S.magLoaded=true;
    if(!S.magasins.find(m=>m.id===S.store)){const first=S.magasins[0];if(first){S.store=first.id;subscribeStore()}else{S.store=null;render()}}
    else if(!unsubs.length)subscribeStore(); else schedule();
  },e=>console.error(e));
})();
render();
})();
</script>
</body>
</html>
