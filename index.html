   Ligne « 050|0001|0001|C.A BRUT |…|<centimes> » = CA TTC du jour (sinon : somme des lignes 056 = rayons).
   Le CA lu remplace celui de la saisie (case vide ou pas). Réglages gardés sur ce PC (gesmar-ca) : magasin et date de départ. */
const CA_API=()=>!!(window.api&&typeof window.api.caLister==="function");
let CA_CFG=null;
function caCfg(){if(!CA_CFG){try{CA_CFG=JSON.parse(rawLoad("gesmar-ca")||"null")}catch(e){CA_CFG=null}CA_CFG=CA_CFG||{};}
  if(!CA_CFG.mag&&S.store){CA_CFG.mag=S.store;caCfgSave()} // v101 : la caisse de ce PC = le magasin ouvert la première fois (« Changer de dossier » la rattache au magasin ouvert)
  if(!CA_CFG.depuis){CA_CFG.depuis=new Date().getFullYear()+"-01-01";caCfgSave()}return CA_CFG}
function caCfgSave(){try{rawSave("gesmar-ca",JSON.stringify(CA_CFG||{}))}catch(e){}}
let CA_CACHE=null;
function caCache(){if(!CA_CACHE){try{CA_CACHE=JSON.parse(rawLoad("gesmar-ca-cache")||"{}")||{}}catch(e){CA_CACHE={}}}return CA_CACHE}
function caLireTexte(t){let brut=null,ray=0,nr=0;for(const l of String(t).split(/\r?\n/)){const p=l.split("|");
    if(p[0]==="050"&&/^C\.?A\.? ?BRUT/i.test((p[3]||"").trim())&&/^\d+$/.test((p[5]||"").trim()))brut=+p[5]/100;
    else if(p[0]==="056"&&/^-?\d+$/.test((p[4]||"").trim())){ray+=+p[4];nr++}}
  return brut!=null?Math.round(brut*100)/100:nr?Math.round(ray)/100:null}
S.ca={etat:"",busy:false,msg:"",dernier:0};
async function caScan(silent,force){if(!CA_API()||S.ca.busy||!S.db||!S.store||!S.magasins.length)return;const C=caCfg();
  if(S.store!==C.mag){S.ca.etat="autre";return}
  S.ca.busy=true;let maj=0,lus=0;
  try{const L=await window.api.caLister();S.ca.dir=L.dir;if(L.err){S.ca.etat="absent";return}
    const K=caCache(),parMois={};
    for(const f of L.files){const m=f.nom.match(/(\d{4})(\d\d)(\d\d)$/);if(!m)continue;const iso=m[1]+"-"+m[2]+"-"+m[3];if(iso<C.depuis||iso>todayISO())continue;
      let c=K[f.nom];if(!c||c.size!==f.size||c.mtime!==f.mtime){try{c={size:f.size,mtime:f.mtime,ca:caLireTexte(await window.api.caLire(f.nom))};K[f.nom]=c;lus++}catch(e){console.error(e);continue}}
      if(c.ca==null)continue;const key=iso.slice(0,7),dd=iso.slice(8,10),doc=S.mois[key],cur=doc&&doc.jours&&doc.jours[dd]&&doc.jours[dd].ca;
      if(cur==null||Math.abs(cur-c.ca)>0.004)(parMois[key]=parMois[key]||{})[dd]={ca:c.ca}}
    if(lus)try{rawSave("gesmar-ca-cache",JSON.stringify(K))}catch(e){}
    HIST.lastT=Date.now();
    for(const[key,patch]of Object.entries(parMois)){const ref=S.db.doc(P("mois/"+key));
      if(S.mois[key])await ref.update({jours:patch});else await ref.set({annee:+key.slice(0,4),mois:+key.slice(5,7),jours:patch});maj+=Object.keys(patch).length}
    S.ca.etat="ok";S.ca.dernier=Date.now();S.ca.nb=L.files.length;
    if(maj){S.ca.msg=maj+" jour(s) mis à jour le "+new Date().toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});toast("CA de la caisse : "+maj+" jour(s) mis à jour");render()}
    else if(force)toast("CA de la caisse : déjà à jour")}
  catch(e){console.error(e);S.ca.etat="erreur";S.ca.err=e&&e.message||String(e)}
  finally{S.ca.busy=false;if(S.modal&&typeof renderModal==="function")renderModal()}}
function caAuto(){if(!CA_API())return;let n=0;const t=setInterval(()=>{if(S.ca.etat==="ok"||++n>40){clearInterval(t);return}if(S.store&&S.magasins.length&&Object.keys(S.mois).length)caScan(true)},3000);
  setInterval(()=>caScan(true),900000)}
/* ================= v149 : onglet VENTE (journées de caisse Videor) =================
 Source : C:\transfert\reception\001\VENT.TOT.AAAAMMJJ (une journée par fichier, écrite par Videor chaque nuit).
 Lignes : 050 totaux (C.A BRUT = CA TTC + nb articles, C.A NET = nb clients, REMISE IMMEDIATE), 051 paiements,
 052 opérations (annulations…), 056 rayons, 055 familles (→ rayon par le champ 8 « 06xxxx »), 054 sous-familles
 (→ famille par le champ 8 « 05xxxx », code au champ 4), 001 articles (EAN, libellé, sous-famille « 04xxxx », quantité, CA),
 057 tranches horaires (clients, CA), 071 TVA. Quantités et montants ×100.
 Partage : le PC de la caisse (programme 1.5.0, window.api.venteLire) lit ses fichiers et envoie chaque journée dans la table
 Supabase « gesmar_ventes » (une ligne par magasin et par jour) ; les autres PC lisent cette table. */
const VT={cache:{},load:null,err:"",up:{busy:false,msg:"",n:0,tot:0}};
S.vt=(()=>{let o={};try{o=JSON.parse(localStorage.getItem("gesmar.vt")||"{}")||{}}catch(e){}
  return Object.assign({mode:"jour",d:"",a:"",b:"",vue:"synth",q:"",ray:"",tri:"ca",open:{},art:"",abc:"",lim:200},o,{open:{}})})();
function vtSave(){try{const{mode,vue,tri}=S.vt;localStorage.setItem("gesmar.vt",JSON.stringify({mode,vue,tri}))}catch(e){}}
const VT_API=()=>!!(window.api&&typeof window.api.venteLire==="function");
const vtN=s=>{s=String(s||"").trim();return /^-?\d+$/.test(s)?+s:0};
const vtE=v=>eur2.format(v||0),vtE0=v=>eur.format(v||0);
const vtQ=q=>{const r=Math.round(q*100)/100;return Number.isInteger(r)?String(r):r.toFixed(2).replace(".",",")};
const vtP=v=>v==null||!isFinite(v)?"—":(v*100).toFixed(1).replace(".",",")+" %";
const VT_J=["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"],VT_JL=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const vtAdd=(iso,n)=>{const d=new Date(iso+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const vtWd=iso=>new Date(iso+"T12:00:00Z").getUTCDay();
const vtDl=iso=>iso?VT_J[vtWd(iso)].toLowerCase()+". "+iso.slice(8,10)+"/"+iso.slice(5,7)+"/"+iso.slice(2,4):"";
const vtDays=(a,b)=>{const o=[];for(let d=a;d<=b&&o.length<1200;d=vtAdd(d,1))o.push(d);return o};
// ---- lecture d'un fichier VENT.TOT ----
function vtParse(txt,iso){const D={d:iso,ca:0,cli:0,nart:0,rem:0,pay:[],ops:[],tva:[],ray:[],fam:[],sf:[],h:[],art:[]};let ray=0;
  for(const l of String(txt).split(/\r?\n/)){const p=l.split("|"),k=p[0];
    if(k==="050"){const n=(p[3]||"").trim();if(/^C\.?A\.? ?BRUT/i.test(n)){D.ca=vtN(p[5])/100;D.nart=vtN(p[4])/100}else if(/^C\.?A\.? ?NET/i.test(n))D.cli=vtN(p[4])/100;else if(/REMISE/i.test(n))D.rem+=vtN(p[5])/100}
    else if(k==="051")D.pay.push([(p[4]||"").trim(),vtN(p[11])/100,vtN(p[10])/100]);
    else if(k==="052")D.ops.push([(p[4]||"").trim(),vtN(p[11])/100,vtN(p[10])/100]);
    else if(k==="056"){D.ray.push([(p[1]||"").trim(),(p[2]||"").trim(),vtN(p[3])/100,vtN(p[4])/100]);ray+=vtN(p[4])}
    else if(k==="055")D.fam.push([(p[1]||"").trim(),(p[3]||"").trim(),vtN(p[9])/100,vtN(p[10])/100,String(p[8]||"").trim().slice(2)]);
    else if(k==="054")D.sf.push([(p[4]||"").trim(),(p[3]||"").trim(),vtN(p[9])/100,vtN(p[10])/100,String(p[8]||"").trim().slice(2)]);
    else if(k==="001"){const w=String(p[5]||"").trim().charAt(3)==="1"; /* v153 : article pesé (ex. 00111000 ; à l'unité : 00101000) : quantité en grammes */
      D.art.push([(p[2]||"").trim().replace(/^0+(?=\d{8})/,""),(p[4]||"").trim(),String(p[6]||"").trim().slice(2),w?vtN(p[10])/1000:vtN(p[10])/100,vtN(p[11])/100,w?1:0])}
    else if(k==="057")D.h.push([(p[2]||"").trim(),(p[3]||"").trim(),vtN(p[4])/100,vtN(p[5])/100]);
    else if(k==="071")D.tva.push([(p[2]||"").trim(),vtN(p[6])/100,vtN(p[7])/100])}
  if(!D.ca&&ray)D.ca=ray/100;
  // une même référence peut apparaître sur plusieurs lignes : on regroupe
  const m=new Map();for(const a of D.art){const x=m.get(a[0]);if(x){x[3]+=a[3];x[4]+=a[4]}else m.set(a[0],a.slice())}D.art=[...m.values()];
  // v153 : quantités des rayons / familles / sous-familles recalculées : unités d'un côté, kilos (produits pesés) de l'autre
  if(D.art.length){const sq={},sk={},fq={},fk={},rq={},rk={};let u=0,kg=0;
    D.art.forEach(a=>{if(a[5]){sk[a[2]]=(sk[a[2]]||0)+a[3];kg+=a[3]}else{sq[a[2]]=(sq[a[2]]||0)+a[3];u+=a[3]}});
    D.sf.forEach(x=>{x[2]=sq[x[0]]||0;x[5]=sk[x[0]]||0;fq[x[4]]=(fq[x[4]]||0)+x[2];fk[x[4]]=(fk[x[4]]||0)+x[5]});
    D.fam.forEach(x=>{x[2]=fq[x[0]]||0;x[5]=fk[x[0]]||0;rq[x[4]]=(rq[x[4]]||0)+x[2];rk[x[4]]=(rk[x[4]]||0)+x[5]});
    D.ray.forEach(x=>{x[2]=rq[x[0]]||0;x[4]=rk[x[0]]||0});D.nart=u;D.kg=kg}
  D.v=2;return D}
// ---- accès aux journées : caisse de ce PC (fichiers) ou base en ligne ----
const vtLocal=()=>VT_API()&&typeof caCfg==="function"&&S.store===caCfg().mag;
let VT_LIST=null;
async function vtListLocal(force){if(!VT_LIST||force||Date.now()-VT_LIST.t>60000){const L=await window.api.caLister();VT_LIST={t:Date.now(),L}}return VT_LIST.L}
function vtCfgSb(){try{return SYNC.cfg()}catch(e){return null}}
async function vtSb(path,opt){const c=vtCfgSb();if(!c)throw new Error("Base en ligne non réglée");
  const r=await fetch(c.url+"/rest/v1/"+path,Object.assign({},opt,{headers:Object.assign({apikey:c.key,"Content-Type":"application/json"},(c.key.split(".").length===3?{Authorization:"Bearer "+c.key}:{}),opt&&opt.headers)}));
  if(!r.ok){let t="";try{t=(await r.json()).message||""}catch(e){}throw new Error(r.status===404||/does not exist|schema cache/.test(t)?"Table « gesmar_ventes » absente : lancez le script pc/supabase-gesmar-ventes.sql dans Supabase":"Erreur "+r.status+(t?" : "+t:""))}
  return r.status===204||r.status===201?null:r.json()}
async function vtGet(a,b){const mag=S.store,want=vtDays(a,b).filter(d=>!(mag+"|"+d in VT.cache));
  if(want.length){
    if(vtLocal()){const L=await vtListLocal();const have=new Set((L.files||[]).map(f=>f.nom));
      for(const d of want){const nom="VENT.TOT."+d.replace(/-/g,"");if(!have.has(nom)){VT.cache[mag+"|"+d]=null;continue}
        try{VT.cache[mag+"|"+d]=vtParse(await window.api.venteLire(nom),d)}catch(e){console.error(e);VT.cache[mag+"|"+d]=null}}}
    else{for(let i=0;i<want.length;i+=31){const x=want[i],y=want[Math.min(i+30,want.length-1)];
        const rows=await vtSb("gesmar_ventes?magasin=eq."+encodeURIComponent(mag)+"&jour=gte."+x+"&jour=lte."+y+"&select=jour,data&order=jour");
        const got=new Set();(rows||[]).forEach(r=>{VT.cache[mag+"|"+r.jour]=r.data;got.add(r.jour)});
        want.slice(i,i+31).forEach(d=>{if(!got.has(d)&&d<todayISO())VT.cache[mag+"|"+d]=null})}}}
  return vtDays(a,b).map(d=>VT.cache[mag+"|"+d]).filter(Boolean)}
// ---- envoi en ligne depuis le PC de la caisse ----
let VT_UP=null;function vtUpIdx(){if(!VT_UP){try{VT_UP=JSON.parse(rawLoad("gesmar-ventes-envoi2")||"{}")||{}}catch(e){VT_UP={}}}return VT_UP}
async function vtUpload(){if(VT.up.busy||!VT_API()||!vtCfgSb()||!S.store||typeof caCfg!=="function")return;const mag=caCfg().mag;if(!mag)return;VT.up.busy=true; // v150 : envoi même si un autre magasin est ouvert
  try{const L=await vtListLocal(true),I=vtUpIdx(),todo=(L.files||[]).filter(f=>{const k=mag+"|"+f.nom,x=I[k];return !x||x.s!==f.size||x.m!==f.mtime}).sort((u,v)=>u.nom<v.nom?1:-1);
    VT.up.tot=todo.length;VT.up.n=0;
    for(let i=0;i<todo.length;i+=10){const part=todo.slice(i,i+10),rows=[];
      for(const f of part){const m=f.nom.match(/(\d{4})(\d\d)(\d\d)$/);if(!m)continue;const d=m[1]+"-"+m[2]+"-"+m[3];
        const D=vtParse(await window.api.venteLire(f.nom),d);VT.cache[mag+"|"+d]=D;rows.push({id:mag+"|"+d,magasin:mag,jour:d,data:D,updated_at:new Date().toISOString()})}
      if(rows.length)await vtSb("gesmar_ventes?on_conflict=id",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(rows)});
      part.forEach(f=>{I[mag+"|"+f.nom]={s:f.size,m:f.mtime}});try{rawSave("gesmar-ventes-envoi2",JSON.stringify(I))}catch(e){}
      VT.up.n+=part.length;VT.up.msg="Envoi des journées de caisse : "+VT.up.n+" / "+VT.up.tot;
      if(S.tab==="vente"){const e=document.getElementById("vtUp");if(e)e.textContent=VT.up.msg}}
    VT.up.msg=VT.up.tot?"":VT.up.msg}
  catch(e){console.error(e);VT.up.msg="Envoi en ligne impossible : "+(e.message||e)}
  finally{VT.up.busy=false;const e=document.getElementById("vtUp");if(e)e.textContent=VT.up.msg}}
if(VT_API()){setTimeout(vtUpload,45000);setInterval(vtUpload,15*60000)}
// ---- regroupement d'une période ----
function vtAgg(days){const A={n:days.length,days,ca:0,cli:0,nart:0,rem:0,pay:{},ops:{},tva:{},ray:{},fam:{},sf:{},h:{},art:{},jour:[]};
  const add=(o,k,nm,q,ca,x,extra)=>{const e=o[k]||(o[k]={k,nm,q:0,ca:0,x,nj:0,last:""});e.q+=q;e.ca+=ca;if(nm)e.nm=nm;if(x!=null&&x!=="")e.x=x;if(extra)extra(e)};
  for(const D of days){A.ca+=D.ca;A.cli+=D.cli;A.nart+=D.nart;A.kg=(A.kg||0)+(D.kg||0);A.rem+=D.rem;A.jour.push([D.d,D.ca,D.cli]);
    D.pay.forEach(p=>add(A.pay,p[0],p[0],p[2],p[1]));D.ops.forEach(p=>add(A.ops,p[0],p[0],p[2],p[1]));D.tva.forEach(p=>add(A.tva,p[0],p[0],p[2],p[1]));
    const kk=i=>r=>e=>{e.kg=(e.kg||0)+(r[i]||0)};D.ray.forEach(r=>add(A.ray,r[0],r[1],r[2],r[3],null,kk(4)(r)));D.fam.forEach(r=>add(A.fam,r[0],r[1],r[2],r[3],r[4],kk(5)(r)));D.sf.forEach(r=>add(A.sf,r[0],r[1],r[2],r[3],r[4],kk(5)(r)));
    D.h.forEach(h=>add(A.h,h[0],vtHH(h[0])+" – "+vtHH(h[1],1),h[2],h[3],h[1]));
    D.art.forEach(a=>add(A.art,a[0],a[1],a[3],a[4],a[2],e=>{e.nj++;if(D.d>e.last)e.last=D.d;if(a[5])e.w=1}))}
  return A}
const vtLst=o=>Object.values(o);
const vtKg=v=>(Math.round((v||0)*10)/10).toFixed(1).replace(".",",")+" kg";
const vtQe=e=>e.w?vtKg(e.q):vtQ(e.q)+(e.kg?" + "+vtKg(e.kg):"");
// « 1800 » → « 18h00 » ; fin de tranche « 1859 » → « 19h00 »
function vtHH(t,fin){let h=+String(t).slice(0,2),m=+String(t).slice(2,4);if(fin&&m===59){h++;m=0}return String(h).padStart(2,"0")+"h"+String(m).padStart(2,"0")}
// ---- petits dessins ----
function vtBars(vals,labels,fmt,o){o=o||{};const n=vals.length;if(!n)return "";const W=o.w||1100,H=o.h||210,P=30,mx=Math.max(...vals.map(v=>v||0),1),bw=(W-P*2)/n;
  return `<svg class="vtch" viewBox="0 0 ${W} ${H+40}" role="img" aria-label="${esc(o.titre||"")}">${vals.map((v,i)=>{const h=(v||0)/mx*H,x=P+i*bw;
    return `<rect x="${x+bw*.12}" y="${H-h+18}" width="${bw*.76}" height="${h}" rx="2" fill="${o.col?o.col(i):"var(--green)"}"${o.hi===i?' stroke="var(--fg)" stroke-width="2"':""}><title>${esc(labels[i])} : ${esc(fmt(v))}</title></rect>`
      +(n<=45&&v?`<text class="vl" x="${x+bw/2}" y="${H-h+13}" text-anchor="middle">${esc(o.short?o.short(v):fmt(v))}</text>`:"")
      +(n<=20||i%Math.ceil(n/20)===0?`<text x="${x+bw/2}" y="${H+33}" text-anchor="middle">${esc(o.lab?o.lab(labels[i]):labels[i])}</text>`:"")}).join("")}</svg>`}
const vtBar=(p,col)=>`<span class="vtbar"><i style="width:${Math.max(0,Math.min(100,p*100)).toFixed(1)}%${col?";background:"+col:""}"></i></span>`;
const vtK=(lbl,v,d,cls)=>`<div class="kpi${cls?" "+cls:""}"><div class="lbl">${lbl}</div><div class="v">${v}</div>${d?`<div class="d">${d}</div>`:""}</div>`;
// ---- vue ----
function vtRange(){const v=S.vt,t=todayISO(),hier=vtAdd(t,-1);if(!v.d)v.d=hier;if(!v.b)v.b=hier;if(!v.a)v.a=vtAdd(v.b,-29);
  if(v.vue==="fiche"&&v.mode==="jour")return[vtAdd(v.d,-89),v.d];
  if(v.vue==="alertes")return[vtAdd(v.mode==="jour"?v.d:v.b,-34),v.mode==="jour"?v.d:v.b];
  return v.mode==="jour"?[v.d,v.d]:[v.a,v.b]}
function vVente(){const v=S.vt,[a,b]=vtRange(),key=S.store+"|"+a+"|"+b;
  const VUES=[["synth","Synthèse"],["rayons","Rayons et familles"],["articles","Articles"],["heures","Heures"],["fiche","Fiche article"],["abc","Classement ABC"],["alertes","Alertes"]];
  const top=`<div class="vthead"><h2>Ventes — ${esc(storeNom())}</h2>
    <div class="segm vtseg"><button data-vt="mode" data-v="jour" aria-pressed="${v.mode==="jour"}">Jour</button><button data-vt="mode" data-v="per" aria-pressed="${v.mode==="per"}">Période</button></div>
    ${v.mode==="jour"?`<div class="vtdate"><button class="btn small" data-vt="jour" data-n="-1" aria-label="Jour précédent">‹</button><input type="date" id="vtD" value="${v.d}" max="${todayISO()}"><button class="btn small" data-vt="jour" data-n="1" aria-label="Jour suivant">›</button><b class="vtwd">${esc(VT_JL[vtWd(v.d)])}</b></div>`
    :`<div class="vtdate">du <input type="date" id="vtA" value="${v.a}"> au <input type="date" id="vtB" value="${v.b}" max="${todayISO()}"> ${[["7","7 j"],["30","30 j"],["m","Ce mois"],["mp","Mois dernier"],["an","Cette année"]].map(x=>`<button class="btn small" data-vt="vite" data-v="${x[0]}">${x[1]}</button>`).join("")}</div>`}
    </div><nav class="vtnav">${VUES.map(x=>`<button data-vt="vue" data-v="${x[0]}" class="${v.vue===x[0]?"on":""}">${x[1]}</button>`).join("")}</nav>
    <div id="vtUp" class="vtup">${esc(VT.up.msg||"")}</div>`;
  if(!VT.load||VT.load.key!==key){VT.load={key,etat:"cours",days:null,err:""};
    vtGet(a,b).then(d=>{if(VT.load.key===key){VT.load.days=d;VT.load.etat="ok"}}).catch(e=>{if(VT.load.key===key){VT.load.etat="err";VT.load.err=e.message||String(e)}}).finally(()=>{if(S.tab==="vente")render()})}
  if(VT.load.etat==="cours")return top+`<div class="empty-state">Lecture des journées de caisse…</div>`;
  if(VT.load.etat==="err")return top+`<div class="empty-state">${esc(VT.load.err)}</div>`;
  const days=VT.load.days||[];

function vtAlertes(A){const ds=A.days.map(D=>D.d);if(ds.length<14)return `<div class="empty-state">Il faut au moins 14 journées de caisse pour calculer les alertes.</div>`;
  const ref=ds[ds.length-1],L=ds.slice(-28),last7=ds.slice(-7),prev=ds.slice(-28,-7),byD={};A.days.forEach(D=>byD[D.d]=D);
  // 1. ruptures possibles : article vendu au moins 60 % des jours, pas vendu depuis 3 jours ou plus
  const st={};L.forEach((d,i)=>byD[d].art.forEach(a=>{const e=st[a[0]]||(st[a[0]]={k:a[0],nm:a[1],n:0,last:-1,q:0});e.n++;e.last=i;e.q+=a[3]}));
  const rup=Object.values(st).map(e=>Object.assign(e,{f:e.n/L.length,gap:L.length-1-e.last})).filter(e=>e.f>=0.6&&e.gap>=3).sort((u,w)=>w.f-u.f);
  // 2. sous-familles en baisse : 7 derniers jours contre la moyenne des 3 semaines d'avant
  const sfs={};const acc=(set,k)=>set.forEach(d=>byD[d].sf.forEach(s=>{const e=sfs[s[0]]||(sfs[s[0]]={k:s[0],nm:s[1],r:0,p:0});e[k]+=s[3]}));acc(last7,"r");acc(prev,"p");
  const np=prev.length/7||1,bas=Object.values(sfs).map(e=>Object.assign(e,{m:e.p/np,ev:e.p?e.r/(e.p/np)-1:null})).filter(e=>e.m>=50&&e.ev!=null&&e.ev<=-0.3).sort((u,w)=>u.ev-w.ev);
  const hau=Object.values(sfs).filter(e=>e.m>=50&&e.ev!=null&&e.ev>=0.3).sort((u,w)=>w.ev-u.ev);
  // 3. nouveaux articles : vendus ces 7 derniers jours, jamais dans les 4 semaines d'avant
  const vu=new Set();ds.slice(0,-7).forEach(d=>byD[d].art.forEach(a=>vu.add(a[0])));const nv={};last7.forEach(d=>byD[d].art.forEach(a=>{if(!vu.has(a[0])){const e=nv[a[0]]||(nv[a[0]]={k:a[0],nm:a[1],q:0,ca:0,first:d});e.q+=a[3];e.ca+=a[4]}}));
  const NV=Object.values(nv).sort((u,w)=>w.ca-u.ca);
  // 4. changements de prix : un seul prix pendant les 3 semaines d'avant, un seul autre prix depuis (articles à l'unité seulement)
  const px={};const pacc=(set,k)=>set.forEach(d=>byD[d].art.forEach(a=>{if(a[3]<=0||a[5])return;const e=px[a[0]]||(px[a[0]]={k:a[0],nm:a[1],r:new Set(),p:new Set(),rl:""});e[k].add(Math.round(a[4]/a[3]*100)/100);if(k==="r"&&d>e.rl)e.rl=d}));pacc(last7,"r");pacc(prev,"p");
  const PX=Object.values(px).filter(e=>e.r.size===1&&e.p.size===1).map(e=>Object.assign(e,{a:[...e.p][0],b:[...e.r][0]})).filter(e=>Math.abs(e.b-e.a)>=0.02).sort((u,w)=>Math.abs(w.b/w.a-1)-Math.abs(u.b/u.a-1));
  const sec=(t,n,sub,body)=>`<div class="panel flush vtg"><div class="band">${t} <span class="vtcnt">${n}</span><span class="vtsub">${sub}</span></div>${n?`<div class="scroll" style="max-height:420px;overflow:auto">${body}</div>`:`<div class="vtmut" style="padding:12px 14px">Rien à signaler.</div>`}</div>`;
  return `<p class="vtmut vtg">Calculé sur les 28 dernières journées de caisse jusqu'au ${esc(vtDl(ref))}.</p>
  ${sec("Ruptures possibles",rup.length,"articles vendus presque tous les jours, mais plus depuis 3 jours ou plus",`<table><thead><tr><th class="l">Article</th><th>Vendu</th><th>Plus vendu depuis</th><th>Qté / jour vendu</th></tr></thead><tbody>${rup.slice(0,150).map(e=>`<tr class="vtclk" data-vt="fiche" data-v="${esc(e.k)}"><td class="l">${esc(e.nm)}</td><td>${e.n} j / ${L.length}</td><td class="neg"><b>${e.gap} jour${e.gap>1?"s":""}</b></td><td>${vtQ(Math.round(e.q/e.n*10)/10)}</td></tr>`).join("")}</tbody></table>`)}
  ${sec("Sous-familles en baisse",bas.length,"7 derniers jours contre la moyenne des 3 semaines d'avant (−30 % ou plus)",`<table><thead><tr><th class="l">Sous-famille</th><th>7 derniers jours</th><th>Moyenne avant</th><th>Écart</th></tr></thead><tbody>${bas.map(e=>`<tr><td class="l">${esc(e.nm)}</td><td>${vtE0(e.r)}</td><td>${vtE0(e.m)}</td><td class="neg"><b>${vtP(e.ev)}</b></td></tr>`).join("")}</tbody></table>`)}
  ${sec("Sous-familles en hausse",hau.length,"+30 % ou plus",`<table><thead><tr><th class="l">Sous-famille</th><th>7 derniers jours</th><th>Moyenne avant</th><th>Écart</th></tr></thead><tbody>${hau.map(e=>`<tr><td class="l">${esc(e.nm)}</td><td>${vtE0(e.r)}</td><td>${vtE0(e.m)}</td><td class="pos"><b>+${vtP(e.ev)}</b></td></tr>`).join("")}</tbody></table>`)}
  ${sec("Changements de prix",PX.length,"prix de vente stable avant, puis un autre prix stable ces 7 derniers jours",`<table><thead><tr><th class="l">Article</th><th>Avant</th><th>Maintenant</th><th>Écart</th></tr></thead><tbody>${PX.slice(0,150).map(e=>`<tr class="vtclk" data-vt="fiche" data-v="${esc(e.k)}"><td class="l">${esc(e.nm)}</td><td>${vtE(e.a)}</td><td><b>${vtE(e.b)}</b></td><td class="${e.b>e.a?"neg":"pos"}">${e.b>e.a?"+":""}${vtP(e.b/e.a-1)}</td></tr>`).join("")}</tbody></table>`)}
  ${sec("Nouveaux articles",NV.length,"vendus ces 7 derniers jours, jamais dans les 4 semaines d'avant",`<table><thead><tr><th class="l">Article</th><th>1re vente</th><th>Qté</th><th>CA TTC</th></tr></thead><tbody>${NV.slice(0,150).map(e=>`<tr class="vtclk" data-vt="fiche" data-v="${esc(e.k)}"><td class="l">${esc(e.nm)}</td><td>${esc(vtDl(e.first))}</td><td>${vtQe(e)}</td><td>${vtE(e.ca)}</td></tr>`).join("")}</tbody></table>`)}`}

/* ================= Stockage local + synchronisation (comme GESTIME) =================
   Même interface que la base en ligne : doc(), collection(), get/set/update/delete, onSnapshot.
   Les données sont rangées PAR MAGASIN : un enregistrement par magasin (bredis, clamart…) + « commun » (logo).
   PC : fichiers gesmar-<id>.json dans le dossier des données (window.api). Navigateur : localStorage.
   Synchronisation Supabase (table « gesmar », une ligne par magasin) : envoi après chaque modification,
   relecture toutes les 15 s, numéro de révision « rev » pour ne jamais écraser la saisie d'un autre poste. */
const SEED={"magasins/bredis":{"nom":"BREDIS","ordre":0},"magasins/clamart":{"nom":"CLAMART","ordre":1}};
const PC=!!(window.api&&typeof window.api.load==="function");
const LS_PRE="gesmar.v2.";
function rawLoad(name){try{return PC?window.api.load(name):localStorage.getItem(LS_PRE+name)}catch(e){return null}}
function rawSave(name,j){if(PC)window.api.save(name,j);else localStorage.setItem(LS_PRE+name,j)}
const clone=o=>JSON.parse(JSON.stringify(o));
const blobOf=path=>{const s=path.split("/");return s[0]==="magasins"&&s[1]?s[1]:"commun"};
const DEFAULT_IDS=["commun","bredis","clamart"];

let STORE={};const META={}; // META[id] = {rev, dirty:{chemin:compteur}, base:{chemin: version du serveur avant la modification}}
const meta=id=>META[id]||(META[id]={rev:0,dirty:{},base:{}});
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
const isObj=o=>o&&typeof o==="object"&&!Array.isArray(o);
// Fusion case par case (même règle que GESTIME) : chaque poste garde ses saisies ;
// une case tapée EN MÊME TEMPS sur deux postes est effacée partout et doit être réécrite.
function gmMerge(base,mine,theirs,res){const J=JSON.stringify,eq=(a,b)=>J(a)===J(b),obj=o=>o&&typeof o==="object"&&!Array.isArray(o),prim=v=>v===undefined||v===null||typeof v!=="object",cp=v=>v===undefined?undefined:JSON.parse(J(v));
  if(eq(mine,base))return cp(theirs);if(eq(theirs,base))return cp(mine);if(eq(mine,theirs))return cp(mine);
  if(obj(mine)&&obj(theirs)){const b=obj(base)?base:{},o={};for(const k of new Set([...Object.keys(b),...Object.keys(mine),...Object.keys(theirs)])){const v=gmMerge(b[k],mine[k],theirs[k],res);if(v!==undefined)o[k]=v}return o}
  if(Array.isArray(mine)&&Array.isArray(theirs)){const idd=a=>a.every(x=>obj(x)&&x.id!=null);
    if(idd(mine)&&idd(theirs)){const B=new Map((Array.isArray(base)&&idd(base)?base:[]).map(x=>[x.id,x])),M=new Map(mine.map(x=>[x.id,x])),T=new Map(theirs.map(x=>[x.id,x])),out=[];
      for(const i of [...mine.map(x=>x.id),...theirs.map(x=>x.id).filter(i=>!M.has(i))]){const v=gmMerge(B.get(i),M.get(i),T.get(i),res);if(v!==undefined)out.push(v)}return out}
    return cp(mine)}
  if(prim(mine)&&prim(theirs)){res.n++;return typeof mine==="string"||typeof theirs==="string"?"":undefined}
  return cp(mine)}
const EFF_MSG="⚠️ Une case a été tapée en même temps sur un autre poste : elle a été effacée, réécrivez-la.";
function gmNotice(msg){let n=document.getElementById("gtn");if(!n){n=document.createElement("div");n.id="gtn";n.setAttribute("role","alert");document.body.appendChild(n);n.addEventListener("click",()=>n.remove())}
  n.textContent=msg+"  ✕";clearTimeout(gmNotice.t);gmNotice.t=setTimeout(()=>{const x=document.getElementById("gtn");if(x)x.remove()},10000)}
function mark(path){const m=meta(blobOf(path));if(!(path in m.dirty)&&!(path in m.base))m.base[path]=STORE[path]===undefined?null:clone(STORE[path])}
function blobDocs(id){const o={};for(const k of Object.keys(STORE))if(blobOf(k)===id)o[k]=STORE[k];return o}
function knownIds(){const s=new Set(DEFAULT_IDS);Object.keys(STORE).forEach(k=>s.add(blobOf(k)));Object.keys(META).forEach(k=>s.add(k));return[...s]}
function saveBlob(id){const m=meta(id);rawSave("gesmar-"+id,JSON.stringify({app:"GESMAR",magasin:id,rev:m.rev,dirty:Object.keys(m.dirty),base:m.base,docs:blobDocs(id)}))}

/* --- chargement : fichiers par magasin ; sinon reprise de l'ancien fichier unique (ou des données de départ) --- */
(function boot(){
  let found=false,extra=[];try{extra=JSON.parse(rawLoad("gesmar-index")||"[]")}catch(e){}
  for(const id of new Set(DEFAULT_IDS.concat(extra))){
    let b=null;try{b=JSON.parse(rawLoad("gesmar-"+id)||"null")}catch(e){}
    if(b&&b.docs){found=true;Object.assign(STORE,b.docs);const m=meta(id);m.rev=b.rev||0;(b.dirty||[]).forEach(p=>m.dirty[p]=1);m.base=b.base||{}}
  }
  if(!found){
    let old=null;try{old=JSON.parse((PC?window.api.load("gesmar"):localStorage.getItem("gesmar.db.v1"))||"null")}catch(e){}
    if(old&&old.data&&typeof old.data==="object"&&!Array.isArray(old.data))old=old.data; // fichier d'export
    STORE=old&&typeof old==="object"?old:clone(SEED);
    for(const k of Object.keys(STORE))if(k.startsWith("__meta/"))delete STORE[k];
    try{knownIds().forEach(saveBlob);rawSave("gesmar-index",JSON.stringify(knownIds()))}catch(e){}
  }
})();

const LISTENERS=new Set();let notifyQueued=false;
function notify(){if(!notifyQueued){notifyQueued=true;setTimeout(()=>{notifyQueued=false;LISTENERS.forEach(f=>f())},0)}}
function persist(path){const id=blobOf(path),m=meta(id);m.dirty[path]=(m.dirty[path]||0)+1;
  try{saveBlob(id);if(!DEFAULT_IDS.includes(id))rawSave("gesmar-index",JSON.stringify(knownIds()))}
  catch(e){throw{code:"quota_exceeded",message:PC?"Enregistrement sur le disque impossible":"Stockage du navigateur plein"}}
  notify();SYNC.schedule(id)}
function deepMerge(t,p){for(const[k,v]of Object.entries(p)){if(v&&typeof v==="object"&&!Array.isArray(v)&&t[k]&&typeof t[k]==="object"&&!Array.isArray(t[k]))deepMerge(t[k],v);else t[k]=clone(v)}return t}
const freeze=o=>o==null?o:Object.freeze(clone(o));
function snapDoc(path){const b=STORE[path];return{id:path.split("/").pop(),exists:b!==undefined,data:()=>b===undefined?undefined:freeze(b),metadata:{fromCache:false,hasPendingWrites:false}}}
function docRef(path){
  const segs=path.split("/");if(segs.length%2)throw new TypeError("Chemin de document invalide : "+path);
  return{id:segs[segs.length-1],path,
    get:async()=>snapDoc(path),
    set:async b=>{mark(path);STORE[path]=clone(b);persist(path)},
    update:async p=>{if(STORE[path]===undefined)throw{code:"invalid_argument",message:"Document absent"};mark(path);deepMerge(STORE[path],p);persist(path)},
    delete:async()=>{mark(path);delete STORE[path];persist(path)},
    onSnapshot:(next)=>{const f=()=>next(snapDoc(path));LISTENERS.add(f);setTimeout(f,0);return()=>LISTENERS.delete(f)},
    collection:sub=>colRef(path+"/"+sub)};
}
function colRef(path){
  const pre=path+"/";
  const docs=()=>Object.keys(STORE).filter(k=>k.startsWith(pre)&&!k.slice(pre.length).includes("/")).sort().map(snapDoc);
  const snap=()=>{const d=docs();return{docs:d,size:d.length,empty:!d.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}}};
  return{path,doc:id=>docRef(pre+(id||("id"+Date.now().toString(36)+Math.random().toString(36).slice(2,8)))),
    add:async b=>{const r=docRef(pre+"id"+Date.now().toString(36)+Math.random().toString(36).slice(2,8));await r.set(b);return r},
    get:async()=>snap(),
    onSnapshot:(next)=>{const f=()=>next(snap());LISTENERS.add(f);setTimeout(f,0);return()=>LISTENERS.delete(f)},
    where(){return this},orderBy(){return this},limit(){return this}};
}
const LocalDB={doc:docRef,collection:colRef};

/* ================= Synchronisation Supabase ================= */
const SYNC=(()=>{
  const st={state:"off",msg:"Synchronisation non réglée",busy:false,timer:null,pend:new Set(),poll:null,started:false};
  function cfg(){let c=window.SYNC&&window.SYNC.url&&window.SYNC.key?{url:window.SYNC.url,key:window.SYNC.key}:null;
    if(!c){try{const s=JSON.parse(rawLoad("gesmar-sync")||"null");if(s&&s.url&&s.key)c=s}catch(e){}}
    if(!c&&WEBM)c=gtCfg(); // v154 : version web : code d'accès GT1 commun avec GESTIME Web
    if(c&&/VOTRE/.test(c.url+"|"+c.key))c=null;if(c)c={url:String(c.url).trim().replace(/\/+$/,""),key:String(c.key).trim()};return c}
  const ERR=/Erreur|Accès|Table/;
  function set(state,msg){const ch=st.state!==state||st.msg!==msg;st.state=state;st.msg=msg;if(ch&&typeof renderModal==="function"&&S.modal)renderModal()}
  async function req(path,opt,again){const c=cfg();
    const auth=WEBM?{Authorization:"Bearer "+await GA.token(c)}:(c.key.split(".").length===3?{Authorization:"Bearer "+c.key}:{}); // v154 : web = connexion G20
    const r=await fetch(c.url+"/rest/v1/"+path,Object.assign({},opt,{headers:Object.assign({apikey:c.key,"Content-Type":"application/json"},auth,opt&&opt.headers)}));
    if(r.status===401&&WEBM&&!again){GA.drop();return req(path,opt,true)}
    if(!r.ok){let t="";try{t=(await r.json()).message||""}catch(e){}
      throw new Error(r.status===401||r.status===403?"Accès refusé par la base (vérifiez la clé et le script SQL)":r.status===404||/does not exist|schema cache/.test(t)?"Table « gesmar » absente : lancez le script SQL dans Supabase":"Erreur "+r.status+(t?" : "+t:""))}
    return r.status===204||r.status===201?null:r.json()}
  const pull=async id=>{const a=await req("gesmar?id=eq."+encodeURIComponent(id)+"&select=data,rev");return a&&a[0]||null};
  const hasDocs=o=>!!(o&&o.docs&&Object.keys(o.docs).length);
  // Prend la version du serveur pour un magasin, en gardant les modifications locales pas encore envoyées.
  function adopt(id,row){const m=meta(id),rd=(row.data&&row.data.docs)||{};
    for(const k of Object.keys(STORE))if(blobOf(k)===id&&!(k in m.dirty)&&!(k in rd))delete STORE[k];
    for(const[k,v]of Object.entries(rd))if(!(k in m.dirty))STORE[k]=v;
    const res={n:0};
    for(const k of Object.keys(m.dirty)){ // case par case pour les documents que ce poste a modifiés
      const theirs=rd[k],v=(k in m.base)?gmMerge(m.base[k]===null?undefined:m.base[k],STORE[k],theirs,res):STORE[k];
      if(v===undefined)delete STORE[k];else STORE[k]=v;m.base[k]=theirs===undefined?null:clone(theirs)}
    m.rev=row.rev;
    if(res.n){m.eff=Date.now();m.effSeen=m.eff;gmNotice(EFF_MSG)}
    else{const e=row.data&&row.data.eff;if(e&&e>(m.effSeen||0)){if(st.started&&m.seenOnce)gmNotice(EFF_MSG);m.effSeen=e}}
    m.seenOnce=true;saveBlob(id);notify()}
  async function push(id){const m=meta(id);
    for(let essai=0;essai<4;essai++){
      const sent=Object.assign({},m.dirty),body={data:{app:"GESMAR",magasin:id,docs:blobDocs(id),eff:m.eff||undefined},rev:m.rev+1,updated_at:new Date().toISOString()};
      const a=await req("gesmar?id=eq."+encodeURIComponent(id)+"&rev=eq."+m.rev,{method:"PATCH",headers:{Prefer:"return=representation"},body:JSON.stringify(body)});
      if(a&&a.length){m.rev=a[0].rev;for(const[p,n]of Object.entries(sent))if(m.dirty[p]===n){delete m.dirty[p];delete m.base[p]}else m.base[p]=body.data.docs[p]===undefined?null:clone(body.data.docs[p]);saveBlob(id);return}
      const r=await pull(id);
      if(!r){await req("gesmar",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({id,data:{app:"GESMAR",magasin:id,docs:{}},rev:0})});m.rev=0;continue}
      adopt(id,r); // un autre poste venait d'enregistrer : on reprend sa version + nos modifications, puis on renvoie
    }
    throw new Error("Erreur : trop de modifications en même temps, nouvel essai bientôt")}
  async function flush(){if(st.busy||!cfg()||!st.started)return;st.busy=true;const ids=[...st.pend];st.pend.clear();set("wait","Envoi…");
    try{for(const id of ids)await push(id);set("ok","Synchronisé avec les autres postes")}
    catch(e){ids.forEach(i=>st.pend.add(i));if(WEBM&&!GA.has()){st.started=false;set("off","Pas connecté");gmLogin("Session terminée : reconnectez-vous.");return}set("ko",ERR.test(e.message)?e.message:"Hors ligne : modifications gardées sur cet appareil");setTimeout(flush,5000)}
    finally{st.busy=false;if(st.pend.size&&st.state!=="ko")setTimeout(flush,800)}}
  function schedule(id){if(!cfg()||!st.started)return;st.pend.add(id);clearTimeout(st.timer);st.timer=setTimeout(flush,800)}
  async function first(){ // au démarrage : on compare chaque magasin avec le serveur
    try{const all=await req("gesmar?select=id,rev");for(const x of all||[])meta(x.id)}catch(e){throw e}
    for(const id of knownIds()){const m=meta(id),r=await pull(id),n=Object.keys(blobDocs(id)).length;
      if(r&&r.data&&r.data.eff)m.effSeen=Math.max(m.effSeen||0,r.data.eff);
      if(!r){if(n)st.pend.add(id);continue}
      if(!hasDocs(r.data)){m.rev=r.rev;if(n)st.pend.add(id);continue} // ligne vide : ce poste y envoie ses données
      if(r.rev>m.rev){if(m.rev===0&&n){try{rawSave("gesmar-"+id+"-avant-synchro",JSON.stringify({app:"GESMAR",magasin:id,docs:blobDocs(id)}))}catch(e){}}
        adopt(id,r)}
      else if(r.rev<m.rev)m.rev=r.rev; // la base a été remise à zéro : on renvoie tout
      if(Object.keys(m.dirty).length)st.pend.add(id)}
    knownIds().forEach(id=>{meta(id).seenOnce=true});
    rawSave("gesmar-index",JSON.stringify(knownIds()))}
  async function poll(){if(!cfg()||!st.started||st.busy||st.pend.size)return;const a=document.activeElement;if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))return;
    try{const all=await req("gesmar?select=id,rev");let ch=false;
      for(const x of all||[]){const m=meta(x.id);if(x.rev>m.rev){const r=await pull(x.id);if(r){adopt(x.id,r);ch=true;if(Object.keys(m.dirty).length)st.pend.add(x.id)}}}
      if(st.pend.size)flush();else set("ok",ch?"Mis à jour depuis un autre poste":"Synchronisé avec les autres postes")}
    catch(e){if(WEBM&&!GA.has()){st.started=false;clearInterval(st.poll);set("off","Pas connecté");gmLogin("Session terminée : reconnectez-vous.");return}set("ko",ERR.test(e.message)?e.message:"Hors ligne")}}
  let visHook=false;
  async function start(){if(st.started)return;if(WEBM&&(!cfg()||!GA.has())){set("off","Pas connecté");gmLogin("");return}
    if(!cfg()){set("off","Synchronisation non réglée");return}
    st.started=true;set("wait","Synchronisation…");
    try{await first();if(st.pend.size)await flush();else set("ok","Synchronisé avec les autres postes")}
    catch(e){st.started=false;if(WEBM&&!GA.has()){set("off","Pas connecté");gmLogin("Session terminée : reconnectez-vous.");return}set("ko",ERR.test(e.message)?e.message:"Hors ligne : modifications gardées sur cet appareil");setTimeout(start,15000);return}
    clearInterval(st.poll);st.poll=setInterval(poll,15000);
    if(!visHook){visHook=true;document.addEventListener("visibilitychange",()=>{if(!document.hidden)poll()})}}
  function configure(url,key){rawSave("gesmar-sync",JSON.stringify({url:String(url).trim(),key:String(key).trim()}));st.started=false;return start()}
  function markAll(){for(const k of Object.keys(STORE)){const m=meta(blobOf(k));m.dirty[k]=(m.dirty[k]||0)+1}knownIds().forEach(id=>{saveBlob(id);schedule(id)})}
  return{st,cfg,start,schedule,configure,markAll,poll};
})();

// v64 : fichier « GESMAR-AJOUT » préparé par Claude à partir du tableau de marge Excel. Deux façons, choisies dans le fichier :
// - mois « remplacer » : CA et achats du mois = exactement ceux du fichier (le CA N-1, la démarque et la note du mois sont gardés) ;
// - sinon : chaque case remplie du fichier remplace celle du logiciel, les autres ne bougent pas.

const ajNk=t=>String(t||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/gi,"").toUpperCase();

  if(!await askConfirm("Importer dans "+storeNom()+" :"+(ms?"\n- "+((j.mois||[]).length>3?(j.mois.length+" mois, de "+MOIS[+j.mois[0].cle.slice(5,7)-1].toLowerCase()+" "+j.mois[0].cle.slice(0,4)+" à "+MOIS[+j.mois[j.mois.length-1].cle.slice(5,7)-1].toLowerCase()+" "+j.mois[j.mois.length-1].cle.slice(0,4)):ms)+"\n  CA, achats et colonnes de chaque mois = ceux du fichier"+((j.mois||[]).some(m=>m.effacerN1)?" (CA N-1 : celui du fichier, sinon l'année d'avant)":" (CA N-1, démarque et note gardés)"):"")+(nA?"\n- "+nA+" avoir(s) (sauf ceux déjà présents)":"")+(j.fusion?"\n- avoirs rattachés : "+Object.entries(j.fusion).map(([a,b])=>a+" → "+b).join(", "):"")+"\n\nContinuer ?"))return;
  const FI={};S.fourn.filter(f=>!f.groupe||true).slice().sort((a,b)=>(b.colonne&&b.actif!==false)-(a.colonne&&a.actif!==false)).forEach(f=>{const k=ajNk(f.nom);if(!(k in FI))FI[k]=f.id});
  let crees=0;
  const fid=async(nom,col=true)=>{const k=ajNk(nom);if(FI[k])return FI[k];let id=k.toLowerCase().slice(0,30)||"fournisseur",n=1;while(S.fourn.find(f=>f.id===id)){n++;id=k.toLowerCase().slice(0,26)+n}
    const ordre=S.fourn.reduce((m,f)=>Math.max(m,f.ordre??0),0)+1,nm=String(nom).toUpperCase();
    await S.db.doc(P("fournisseurs/"+id)).set({nom:nm,ordre,actif:true,colonne:col,avoirs:true,contact:""});S.fourn.push({id,nom:nm,ordre,actif:true,colonne:col});FI[k]=id;crees++;return id};
  let cases=0,avOk=0,avDeja=0,avMoves=0,dernier=null;
  try{
    for(const mo of (j.mois||[])){const key=mo.cle,doc=S.mois[key],old=(doc&&doc.jours)||{};
      const jours=mo.effacerN1?{}:mo.remplacer?Object.fromEntries(Object.entries(old).filter(([d,v])=>v&&v.caN1!=null&&v.caN1!=="").map(([d,v])=>[d,{caN1:v.caN1}])):JSON.parse(JSON.stringify(old));
      for(const[d,v]of Object.entries(mo.jours||{})){const jj=jours[d]||{};
        if(v.ca!=null){jj.ca=v.ca;cases++} if(v.caN1!=null){jj.caN1=v.caN1;cases++}
        for(const[nom,val]of Object.entries(v.achats||{})){jj.achats=Object.assign({},jj.achats||{});
          const same=S.fourn.filter(f=>ajNk(f.nom)===ajNk(nom)).map(f=>f.id),id=same.find(x=>x in jj.achats)||await fid(nom);
          same.forEach(x=>{if(x!==id)delete jj.achats[x]});jj.achats[id]=val;cases++}
        jours[d]=jj}
      const upd={jours};if(Array.isArray(mo.colonnes)){const ids=[];for(const nom of mo.colonnes){const id=await fid(nom,false);if(!ids.includes(id))ids.push(id)}upd.colonnes=ids} // v74 : colonnes du mois = celles de l'Excel
      const ref=S.db.doc(P("mois/"+key));if(doc)await ref.set(Object.assign(JSON.parse(JSON.stringify(doc)),upd)); /* v76 : remplace vraiment les jours (update fusionnait et gardait les anciens montants) */ else await ref.set({annee:+key.slice(0,4),mois:+key.slice(5,7),...upd});if(upd.colonnes)dernier=upd.colonnes}

    if(j.fusion){const fu={};for(const[o,n]of Object.entries(j.fusion))fu[ajNk(o)]=n;
      for(const a of S.avoirs){const f=S.fourn.find(x=>x.id===a.fournisseur);if(!f)continue;const k=ajNk(f.nom),cible=k in fu?await fid(fu[k],false):FI[k];
        if(cible&&cible!==a.fournisseur){await S.db.doc(P("avoirs/"+a.id)).update({fournisseur:cible,majLe:a.majLe||todayISO()});a.fournisseur=cible;avMoves++}}}
    for(const a of (j.avoirs||[])){const id=await fid(a.fournisseur,false);
      if(S.avoirs.some(x=>x.fournisseur===id&&ajNk(x.produit)===ajNk(a.produit)&&String(x.date||"")===String(a.date||"")&&ajNk(x.code)===ajNk(a.code))){avDeja++;continue}
      const t=todayISO();await S.db.collection(P("avoirs")).add({fournisseur:id,date:a.date||t,produit:a.produit||"",code:a.code||"",facture:a.facture||"",quantite:a.quantite||"",motif:a.motif||"Autre",

  }catch(e){fail(e)}}
function applyImportText(t){const aj=isAjout(t);if(aj){applyAjout(aj);return}
  try{const j=JSON.parse(t);const d=j&&j.data;if(!d||typeof d!=="object")throw 0;
    const before=Object.keys(STORE);STORE=clone(d);for(const k of Object.keys(STORE))if(k.startsWith("__meta/"))delete STORE[k];
    for(const id in META)META[id].base={};before.forEach(k=>{const m=meta(blobOf(k));m.dirty[k]=(m.dirty[k]||0)+1});SYNC.markAll();
    rawSave("gesmar-index",JSON.stringify(knownIds()));S.store=null;try{localStorage.removeItem("gesmar.store")}catch(_){};toast("Sauvegarde importée");setTimeout(()=>location.reload(),1500)}
  catch(e){toast("Fichier non reconnu : choisissez un export GESMAR (.json).")}}

let unsubs=[];
function subscribeStore(){
  unsubs.forEach(u=>{try{u()}catch(_){}});unsubs=[];
  S.fourn=[];S.mois={};S.avoirs=[];S.inv=[];S.reglages=null;S.avoirsAuto=[];S.facImp={};S.facReg=null;if(S.fac){S.fac.liste=[];S.fac.ecartes=[];S.fac.dernier=0}S.confirmDem=null;S.confirmInv=null;S.fFourn="";S.edit=null;S.confirmDel=null;
  if(!S.store)return render();
  const db=S.db,err=e=>console.error(e);
  unsubs.push(db.collection(P("fournisseurs")).onSnapshot(s=>{S.fourn=s.docs.map(d=>({id:d.id,...d.data()}));schedule()},err));
  unsubs.push(db.collection(P("mois")).onSnapshot(s=>{S.mois={};s.docs.forEach(d=>S.mois[d.id]=d.data());schedule()},err));
  unsubs.push(db.doc(P("reglages/general")).onSnapshot(d=>{S.reglages=d.exists?d.data():null;schedule()},err));
  unsubs.push(db.collection(P("avoirs")).onSnapshot(s=>{S.avoirs=s.docs.map(d=>({id:d.id,...d.data()}));avNorm();schedule()},err));
  unsubs.push(db.collection(P("avoirsAuto")).onSnapshot(s=>{S.avoirsAuto=s.docs.map(d=>({id:d.id,...d.data()}));schedule()},err)); // v86
  unsubs.push(db.collection(P("factures")).onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());S.facImp=o},err));
  unsubs.push(db.doc(P("reglages/factures")).onSnapshot(d=>{S.facReg=d.exists?d.data():null},err));
  unsubs.push(db.collection(P("inventaires")).onSnapshot(s=>{S.inv=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.date);schedule()},err));
  render();
}

      if(S.majBusy||(el&&/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)))return;
      if(new Date().getHours()<H){soir=false;return}
      S.majBusy=true;try{const r=await window.api.updateCheck(majUrl());soir=r.status==="error";
        if(r.status==="new"){await new Promise(f=>setTimeout(f,2000));const x=await window.api.updateApply(majUrl());if(x.status==="done")return;soir=true}}catch(e){soir=true}
      S.majBusy=false};
    setInterval(()=>{const n=new Date(),d=n.toDateString();if(n.getHours()>=H&&fait!==d){fait=d;soir=true}if(soir)soirGo()},60000)}
  S.db=wrapDb(db);render();facAuto();caAuto(); // v86 : recherche automatique des nouvelles factures
  setTimeout(()=>SYNC.start().catch(()=>{}),300);
  db.doc("config/app").onSnapshot(d=>{S.config=d.exists?d.data():{};schedule()},e=>console.error(e));
  db.collection("magasins").onSnapshot(s=>{
    S.magasins=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.ordre??99)-(b.ordre??99));S.magLoaded=true;
    if(!S.magasins.find(m=>m.id===S.store)){const first=S.magasins[0];if(first){S.store=first.id;subscribeStore()}else{S.store=null;render()}}
    else if(!unsubs.length)subscribeStore(); else schedule();
  },e=>console.error(e));
})();
render();
})();
</script>
