<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GESMAR</title>
<script>/* version web : réglages Supabase dans config.js (à côté de index.html). Programme PC : fournis par le programme. */if(!window.api)document.write('<script src="config.js"><\/script>')</script>
<meta name="gm-version" content="69">
<style>
/* Layout (repris de GESTIME) : bandeau blanc [icône + titre + magasin ⌂] [logo] [⚙], rangée de 4 grands onglets verts, sélecteur de période, puis cartes coiffées d'un bandeau rouge. */
:root{
  --bg:#eef1ed; --surface:#ffffff; --sunk:#f1f4f0; --line:#d6ddd5; --fg:#18231b; --muted:#5d6b60;
  --green:#17613a; --green-2:#23824d; --green-soft:#e2f0e6; --on-green:#ffffff;
  --red:#c4161c; --red-2:#e2342b; --red-soft:#fbe5e3; --on-red:#ffffff;
  --accent:var(--green); --accent-soft:var(--green-soft); --accent-fg:var(--on-green);
  --warn:#9a5b00; --warn-soft:#fbefd9; --bad:#b3261e; --bad-soft:#fbe4e1; --good:#17613a; --good-soft:#e2f0e6; --info:#2d5a8a; --info-soft:#e2ebf5;
  --bar-empty:#dfe5dd; --n1:#e7a3a0; --hdr:#ffffff; --tab-on:#3cb44b; --teal:#2fa89e; --on-teal:#ffffff; --panel:#ffffff; --logo-bg:transparent; --logo-pad:0; --shadow:0 1px 2px rgba(20,40,25,.08),0 2px 8px rgba(20,40,25,.05);
  --display:system-ui,-apple-system,"Segoe UI",sans-serif; --body:system-ui,-apple-system,"Segoe UI",sans-serif; /* police de Windows, comme GESTIME */
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#2a2e32; --surface:#33383c; --sunk:#3b4045; --line:#4a5055; --fg:#eef0f1; --muted:#a8b0b5;
  --green:#36a84a; --green-2:#45c05a; --green-soft:#2c3f31; --on-green:#ffffff;
  --hdr:#1f2326; --tab-on:#3cb44b; --teal:#5fd0c6; --on-teal:#10302d; --panel:#3a3f44;
  --red:#b8191f; --red-2:#d6322a; --red-soft:#3d1d1c; --on-red:#ffffff;
  --warn:#f0b65a; --warn-soft:#3a2e17; --bad:#f08a80; --bad-soft:#3d1f1c; --good:#5cc28d; --good-soft:#1c3325; --info:#8db7e6; --info-soft:#1d2a3a;
  --bar-empty:#2b332d; --n1:#8a4441; --logo-bg:#ffffff; --logo-pad:4px 8px; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#2a2e32; --surface:#33383c; --sunk:#3b4045; --line:#4a5055; --fg:#eef0f1; --muted:#a8b0b5;
  --green:#36a84a; --green-2:#45c05a; --green-soft:#2c3f31; --on-green:#ffffff;
  --hdr:#1f2326; --tab-on:#3cb44b; --teal:#5fd0c6; --on-teal:#10302d; --panel:#3a3f44;
  --red:#b8191f; --red-2:#d6322a; --red-soft:#3d1d1c; --on-red:#ffffff;
  --warn:#f0b65a; --warn-soft:#3a2e17; --bad:#f08a80; --bad-soft:#3d1f1c; --good:#5cc28d; --good-soft:#1c3325; --info:#8db7e6; --info-soft:#1d2a3a;
  --bar-empty:#2b332d; --n1:#8a4441; --logo-bg:#ffffff; --logo-pad:4px 8px; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
.wrap.wide{max-width:none;padding-inline:12px}
.wrap.wide .sub{max-width:none}
.sheet-scroll{max-height:none;min-height:0;overflow:visible} /* v38 : plus de barre de défilement dans la saisie : toute la page défile */

/* ---- bandeau du haut (repris de GESTIME) ---- */
header.top{background:var(--hdr)}
.bar{max-width:1280px;margin:0 auto;padding:12px 16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.ident{display:flex;align-items:center;gap:12px;min-width:0}
.appico{flex:none;width:46px;height:46px;border-radius:11px;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.appico svg{width:100%;height:100%;display:block}
.apptitle{font-family:var(--display);font-weight:900;font-size:27px;line-height:1;letter-spacing:.02em;color:var(--fg)}
.apptitle b{color:var(--red-2)}
.store{display:flex;align-items:center;gap:8px;margin-top:5px;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.24em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.house{border:1px solid var(--line);background:var(--surface);color:var(--fg);width:26px;height:26px;display:grid;place-items:center;cursor:pointer;padding:0;border-radius:8px} /* v32 : petite case autour de la maison, comme GESTIME */
.house svg{width:16px;height:16px}
.logo{justify-self:center;display:flex;align-items:center;min-height:46px}
.logo img{max-height:46px;max-width:120px;display:block;background:var(--logo-bg);border-radius:6px;padding:var(--logo-pad)}
.logo .ph{border:1.5px dashed var(--line);color:var(--muted);background:none;border-radius:8px;padding:8px 12px;font:600 12px var(--body);cursor:pointer}
.tools{justify-self:end;display:flex;gap:8px}
.ibtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:grid;place-items:center;padding:0}
.ibtn svg{width:17px;height:17px}
.ibtn:disabled{opacity:.35;cursor:default}
.ibtn:not(:disabled):hover,.house:hover{color:var(--green-2);border-color:var(--green-2)}
.stripe{height:5px;background:linear-gradient(var(--green) 0 2px,transparent 2px 3px,var(--red-2) 3px 5px)}
.menu{position:absolute;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.25);padding:6px;min-width:200px}
.menu button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:none;color:var(--fg);font:600 14px var(--body);padding:8px 10px;border-radius:6px;cursor:pointer;text-align:left}
.menu button:hover{background:var(--sunk)}
.menu button[aria-current="true"]{background:var(--green-soft);color:var(--green-2)}
nav.tabs{max-width:1280px;margin:0 auto;padding:16px 16px 4px;display:flex;justify-content:center;flex-wrap:wrap;gap:10px}
nav.tabs button{font:800 13px var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 20px;cursor:pointer;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.12)}
nav.tabs button:hover{border-color:var(--tab-on)}
nav.tabs button[aria-selected="true"]{background:var(--tab-on);border-color:var(--tab-on);color:#fff;box-shadow:0 2px 8px rgba(60,180,75,.35)}
.avlate{display:inline-flex;vertical-align:-3px;margin-left:5px}.avlate[hidden]{display:none}.avlate svg.warn{width:17px;height:17px;display:block} /* v45 */
nav.tabs .cnt.blink{animation:updBlink 1s ease-in-out infinite}
nav.tabs .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--red-2);color:var(--on-red);font-size:11px;letter-spacing:0}
@media (max-width:640px){
  .bar{grid-template-columns:1fr auto}
  .logo{grid-column:1/-1;grid-row:2;justify-self:center;min-height:0}
  .apptitle{font-size:23px}
  nav.tabs button{padding:8px 12px;font-size:12px}
}

/* ---- période ---- */
.periode{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.periode .nav{width:34px;height:34px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;cursor:pointer;font-size:16px}
.periode select,.periode input{height:34px}
.periode input{width:80px}
.periode .sp{flex:1}

/* ---- cartes à bandeau rouge ---- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;box-shadow:var(--shadow)}
.panel.flush{padding:0;overflow:hidden}
.band{background:linear-gradient(180deg,var(--red-2),var(--red));color:var(--on-red);font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;text-align:center}
.panel>.band{margin:-16px -16px 14px;border-radius:var(--r) var(--r) 0 0}
.panel.flush>.band{margin:0}
.band .pillbtn{font:700 12px var(--body);letter-spacing:0;text-transform:none;color:var(--on-red);background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.7);border-radius:14px;padding:3px 12px;cursor:pointer}
.band .pillbtn:hover{background:rgba(255,255,255,.28)}

h2{font-family:var(--display);font-weight:800;font-size:22px;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px;max-width:75ch}
.lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(175px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.kpi .v{font-family:var(--display);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums}
.kpi.hl .v{color:var(--green)}
.kpi.alert .v{color:var(--red)}
.kpi .d{font-size:12px;color:var(--muted)}
.two{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:860px){.two{grid-template-columns:minmax(0,1fr)}}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface);position:sticky;top:0}
td.l,th.l{text-align:left}
tr.tot td{font-weight:800;border-top:2px solid var(--fg);border-bottom:0}
tr.muted td{color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:700;white-space:nowrap}
.s-a_reclamer{background:var(--warn-soft);color:var(--warn)}
.s-declare{background:var(--warn-soft);color:var(--warn)}
.s-reclame,.s-relance{background:var(--info-soft);color:var(--info)}
.s-accepte,.s-deduit{background:var(--good-soft);color:var(--good)}
.s-refuse{background:var(--bad-soft);color:var(--bad)}
.late{color:var(--bad);font-weight:700}
button.btn,.btn{font:700 13px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:7px 12px;cursor:pointer}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--on-green)}
.btn.red{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.small{padding:3px 8px;font-size:12px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav.tabs button:focus-visible,.gear:focus-visible,.house:focus-visible,.band .pillbtn:focus-visible{outline:2px solid var(--green);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* saisie */
/* grille de saisie : colonnes toutes égales qui se partagent la largeur (elles rétrécissent quand on ajoute un fournisseur) */
.sheet{table-layout:fixed;width:100%}
.sheet td{padding:0;border-right:1px solid var(--line);height:32px;overflow:hidden}
.sheet th{border-right:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;padding:5px 4px;font-size:10.5px}
.sheet th.day,.sheet td.day{width:78px;position:sticky;left:0;background:var(--surface);z-index:1;text-align:left;padding:4px 10px;font-weight:700}
.sheet th.day{z-index:2}
.sheet td.we{color:var(--red)}
.sheet td input{display:block;width:100%;height:100%;min-width:0;box-sizing:border-box;border:0;border-radius:0;background:transparent;text-align:right;padding:6px 6px;font-variant-numeric:tabular-nums;font-size:13px}
.sheet td input::placeholder{font-size:12px}
/* sélection verte = exactement la case */
.sheet td input:focus,.sheet td input:focus-visible{background:var(--green-soft);outline:2px solid var(--green-2);outline-offset:-2px}
.sheet td.calc{padding:6px 6px;background:var(--sunk);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet tr.tot td{padding:7px 6px;background:var(--sunk);overflow:hidden;text-overflow:ellipsis}
.sheet tr.tot td.day{padding:7px 10px}
.sheet .ca input{font-weight:700}
.fhead{display:flex;flex-direction:column;align-items:stretch;gap:3px;min-width:0}
.fctl{display:flex;justify-content:space-between;align-items:center;gap:3px}
.fmv{flex:none;width:20px;height:20px;border-radius:6px;border:1px solid var(--line);background:var(--sunk);color:var(--fg);font:900 13px/1 var(--body);cursor:pointer;padding:0;display:grid;place-items:center}
.fmv:hover:not(:disabled),.fmv:focus-visible{background:var(--green-2);border-color:var(--green-2);color:#fff}
.fmv:disabled{opacity:.3;cursor:default}
.sheet input.fname{flex:1;min-width:0;width:100%;box-sizing:border-box;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:5px 5px;font:800 10px var(--display);letter-spacing:.02em;text-transform:uppercase;color:var(--fg);text-align:left;text-overflow:ellipsis}
.sheet input.fname:focus{border-color:var(--green-2);background:var(--surface);outline:none}
.fx{flex:none;width:20px;height:20px;border-radius:6px;border:1px solid var(--line);background:var(--sunk);color:var(--red-2);font:900 11px/1 var(--body);cursor:pointer;padding:0;display:grid;place-items:center}
.fx:hover,.fx:focus-visible{background:var(--red-2);border-color:var(--red-2);color:#fff}
.rn{cursor:text;border-bottom:1px dashed transparent}
.rn:hover{border-bottom-color:currentColor;color:var(--fg)}
.rnin{width:120px;font:700 11px var(--body);text-transform:uppercase;padding:2px 4px}
.colx{position:absolute;top:3px;right:3px;width:17px;height:17px;border-radius:50%;border:0;background:transparent;color:var(--muted);font:700 13px/17px var(--body);padding:0;cursor:pointer;opacity:.55}
.colx:hover,.colx:focus-visible{opacity:1;background:var(--red-2);color:#fff}
.hidden-cols{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.hidden-cols button{font:600 12px var(--body);border:1px dashed var(--line);background:none;color:var(--fg);border-radius:14px;padding:3px 10px;cursor:pointer}
.hidden-cols button:hover{border-color:var(--green-2);color:var(--green-2)}
.rchip{display:inline-flex;align-items:center;gap:3px}
.hidden-cols button.rdel{border:1px solid var(--line);border-radius:6px;padding:0;width:20px;height:20px;display:grid;place-items:center;color:var(--red-2);font:900 11px/1 var(--body);background:var(--sunk)}
.hidden-cols button.rdel:hover{background:var(--red-2);border-color:var(--red-2);color:#fff}
.sheet td.gtot{background:var(--green-soft);font-weight:700}
/* chart */
svg text{fill:var(--muted);font:11px var(--body)}
svg .vl{fill:var(--fg);font-weight:700}
/* bars list */
.hb{display:grid;grid-template-columns:120px minmax(0,1fr) 90px;gap:4px 8px;align-items:center;font-size:13px}
.hb .tr{height:10px;background:var(--sunk);border-radius:2px;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--green)}
.hb .n{text-align:right;font-variant-numeric:tabular-nums}
.hb span.hsub{font-size:12px;color:var(--muted)} .hb span.hname{padding-left:14px}
.hb .tr.hsub{height:6px} .hb .tr.hsub i{opacity:.55}
/* avoirs */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:5px 12px;font:700 13px var(--body);color:var(--fg);cursor:pointer;display:flex;gap:6px;align-items:baseline}
.chip[aria-pressed="true"]{border-color:var(--green);background:var(--green);color:var(--on-green)}
.chip[aria-pressed="true"] .c{color:var(--on-green)}
.chip .c{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 12px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:700;color:var(--muted)}
.form .wide{grid-column:1/-1}
.hist{font-size:12px;color:var(--muted)}
.empty-state{padding:32px 16px;text-align:center;color:var(--muted)}
.note{background:var(--red-soft);color:var(--fg);border-radius:var(--r);padding:10px 12px;font-size:13px;border:1px solid var(--line)}
.foot{font-size:12px;color:var(--muted);padding:8px 14px}
/* réglages (repris de GESTIME) */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.18)}
.reglages{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));right:max(16px,calc((100vw - 1280px)/2 + 16px));width:min(380px,calc(100vw - 32px));max-height:calc(100vh - 90px);overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.35);padding:16px 18px 18px;z-index:41}
.reglages .head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.reglages .head h3{margin:0;flex:1;font-family:var(--display);font-weight:800;font-size:24px;color:var(--fg);text-shadow:0 0 10px rgba(69,192,90,.45)}
.reglages .cloud{color:var(--green-2);display:grid;place-items:center}
.reglages .cloud svg{width:24px;height:24px}
.reglages .x{border:0;background:none;color:var(--fg);font-size:26px;line-height:1;cursor:pointer;padding:2px 4px}
.reglages h4{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg);margin:16px 0 8px;opacity:.85}
.rbtn{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;margin-bottom:8px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);font:700 16px var(--display);color:var(--fg);cursor:pointer;text-align:left}
.rbtn:hover{border-color:var(--green-2)}
.rbtn .ic{font-size:18px;width:22px;text-align:center}
.ibtn.upd{position:relative}.ibtn.upd::after{content:"";position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--red-2);border:2px solid var(--hdr)}
.rver{font-size:13px;font-weight:700;color:var(--muted);margin:-2px 0 4px 2px}
.rtheme{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rtheme button{padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);color:var(--fg);font:700 16px var(--display);cursor:pointer}
.rtheme button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.rinfo{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;margin:-2px 0 10px;line-height:1.5}
.reglages .row input,.reglages .row select{background:var(--surface)}
.storelist{display:grid;gap:6px}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:var(--r);font-weight:700;font-size:13px;z-index:60}
.gap{height:16px}
@media (prefers-reduced-motion:no-preference){.hb .tr i{transition:width .3s}}

/* ===== Uniformisation avec GESTIME (v17) : mêmes couleurs, même mode sombre, même bandeau, mêmes onglets, mêmes réglages ===== */
:root{--bg:#f6f5f1;--sunk:#f6f5f1;--line:#e2e0d8;--fg:#1d2433;--muted:#6b7385;
  --green:#237a3b;--green-2:#237a3b;--green-soft:#e2f0e4;--good:#237a3b;--good-soft:#e2f0e4;--red:#d3262b;--red-2:#d3262b;
  --tab-on:#237a3b;--teal:#237a3b;--on-teal:#fff;--hdr:#ffffff;--panel:#ffffff;--logo-bg:#fff;--logo-pad:4px 8px}
:root[data-theme="dark"]{--bg:#1f2022;--surface:#2a2b2e;--sunk:#252629;--line:#45474b;--fg:#f4f5f7;--muted:#b8bbc0;
  --green:#3fbf3a;--green-2:#3fbf3a;--green-soft:#2d4a33;--good:#3fbf3a;--good-soft:#2d4a33;--red:#f0473d;--red-2:#f0473d;--bad:#ff7a72;
  --tab-on:#3fbf3a;--teal:#3fbf3a;--on-teal:#fff;--hdr:#151617;--panel:#2a2b2e;--bar-empty:#303134}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f2022;--surface:#2a2b2e;--sunk:#252629;--line:#45474b;--fg:#f4f5f7;--muted:#b8bbc0;
  --green:#3fbf3a;--green-2:#3fbf3a;--green-soft:#2d4a33;--good:#3fbf3a;--good-soft:#2d4a33;--red:#f0473d;--red-2:#f0473d;--bad:#ff7a72;
  --tab-on:#3fbf3a;--teal:#3fbf3a;--on-teal:#fff;--hdr:#151617;--panel:#2a2b2e;--bar-empty:#303134}}
/* double filet fin : vert 2 px, fond 4 px, rouge 2 px (identique à GESTIME, v30) */
.stripe{height:8px;background:linear-gradient(var(--green) 0 2px,var(--bg) 2px 6px,var(--red-2) 6px 8px)}
/* logo G20 sur tuile blanche */
.logo img{max-height:none;max-width:none;height:44px;width:auto;background:#fff;border-radius:8px;padding:4px 8px;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
@media (max-width:640px){.logo img{height:30px;padding:2px 5px}}
/* onglets en MAJUSCULES, petits et centrés sous le bandeau */
nav.tabs{padding:14px 16px 4px;gap:8px}
nav.tabs button{font:700 14px var(--body);letter-spacing:.04em;min-width:132px;padding:7px 10px;border-radius:10px;box-shadow:none}
nav.tabs button[aria-selected="true"]{box-shadow:none}
:root[data-theme="dark"] nav.tabs button[aria-selected="true"]{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);box-shadow:0 0 10px rgba(63,191,58,.5)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav.tabs button[aria-selected="true"]{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);box-shadow:0 0 10px rgba(63,191,58,.5)}}
:root[data-theme="dark"] nav.tabs button:not([aria-selected="true"]){background:#303134;border-color:#45474b;color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav.tabs button:not([aria-selected="true"]){background:#303134;border-color:#45474b;color:#fff}}
@media (max-width:640px){nav.tabs button{min-width:0;width:calc(50% - 6px)}}
/* fenêtre des réglages : même fenêtre que GESTIME (centrée, fond assombri) */
.overlay{background:rgba(0,0,0,.5);z-index:40}
.reglages{top:50%;left:50%;right:auto;transform:translate(-50%,-50%);width:min(380px,calc(100vw - 40px));max-height:calc(100vh - 40px);background:var(--surface);border-radius:14px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.reglages .head{margin-bottom:2px}
.reglages .head h3{font:700 19px var(--body);text-shadow:none}
.reglages .x{border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:18px;line-height:1.2;padding:2px 10px}
.reglages h4{font:400 12px var(--body);color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin:12px 0 8px;opacity:1}
.rbtn{gap:8px;padding:10px 12px;border-radius:8px;background:var(--surface);font:400 15px var(--body)}
.rbtn .ic{font-size:15px;width:auto}
.rtheme{gap:8px}.rtheme button{padding:6px 12px;border-radius:8px;background:var(--surface);font:400 15px var(--body)}
.rtheme button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.rver{font-weight:400;font-size:12px}
.rmaj{font-size:12px;color:var(--muted);margin:2px 0 4px 2px}
.syi{display:inline-flex;align-items:center;line-height:0}
.syi.ok{color:#237a3b}.syi.ko{color:#d3262b}.syi.wait{color:var(--muted)}
:root[data-theme="dark"] .syi.ok{color:#4fd37a}:root[data-theme="dark"] .syi.ko{color:#ff7a74}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .syi.ok{color:#4fd37a}:root:not([data-theme="light"]) .syi.ko{color:#ff7a74}}
.smsg{font-size:13px;color:var(--red-2);margin:4px 0 0}
.sycfg{display:grid;gap:8px}.sycfg input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:13px var(--body)}
#gtn{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:300;max-width:min(560px,calc(100vw - 24px));background:#d3262b;color:#fff;font:700 14px var(--body);padding:10px 16px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.3);cursor:pointer}
/* pastille « 1 » : nouvelle version disponible (sur l'engrenage et sur le bouton Mettre à jour) */
.ibtn.upd{position:relative}
.ibtn.upd::after{content:"1";position:absolute;top:-7px;right:-7px;width:auto;height:17px;min-width:17px;padding:0 4px;border-radius:9px;background:#d3262b;color:#fff;border:0;box-shadow:0 0 0 2px var(--hdr);font:700 11px/17px var(--body);text-align:center}
/* v25 : la pastille « 1 » clignote pour être bien visible (comme GESTIME v30) */
@keyframes updBlink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.2;transform:scale(1.2)}}
.ibtn.upd::after,.rbtn .pas{animation:updBlink 1s ease-in-out infinite}
.rbtn .pas{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#d3262b;color:#fff;font:700 12px/20px var(--body);text-align:center}
[hidden]{display:none!important} img{max-width:100%}
body{margin:0}

/* ===== v34 : bandeau identique à GESTIME (mêmes mesures partout) ===== */
header.top{padding:10px max(18px,calc((100vw - 1280px)/2)) 0}
header.top .bar{max-width:none;margin:0;padding:0;gap:6px 8px;grid-template-columns:1fr auto 1fr;align-items:center}
header.top .ident{gap:10px}
header.top .appico{box-shadow:none;border-radius:0}
header.top .apptitle{line-height:1}
header.top .store{margin-top:4px;gap:7px;line-height:1}
header.top .logo{justify-self:center;min-height:0;background:#fff;border-radius:8px;padding:4px 8px;box-shadow:0 0 0 1px rgba(0,0,0,.18);line-height:0}
header.top .logo img{height:44px;width:auto;max-width:none;max-height:none;padding:0;background:none;box-shadow:none;border-radius:0}
header.top .stripe{margin:12px min(-18px,calc((1280px - 100vw)/2)) 0}
nav.tabs{padding-top:8px}
nav.tabs button{line-height:1.4}
@media (max-width:640px){
  header.top{padding:8px 10px 0}
  header.top .bar{grid-template-columns:1fr auto 1fr}
  header.top .logo{grid-column:auto;grid-row:auto;padding:2px 5px}
  header.top .logo img{height:30px;padding:0}
  header.top .appico{width:36px;height:36px}
  header.top .apptitle{font-size:19px}
  header.top .store{font-size:11px;letter-spacing:.14em}
  header.top .stripe{margin:0 -10px}
  nav.tabs{padding:6px 12px 4px}
}
@media (max-width:480px){
  header.top .ident{gap:5px}
  header.top .house{width:22px;height:22px}
  header.top .house svg{width:14px;height:14px}
  header.top .store{gap:5px}
}

/* v58 : saisie compacte, tout le mois tient sur un écran */
.kpis-s{gap:8px}.kpis-s .kpi{padding:6px 12px;gap:0}.kpis-s .kpi .lbl{font-size:10px}.kpis-s .kpi .v{font-size:19px;line-height:1.25}.kpis-s .kpi .d{font-size:11px}
.sheet td{height:20px}
.sheet td input{padding:1px 4px;font-size:12px}
.sheet td input::placeholder{font-size:11px}
.sheet th{padding:3px 2px;font-size:10px}
.sheet th.day,.sheet td.day{width:60px;padding:1px 6px;font-size:12px}
.sheet td.calc{padding:1px 4px;font-size:12px}
.sheet tr.tot td{padding:3px 4px;font-size:12px}.sheet tr.tot td.day{padding:3px 6px}
.fhead{gap:2px}.fctl{gap:1px}.fctl-ph{height:16px}
.sheet .fmv,.sheet .fhead .fx{width:16px;height:16px;font-size:10px;border-radius:4px}
.sheet input.fname{padding:2px 3px;font-size:9.5px;border-radius:4px}
.wrap{padding-block:10px 48px}.periode{margin-bottom:8px!important}.kpis-s{margin-bottom:8px!important}
.band-s{padding-top:5px!important;padding-bottom:5px!important}
</style>
</head>

<script>
(function(){
const MOIS=["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
const MC=["Janv","Févr","Mars","Avr","Mai","Juin","Juil","Août","Sept","Oct","Nov","Déc"];
const STATUTS=[
  ["declare","Déclaré"],["relance","Relancé"],["accepte","Accepté"],["deduit","Déduit"],["refuse","Refusé"]];
const SLABEL=Object.assign({a_reclamer:"Déclaré",reclame:"Déclaré"},Object.fromEntries(STATUTS));
// v52 : « À réclamer » et « Réclamé » deviennent « Déclaré » (en mémoire ; enregistré à la prochaine modification)
const avNorm=()=>S.avoirs.forEach(a=>{if(a.statut==="a_reclamer"||a.statut==="reclame")a.statut="declare"});
const EN_COURS=["declare","relance","accepte"];
const OBTENU=["accepte","deduit"];
const MOTIFS=["Manquant","Invendable","Reçu abîmé","Reçu allongé","DLC courte","Erreur de prix","Double facturation","Erreur de quantité","Autre"];
const APP_VERSION=69;
const RELANCE_JOURS=7;
const DEM_MOTIFS=["Casse","DLC dépassée","Produit abîmé","Vol constaté","Consommation interne","Erreur de réception","Autre"];
const DEFAULT_COEF=0.919; // HT / TTC du tableau d'analyse de septembre 2026 (262 556,21 / 285 581,84)

const S={db:null,store:null,magasins:[],config:{},assets:null,modal:false,fourn:[],mois:{},avoirs:[],year:2026,tab:"saisie",month:new Date().getMonth(),
  fStat:"en_cours",fFourn:"",fText:"",edit:null,confirmDel:null,loaded:{f:false,m:false,a:false}};
try{S.tab=localStorage.getItem("gesmar.tab")||"saisie";if(!["bord","saisie","avoirs"].includes(S.tab))S.tab="bord";S.store=localStorage.getItem("gesmar.store")}catch(e){}
const P=x=>"magasins/"+S.store+"/"+x;
const slug=t=>t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"");
const storeNom=()=>(S.magasins.find(m=>m.id===S.store)||{}).nom||"—";

const eur=new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const eur2=new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",minimumFractionDigits:2,maximumFractionDigits:2});
const n2=new Intl.NumberFormat("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=v=>v==null||!isFinite(v)?"—":(v*100).toFixed(1).replace(".",",")+" %";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const parseNum=s=>{s=String(s??"").trim().replace(/\s/g,"").replace(/€/g,"").replace(",",".");if(s==="")return null;const v=Number(s);return isFinite(v)?Math.round(v*100)/100:NaN};
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const frDate=iso=>iso?iso.slice(8,10)+"/"+iso.slice(5,7)+"/"+iso.slice(2,4):"—";
const daysSince=iso=>iso?Math.floor((Date.parse(todayISO())-Date.parse(iso))/864e5):null;
const mkey=(y,m)=>y+"-"+String(m+1).padStart(2,"0");
const $=s=>document.querySelector(s);

/* ---------- affichage clair / sombre (comme GESTIME) ---------- */
function getTheme(){try{return localStorage.getItem("gesmar.theme")}catch(e){return null}}
function applyTheme(){const t=getTheme();if(t==="clair")document.documentElement.dataset.theme="light";else if(t==="sombre")document.documentElement.dataset.theme="dark"}
function setTheme(t){try{localStorage.setItem("gesmar.theme",t)}catch(e){};applyTheme();render()}
const isDark=()=>{const d=document.documentElement.dataset.theme;return d?d==="dark":!!(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)};
applyTheme();

/* ---------- annuler / rétablir (flèches du bandeau) ----------
   Chaque écriture garde l'état précédent du document ; les écritures faites dans la même seconde forment une seule action. */
const HIST={undo:[],redo:[],lastT:0,busy:false};
const deepCopy=o=>o==null?null:JSON.parse(JSON.stringify(o));
function wrapDb(db){
  const rec=async(path,fn)=>{
    if(HIST.busy||path.startsWith("config/"))return fn();
    let before;try{const sn=await db.doc(path).get();before=sn.exists?deepCopy(sn.data()):null}catch(e){before=undefined}
    const r=await fn();
    if(before!==undefined){const now=Date.now(),ent={path,before};
      if(now-HIST.lastT<800&&HIST.undo.length)HIST.undo[HIST.undo.length-1].push(ent);else HIST.undo.push([ent]);
      HIST.lastT=now;if(HIST.undo.length>80)HIST.undo.shift();HIST.redo=[];updHist()}
    return r};
  const wd=path=>{const r=db.doc(path);return{id:r.id,path,get:()=>r.get(),onSnapshot:(a,b)=>r.onSnapshot(a,b),collection:p=>wc(path+"/"+p),
    set:b=>rec(path,()=>r.set(b)),update:b=>rec(path,()=>r.update(b)),delete:()=>rec(path,()=>r.delete())}};
  const wc=path=>{const c=db.collection(path);return{path,get:()=>c.get(),onSnapshot:(a,b)=>c.onSnapshot(a,b),
    doc:id=>wd(id?path+"/"+id:c.doc().path),add:async b=>{const ref=wd(c.doc().path);await ref.set(b);return ref}}};
  return{doc:wd,collection:wc,raw:db};
}
function updHist(){const u=$("#undoBtn"),r=$("#redoBtn");if(u)u.disabled=!HIST.undo.length||HIST.busy;if(r)r.disabled=!HIST.redo.length||HIST.busy}
async function histStep(from,to,msg){
  const g=from.pop();if(!g||!S.db)return;HIST.busy=true;updHist();const back=[];
  try{for(const e of g.slice().reverse()){const ref=S.db.raw.doc(e.path);const sn=await ref.get();back.push({path:e.path,before:sn.exists?deepCopy(sn.data()):null});
      if(e.before==null)await ref.delete();else await ref.set(e.before)}
    to.push(back);toast(msg)}catch(err){fail(err)}finally{HIST.busy=false;updHist()}}
const undo=()=>histStep(HIST.undo,HIST.redo,"Modification annulée");
const redo=()=>histStep(HIST.redo,HIST.undo,"Modification rétablie");
document.addEventListener("keydown",e=>{if(!(e.ctrlKey||e.metaKey))return;const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;
  const k=e.key.toLowerCase();if(k==="z"&&!e.shiftKey){e.preventDefault();undo()}else if(k==="y"||(k==="z"&&e.shiftKey)){e.preventDefault();redo()}});

/* ---------- mise à jour du logiciel (programme PC, comme GESTIME) ---------- */
const majUrl=()=>window.SYNC&&window.SYNC.updateUrl;
function majFlag(){const g=$("#gearBtn");if(g)g.classList.toggle("upd",!!majBadge())}
async function majCheck(silent){
  const r=await window.api.updateCheck(majUrl());
  if(r.status==="new"){S.majNew=r.remote;majFlag();S.majMsg="🔔 Nouvelle version disponible ("+r.remote+"), vous avez la "+r.version+"."+(r.note?" "+r.note:"")}
  else if(!silent){S.majMsg=r.status==="none"?"✓ Vous avez la dernière version ("+r.version+").":r.status==="noconfig"?"Adresse des mises à jour non réglée (voir LISEZ-MOI.txt).":"⚠️ Impossible de vérifier : "+(r.msg||"pas de connexion")}
  return r}
async function majPc(){if(S.majBusy)return;S.majSeenV=S.majNew||0;majFlag();S.majBusy=true;S.majMsg="Recherche…";render();
  try{const r=await majCheck(false);render();
    if(r.status==="new"){S.majMsg="Téléchargement…";render();
      // v49 : GitHub met parfois quelques minutes à publier index.html après version.json : nouvel essai chaque minute (5 fois)
      let a=await window.api.updateApply(majUrl());
      for(let k=1;k<=5&&a.status==="error"&&/incomplet/i.test(a.msg||"");k++){
        for(let sec=60;sec>0;sec--){S.majMsg="GitHub n'a pas fini de publier la nouvelle version : nouvel essai dans "+sec+" s ("+k+"/5)…";render();await new Promise(f=>setTimeout(f,1000))}
        S.majMsg="Téléchargement…";render();a=await window.api.updateApply(majUrl())}
      S.majMsg=a.status==="done"?"✓ Mise à jour installée, redémarrage…":"⚠️ "+(a.msg||"échec")}

  S.majBusy=false;render()}

/* ---------- calculs ---------- */
const colFourn=()=>S.fourn.filter(f=>f.colonne);
const fName=k=>(S.fourn.find(f=>f.id===k)||{}).nom||k;
const grp=k=>{const f=S.fourn.find(x=>x.id===k);return f&&f.groupe?f.groupe:null};
const coef=()=>{const c=S.reglages&&+S.reglages.coefHT;return c>0.5&&c<=1?c:DEFAULT_COEF};
function monthStats(y,m){
  const doc=S.mois[mkey(y,m)];const r={ca:0,caTTC:0,caN1:0,achats:0,par:{},jours:0,estimes:0,avoirs:0};
  if(doc&&doc.jours){for(const j of Object.values(doc.jours)){if(!j)continue;
    if(j.ca){r.jours++;r.caTTC+=j.ca;r.ca+=j.ca} /* v51 : tout en TTC (CA, achats, avoirs) */ if(j.caN1)r.caN1+=j.caN1;
    for(const [k,v] of Object.entries(j.achats||{})){if(v){r.achats+=v;r.par[k]=(r.par[k]||0)+v}}}}
  /* v51 : plus de HT : le CA HT du mois et le HT par jour ne sont plus utilisés */
  for(const a of S.avoirs){if(OBTENU.includes(a.statut)&&a.montant&&a.date&&a.date.startsWith(mkey(y,m)))r.avoirs+=a.montant}
  r.demarque=(doc&&Array.isArray(doc.demarque))?doc.demarque.reduce((t,x)=>t+(+x.montant||0),0):0;
  r.marge=r.ca-r.achats;r.taux=r.ca?r.marge/r.ca:null;r.tauxCorr=r.ca?(r.marge+r.avoirs)/r.ca:null;r.tauxHD=r.ca?(r.marge+r.demarque)/r.ca:null;return r}
const dayISO=(y,m,d)=>y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
/* Totaux entre deux inventaires : jours strictement après d1, jusqu'à d2 inclus (stock compté le soir de l'inventaire). */
function periodStats(d1,d2){
  const r={ca:0,caTTC:0,achats:0,demarque:0,jours:0,estimes:0};
  let y=+d1.slice(0,4),m=+d1.slice(5,7)-1;const ye=+d2.slice(0,4),me=+d2.slice(5,7)-1;
  while(y<ye||(y===ye&&m<=me)){
    const first=dayISO(y,m,1),last=dayISO(y,m,new Date(y,m+1,0).getDate());const doc=S.mois[mkey(y,m)];
    if(first>d1&&last<=d2){const t=monthStats(y,m);r.ca+=t.ca;r.caTTC+=t.caTTC;r.achats+=t.achats;r.demarque+=t.demarque;r.jours+=t.jours;r.estimes+=t.estimes}
    else if(doc){
      for(const[dd,j]of Object.entries(doc.jours||{})){const iso=dayISO(y,m,+dd);if(!j||iso<=d1||iso>d2)continue;
        if(j.ca){r.jours++;r.caTTC+=j.ca;r.ca+=j.ca} /* v51 : tout en TTC (CA, achats, avoirs) */
        for(const v of Object.values(j.achats||{}))r.achats+=v||0}
      for(const x of(doc.demarque||[]))if(x.date>d1&&x.date<=d2)r.demarque+=+x.montant||0}
    m++;if(m>11){m=0;y++}}
  return r}
function lastAction(a){const rel=(a.relances||[]).slice().sort();return rel.length?rel[rel.length-1]:(a.dateReclamation||a.date)}
function isLate(a){return (a.statut==="declare"||a.statut==="relance")&&daysSince(lastAction(a))>=RELANCE_JOURS}

function vBord(){
  const y=S.year;const ms=MOIS.map((_,m)=>monthStats(y,m));const act=ms.filter(s=>s.ca>0);
  // comparaison avec l'année précédente : CA et taux du même mois (sinon colonne N-1 saisie à la main)
  const pv=MOIS.map((_,m)=>monthStats(y-1,m));
  ms.forEach((s,m)=>{const p=pv[m];s.n1=p.caTTC||s.caN1||0;s.n1Taux=p.ca&&p.jours>=20?p.taux:null;s.n1Inc=p.caTTC>0&&p.jours<20});
  const comp=ms.map((s,m)=>[s,pv[m],m]).filter(([s,p])=>s.jours>=20&&p.jours>=20);
  const C=comp.reduce((a,[s,p])=>({n:a.n+s.caTTC,p:a.p+p.caTTC,nHT:a.nHT+s.ca,pHT:a.pHT+p.ca,nA:a.nA+s.achats,pA:a.pA+p.achats}),{n:0,p:0,nHT:0,pHT:0,nA:0,pA:0});
  const evo=C.p?C.n/C.p-1:null, tN=C.nHT?(C.nHT-C.nA)/C.nHT:null, tP=C.pHT?(C.pHT-C.pA)/C.pHT:null;
  const compLbl=comp.length?(comp.length===1?MOIS[comp[0][2]]:`${MC[comp[0][2]]}–${MC[comp[comp.length-1][2]]}`):"";
  const pAct=pv.filter(p=>p.ca>0&&p.jours>=20);const PT=pAct.reduce((a,p)=>({ca:a.ca+p.ca,ac:a.ac+p.achats}),{ca:0,ac:0});const tauxPrev=PT.ca?(PT.ca-PT.ac)/PT.ca:null;
  const pts=(a,b)=>a==null||b==null?"—":((a-b)*100>=0?"+":"−")+Math.abs((a-b)*100).toFixed(1).replace(".",",")+" pt";
  const T=act.reduce((a,s)=>({ca:a.ca+s.ca,caTTC:a.caTTC+s.caTTC,achats:a.achats+s.achats,avoirs:a.avoirs+s.avoirs,caN1:a.caN1+s.caN1,jours:a.jours+s.jours,estimes:a.estimes+s.estimes,n1:a.n1+s.n1,dem:a.dem+s.demarque}),{ca:0,caTTC:0,achats:0,avoirs:0,caN1:0,jours:0,estimes:0,n1:0,dem:0});
  const taux=T.ca?(T.ca-T.achats)/T.ca:null, tauxC=T.ca?(T.ca-T.achats+T.avoirs)/T.ca:null;
  const enc=S.avoirs.filter(a=>EN_COURS.includes(a.statut));const encM=enc.reduce((s,a)=>s+(a.montant||0),0);
  const late=S.avoirs.filter(isLate);const sansMontant=enc.filter(a=>!a.montant).length;
  const best=act.length?act.reduce((a,b)=>a.taux>b.taux?a:b):null, worst=act.length?act.reduce((a,b)=>a.taux<b.taux?a:b):null;
  // achats par fournisseur
  const par={};act.forEach(s=>{for(const[k,v]of Object.entries(s.par))par[k]=(par[k]||0)+v});
  // v68 : MARIANO et MONTPERAL séparés (une colonne commune « MARIANO/MONTPERAL » est partagée moitié-moitié), fournisseurs de même nom réunis (SAINT PRIM),
  // HALAL et ISLA MONDIAL affichés « ISLA DELICE », DIAPAR en premier puis l'ordre de la saisie ; seuls les fournisseurs avec des achats dans l'année sont affichés
  const nkD=t=>String(t||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/gi,"").toUpperCase();
  const VK={__mariano:"MARIANO",__montperal:"MONTPERAL",__isla:"ISLA DELICE"};
  const parts=k=>{const n=nkD(fName(k));const ma=/MARIANO/.test(n),mo=/MONTP/.test(n);
    if(ma&&mo)return [["__mariano",.5],["__montperal",.5]];if(ma)return [["__mariano",1]];if(mo)return [["__montperal",1]];
    if(n==="HALAL"||n==="ISLAMONDIAL"||n==="ISLADELIS"||n==="ISLADELICE")return [["__isla",1]];
    const f=S.fourn.find(x=>x.id===k);if(!f)return [[k,1]];const same=S.fourn.filter(x=>nkD(x.nom)===n).sort((a,b)=>(a.ordre??99)-(b.ordre??99));return [[same.length?same[0].id:k,1]]};
  const ordOne=k=>{if(VK[k]){const o=S.fourn.filter(f=>parts(f.id).some(p=>p[0]===k)).map(f=>f.ordre).filter(x=>x!=null);return o.length?Math.min(...o):999}
    const o=S.fourn.filter(f=>f.id===k||f.groupe===k).map(f=>f.ordre).filter(x=>x!=null);return o.length?Math.min(...o):999};
  const ordOf=k=>nkD(VK[k]||fName(k))==="DIAPAR"?-1:ordOne(k);
  const G={};for(const[k0,v0]of Object.entries(par))for(const[k,w]of parts(k0)){const v=v0*w,g=grp(k)||k;G[g]=G[g]||{tot:0,sub:{}};G[g].tot+=v;if(grp(k))G[g].sub[k]=(G[g].sub[k]||0)+v}
  Object.values(G).forEach(g=>g.sub=Object.entries(g.sub).filter(x=>Math.abs(x[1])>=0.005));
  const parL=Object.entries(G).filter(x=>Math.abs(x[1].tot)>=0.005).sort((a,b)=>ordOf(a[0])-ordOf(b[0])||b[1].tot-a[1].tot);const maxP=parL.length?Math.max(...parL.map(x=>x[1].tot)):1;
  const hbRow=(k,v,sub)=>`<span class="${sub?"hsub hname":""}">${esc(VK[k]||fName(k))}</span><span class="tr ${sub?"hsub":""}"><i style="width:${(v/maxP*100).toFixed(1)}%"></i></span><span class="n ${sub?"hsub":""}">${eur.format(v)}</span>`;
  return `
  ${periode("annee")}

  <div class="grid kpis">
    <div class="kpi"><span class="lbl">CA TTC cumulé</span><span class="v">${eur.format(T.caTTC)}</span><span class="d">${T.jours} jour${T.jours>1?"s":""} saisi${T.jours>1?"s":""}</span></div>

    <div class="kpi hl"><span class="lbl">Taux après avoirs</span><span class="v">${pct(tauxC)}</span><span class="d">+ ${eur.format(T.avoirs)} d'avoirs obtenus</span></div>
    <div class="kpi ${evo==null?"":evo>=0?"hl":"alert"}"><span class="lbl">CA vs ${y-1}</span><span class="v">${evo==null?"—":(evo>=0?"+":"")+pct(evo)}</span><span class="d">${comp.length?`${compLbl}, mois comparables · marge ${pct(tN)} contre ${pct(tP)} (${pts(tN,tP)})`:`Pas de mois complet en ${y-1} à comparer`}</span></div>
    <div class="kpi ${late.length?"alert":""}"><span class="lbl">Avoirs en cours</span><span class="v">${eur.format(encM)}</span><span class="d">${enc.length} dossier${enc.length>1?"s":""}${late.length?` · <span class="late">${late.length} à relancer</span>`:""}</span></div>
  </div>
  <div class="gap"></div>
  <div class="grid two">
    <div class="panel"><div class="band">Taux de marge par mois</div>${chart(ms,pv,y)}

    <div class="panel"><div class="band">Achats ${y} par fournisseur</div>
      ${parL.length?`<div class="hb">${parL.map(([k,g])=>hbRow(k,g.tot,false)+g.sub.sort((a,b)=>ordOf(a[0])-ordOf(b[0])).map(([s,v])=>hbRow(s,v,true)).join("")).join("")}</div>`:`<p class="sub">Aucun achat saisi.</p>`}
    </div>
  </div>
  <div class="gap"></div>
  <div class="panel"><div class="band">Récapitulatif mensuel</div><div class="scroll"><table>
    <thead><tr><th class="l">Mois</th><th>Jours</th><th>CA TTC</th><th>CA ${y-1}</th><th>Évol.</th><th>Achats</th><th>Marge</th><th>Taux</th><th>Taux ${y-1}</th><th>Écart</th><th>Avoirs obtenus</th><th>Taux après avoirs</th></tr></thead>

      <td class="${ev>0?"pos":ev<0?"neg":""}">${ev==null?"—":(ev>0?"+":"")+pct(ev)}</td><td>${s.achats?eur.format(s.achats):"—"}</td><td>${s.ca?eur.format(s.marge):"—"}</td><td><b>${pct(s.taux)}</b></td><td>${pct(s.n1Taux)}</td><td class="${s.taux!=null&&s.n1Taux!=null&&s.jours>=20?(s.taux>=s.n1Taux?"pos":"neg"):""}">${s.ca&&s.jours>=20?pts(s.taux,s.n1Taux):"—"}</td><td>${s.avoirs?eur.format(s.avoirs):"—"}</td><td>${pct(s.tauxCorr)}</td></tr>`}).join("")}

function chart(ms,pv,yr){
  const W=640,H=220,pl=34,pr=8,pt=30,pb=24;
  const okP=p=>p.ca&&p.jours>=20?p.taux:null;
  const vals=[...ms.map(s=>s.taux),...pv.map(okP)].filter(v=>v!=null);const mx=Math.max(0.4,...vals.map(v=>Math.ceil(v*10)/10));
  const bw=(W-pl-pr)/12;const y=v=>pt+(H-pt-pb)*(1-v/mx);
  let g="";for(let t=0;t<=mx+1e-9;t+=0.1){g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end">${Math.round(t*100)}%</text>`}
  const hasP=pv.some(p=>okP(p)!=null);
  const bars=ms.map((s,i)=>{const cx=pl+i*bw+bw/2;const lbl=`<text x="${cx}" y="${H-6}" text-anchor="middle">${MC[i]}</text>`;
    const w=hasP?bw*0.36:bw*0.64;const xN=hasP?cx+1:cx-w/2,xP=cx-w-1;let out="";
    const pvv=okP(pv[i]);
    if(hasP&&pvv!=null){const v=Math.max(0,pvv);out+=`<rect x="${xP}" y="${y(v)}" width="${w}" height="${y(0)-y(v)}" rx="2" fill="var(--n1)"><title>${MOIS[i]} ${yr-1} : ${pct(pvv)}</title></rect>`}
    if(s.taux==null)return out+`<rect x="${xN}" y="${y(0)-3}" width="${w}" height="3" fill="var(--bar-empty)"/>`+lbl;
    const v=Math.max(0,s.taux);return out+`<rect x="${xN}" y="${y(v)}" width="${w}" height="${y(0)-y(v)}" rx="2" fill="var(--accent)" opacity="${s.jours<20?0.45:1}"><title>${MOIS[i]} ${yr} : ${pct(s.taux)}${s.jours<20?" (mois incomplet)":""}</title></rect><text class="vl" x="${xN+w/2}" y="${y(v)-5}" text-anchor="middle">${(s.taux*100).toFixed(0)}</text>`+lbl}).join("");
  const leg=hasP?`<rect x="${W-pr-150}" y="6" width="10" height="10" rx="2" fill="var(--n1)"/><text x="${W-pr-136}" y="15">${yr-1}</text><rect x="${W-pr-90}" y="6" width="10" height="10" rx="2" fill="var(--accent)"/><text x="${W-pr-76}" y="15">${yr}</text>`:"";
  return `<div class="scroll"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:420px;display:block" role="img" aria-label="Taux de marge par mois, ${yr} comparé à ${yr-1}">${g}${bars}${leg}</svg></div>`;
}

function vInventaires(y){

    const marge=p.ca-p.achats, reelle=p.ca-(p.achats+(+a.valeur||0)-(+b.valeur||0));
    per.push({a,b,p,marge,reelle,tA:p.ca?marge/p.ca:null,tR:p.ca?reelle/p.ca:null,tHD:p.ca?(reelle+p.demarque)/p.ca:null})}

  return `<div class="panel flush"><div class="band">Inventaires et marge réelle<button class="pillbtn" data-act="focusInv">+ Inventaire</button></div>

  </div>
  ${inv.length?`<div class="scroll"><table>

function vSaisie(){
  const y=S.year,m=S.month,key=mkey(y,m);const doc=S.mois[key]||{jours:{}};const J=doc.jours||{};
  const nd=new Date(y,m+1,0).getDate();
  const used=new Set();Object.values(J).forEach(j=>Object.keys((j&&j.achats)||{}).forEach(k=>used.add(k)));
  const cols=colFourn().filter(f=>f.actif!==false||used.has(f.id));
  used.forEach(k=>{if(!cols.find(f=>f.id===k)&&!S.fourn.find(f=>f.id===k))cols.push({id:k,nom:k})});
  const nmK=t=>String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/gi,"").toUpperCase(),visN=new Set(cols.map(f=>nmK(f.nom)));
  // v39 : une colonne retirée qui porte le même nom qu'une colonne affichée (doublon, ex. SAINT PRIM) n'est plus proposée
  // v41 : plus de case « actif » : un ancien fournisseur inactif apparaît aussi dans les colonnes retirées
  // v47-48 : une colonne retirée supprimée (✕) disparaît de ce mois et des mois suivants, pas des mois d'avant
  const masq=new Set(Object.keys(S.mois).filter(k=>/^\d{4}-\d{2}$/.test(k)&&k<=key).flatMap(k=>Array.isArray(S.mois[k].masques)?S.mois[k].masques:[]));
  const retirees=S.fourn.filter(f=>!masq.has(f.id)&&!cols.some(c=>c.id===f.id)&&!f.groupe&&!S.fourn.some(x=>x.groupe===f.id)&&!visN.has(nmK(f.nom))).sort((a,b)=>(a.ordre??99)-(b.ordre??99));
  cols.sort((a,b)=>(a.ordre??99)-(b.ordre??99));
  // regroupe les rayons d'un même fournisseur (ex. DIAPAR) côte à côte, suivis de leur sous-total
  const runs=[];const seen=new Set();
  for(const f of cols){if(seen.has(f.id))continue;
    if(f.groupe){const mem=cols.filter(x=>x.groupe===f.groupe);mem.forEach(x=>seen.add(x.id));runs.push({groupe:f.groupe,mem})}
    else{seen.add(f.id);runs.push({mem:[f]})}}
  const anyG=runs.some(r=>r.groupe);
  const hasN1=true; // v37 : colonne CA N-1 toujours affichée
  const st=monthStats(y,m),n1st=monthStats(y-1,m);
  // v59 : CA N-1 de chaque jour repris automatiquement du même jour l'an dernier (sauf s'il a été tapé à la main)
  const J1=((S.mois[mkey(y-1,m)]||{}).jours)||{},n1Day=(dd,j)=>j.caN1!=null&&j.caN1!==""?j.caN1:((J1[dd]&&J1[dd].ca)||null);
  let caN1Tot=0;for(let d=1;d<=nd;d++){const dd=String(d).padStart(2,"0");caN1Tot+=+(n1Day(dd,J[dd]||{})||0)}
  const n1ca=caN1Tot||n1st.caTTC; // v53 : rappel N-1 sous le CA et les achats
  const cell=(d,field,val,ph)=>`<input id="c-${d}-${field}" data-d="${d}" data-f="${field}" inputmode="decimal" value="${val==null?"":n2.format(val)}"${ph?` placeholder="≈ ${n2.format(ph)}" title="Estimé depuis le TTC"`:""} aria-label="${field} jour ${d}">`;
  let rows="";
  for(let d=1;d<=nd;d++){const dd=String(d).padStart(2,"0");const j=J[dd]||{};const a=j.achats||{};
    const tot=Object.values(a).reduce((s,v)=>s+(v||0),0);const wd=new Date(y,m,d).getDay();
    rows+=`<tr><td class="day ${wd===0?"we":""}">${["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"][wd]} ${d}</td><td class="ca">${cell(dd,"ca",j.ca)}</td>${hasN1?`<td>${cell(dd,"caN1",n1Day(dd,j))}</td>`:""}
      ${runs.map(r=>r.mem.map(f=>`<td${r.groupe?"":' class="fc"'}>${cell(dd,"a:"+f.id,a[f.id])}</td>`).join("")).join("")}<td class="calc">${tot?n2.format(tot):""}</td></tr>`}
  const tf=f=>st.par[f.id]?n2.format(st.par[f.id]):"";
  const rs="";
  S._runs=runs.map(r=>r.mem.map(f=>f.id));
  // v46 : nom sur toute la largeur ; au-dessus : ‹ (vers la gauche), ✕ (retirer), › (vers la droite) — v50 : rien pour Épicerie, A/A, Frais (fixes)
  const nameCell=(f,del,ri)=>{if(!S.fourn.find(x=>x.id===f.id))return esc(f.nom);const n=esc(f.nom),first=ri===0,last=ri===runs.length-1;
    const mv=(d,lab,dis)=>`<button class="fmv" data-mv="${esc(f.id)}" data-dir="${d}" ${dis?"disabled":""} title="${lab}" aria-label="${lab}">${d<0?"‹":"›"}</button>`;
    return `<div class="fhead">${!del?`<div class="fctl fctl-ph" aria-hidden="true"></div>`:`<div class="fctl">${mv(-1,"Déplacer "+n+" vers la gauche",first)}${del?`<button class="fx" data-hidecol="${esc(f.id)}" title="Retirer ${n} de la saisie" aria-label="Retirer ${n} de la saisie">✕</button>`:""}${mv(1,"Déplacer "+n+" vers la droite",last)}</div>`}<input id="rn-${esc(f.id)}" class="fname" data-rn="${esc(f.id)}" value="${n}" aria-label="Nom du fournisseur" title="${n} : cliquer pour modifier le nom"></div>`};
  const head1=`<tr><th class="day"${rs}>Jour</th><th${rs}>CA TTC</th>${hasN1?`<th${rs}>CA N-1</th>`:""}${runs.map((r,ri)=>r.groupe?r.mem.map(f=>`<th class="fray">${nameCell(f,false,ri)}</th>`).join(""):`<th class="fcol">${nameCell(r.mem[0],true,ri)}</th>`).join("")}<th${rs}>Total achats</th></tr>`;
  const head2="";
  const hidAmt=retirees.map(f=>[f,st.par[f.id]||0]);
  const totCells=runs.map(r=>r.mem.map(f=>`<td${r.groupe?"":' class="fc"'}>${tf(f)}</td>`).join("")).join("");
  return `
  ${periode("mois")}
  <div class="grid kpis kpis-s" style="margin-bottom:10px">
    <div class="kpi"><span class="lbl">CA TTC du mois</span><span class="v">${eur.format(st.caTTC)}</span><span class="d">CA N-1 : ${n1ca?eur.format(n1ca):"—"}</span></div>
    <div class="kpi"><span class="lbl">Achats</span><span class="v">${eur.format(st.achats)}</span><span class="d">Achats N-1 : ${n1st.achats?eur.format(n1st.achats):"—"}</span></div>
    <div class="kpi ${st.demarque?"alert":""}"><span class="lbl">Démarque connue</span><span class="v">${eur.format(st.demarque)}</span><span class="d">${st.ca?pct(st.demarque/st.ca)+" du CA · marge hors démarque "+pct(st.tauxHD):"&nbsp;"}</span></div>
    <div class="kpi hl"><span class="lbl">Taux de marge</span><span class="v">${pct(st.taux)}</span><span class="d">Marge ${eur.format(st.marge)}</span></div>
    <div class="kpi"><span class="lbl">Après avoirs</span><span class="v">${pct(st.tauxCorr)}</span><span class="d">${eur.format(st.avoirs)} obtenus ce mois</span></div>
  </div>
  <div class="panel flush"><div class="band band-s">Saisie ${esc(MOIS[m])} ${y}<button class="pillbtn" data-act="addFourn">+ Nom</button></div><div class="scroll sheet-scroll"><table class="sheet">
    <thead>${head1}${head2}</thead>
    <tbody>${rows}<tr class="tot"><td class="day">Total</td><td>${n2.format(st.caTTC)}</td>${hasN1?`<td>${caN1Tot?n2.format(caN1Tot):""}</td>`:""}${totCells}<td>${n2.format(st.achats)}</td></tr></tbody>
  </table></div>${retirees.length?`<div class="hidden-cols"><span>Colonnes retirées (cliquez pour réafficher) :</span>${hidAmt.map(([f,v])=>`<span class="rchip"><button data-showcol="${esc(f.id)}" title="Réafficher ${esc(f.nom)} dans la saisie">+ ${esc(f.nom)}${v?` · ${eur.format(v)} ce mois`:""}</button>${v?"":`<button class="rdel" data-maskcol="${esc(f.id)}" title="Supprimer ${esc(f.nom)} de ce mois" aria-label="Supprimer ${esc(f.nom)} de ce mois">✕</button>`}</span>`).join("")}</div>`:""}</div>
  <div class="gap"></div>
  <div class="gap"></div>
  <label class="lbl" for="mnote">Note du mois</label>
  <textarea id="mnote" rows="2" style="width:100%;margin-top:4px" placeholder="Ex. facture en double, erreur du mois précédent…">${esc(doc.note||"")}</textarea>
  <div class="gap"></div>
  ${vDemarque(y,m,doc,st)}`;
}

function avFourn(sel){const nk=t=>String(t||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/gi,"").toUpperCase(),ord=(a,b)=>(a.ordre??99)-(b.ordre??99)||String(a.nom).localeCompare(String(b.nom));

  const L=S.fourn.filter(f=>!f.groupe),A=L.filter(inSaisie).sort(ord),an=new Set(A.map(f=>nk(f.nom)));
  const B=L.filter(f=>!inSaisie(f)&&(!an.has(nk(f.nom))||f.id===sel)).sort(ord);return[A,B]}

function avOpts(sel){const[A,B]=avFourn(sel),o=f=>`<option value="${esc(f.id)}" ${sel===f.id?"selected":""}>${esc(f.nom)}</option>`;

async function saveCell(inp){
  const d=inp.dataset.d,f=inp.dataset.f;const v=parseNum(inp.value);
  if(Number.isNaN(v)){toast("Montant illisible : utilisez des chiffres, par ex. 1234,56");inp.focus();return}
  const key=mkey(S.year,S.month);const doc=S.mois[key];const j=(doc&&doc.jours&&doc.jours[d])||{};
  const old=f.startsWith("a:")?(j.achats||{})[f.slice(2)]:j[f];if((old??null)===v)return;
  const patch=f.startsWith("a:")?{achats:{[f.slice(2)]:v}}:{[f]:v};
  const ref=S.db.doc(P("mois/"+key));
  try{ if(doc) await ref.update({jours:{[d]:patch}}); else await ref.set({annee:S.year,mois:S.month+1,jours:{[d]:patch}}) }catch(e){fail(e)}
}
async function saveAvoir(form){
  const g=id=>document.getElementById("av-"+id).value.trim();const mt=parseNum(g("montant"));
  if(Number.isNaN(mt)){toast("Montant illisible : utilisez des chiffres, par ex. 55,86");return}
  const a=S.edit;const statut=g("statut");
  const body={fournisseur:g("fournisseur"),date:g("date"),produit:g("produit"),code:g("code"),facture:g("facture"),quantite:g("quantite"),motif:g("motif"),montant:mt,statut,infos:g("infos"),
    relances:a.relances||[],dateReclamation:a.dateReclamation||todayISO(),creeLe:a.creeLe||todayISO(),majLe:todayISO()};
  try{ if(a.id) await S.db.doc(P("avoirs/"+a.id)).set(body); else await S.db.collection(P("avoirs")).add(body);
    S.edit=null;S.confirmDel=null;toast(a.id?"Avoir enregistré":"Avoir créé");render() }catch(e){fail(e)}
}
// v54 : texte d'un avoir à coller dans un e-mail (avec le détail des relances)
function avTexte(a){const d=x=>x?frDate(x):"";const rel=(a.relances||[]).slice().sort();
  // v55 : produit, date de facture, n° de facture, quantité, motif, montant, puis chaque relance (seulement ce qui est rempli)
  return [`Produit : ${a.produit||""}`,a.date?`Date de facture : ${d(a.date)}`:"",a.facture?`N° de facture : ${a.facture}`:"",a.quantite?`Quantité : ${a.quantite}`:"",
    a.motif?`Motif : ${a.motif}`:"",a.montant?`Montant : ${eur2.format(a.montant)} HT`:"",...rel.map((r,k)=>`Relance ${k+1} : ${d(r)}`)].filter(Boolean).join("\n")}
async function avCopier(id){const a=S.avoirs.find(x=>x.id===id);if(!a)return;const t=avTexte(a);
  try{await navigator.clipboard.writeText(t)}catch(e){const x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();try{document.execCommand("copy")}catch(_){}x.remove()}
  toast("Avoir copié : collez-le dans votre e-mail (Ctrl+V)")}
async function setStatut(id,st){const a=S.avoirs.find(x=>x.id===id);if(!a)return;const t=todayISO();
  try{await S.db.doc(P("avoirs/"+id)).update({statut:st,majLe:t});toast(st==="accepte"?"Avoir accepté":st==="deduit"?"Avoir déduit":"Avoir refusé")}catch(e){fail(e)}}
async function relancer(id){

async function copyRecap(){

/* ================= Stockage local + synchronisation (comme GESTIME) =================
   Même interface que la base en ligne : doc(), collection(), get/set/update/delete, onSnapshot.
   Les données sont rangées PAR MAGASIN : un enregistrement par magasin (bredis, clamart…) + « commun » (logo).
   PC : fichiers gesmar-<id>.json dans le dossier des données (window.api). Navigateur : localStorage.
   Synchronisation Supabase (table « gesmar », une ligne par magasin) : envoi après chaque modification,
   relecture toutes les 15 s, numéro de révision « rev » pour ne jamais écraser la saisie d'un autre poste. */
const SEED={"magasins/bredis":{"nom":"BREDIS","ordre":0},"magasins/clamart":{"nom":"CLAMART","ordre":1}};
const PC=!!(window.api&&typeof window.api.load==="function");
const LS_PRE="gesmar.v2.";
function rawLoad(name){try{return PC?window.api.load(name):localStorage.getItem(LS_PRE+name)}catch(e){return null}}
function rawSave(name,j){if(PC)window.api.save(name,j);else localStorage.setItem(LS_PRE+name,j)}
const clone=o=>JSON.parse(JSON.stringify(o));
const blobOf=path=>{const s=path.split("/");return s[0]==="magasins"&&s[1]?s[1]:"commun"};
const DEFAULT_IDS=["commun","bredis","clamart"];

let STORE={};const META={}; // META[id] = {rev, dirty:{chemin:compteur}, base:{chemin: version du serveur avant la modification}}
const meta=id=>META[id]||(META[id]={rev:0,dirty:{},base:{}});
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
const isObj=o=>o&&typeof o==="object"&&!Array.isArray(o);
// Fusion case par case (même règle que GESTIME) : chaque poste garde ses saisies ;
// une case tapée EN MÊME TEMPS sur deux postes est effacée partout et doit être réécrite.
function gmMerge(base,mine,theirs,res){const J=JSON.stringify,eq=(a,b)=>J(a)===J(b),obj=o=>o&&typeof o==="object"&&!Array.isArray(o),prim=v=>v===undefined||v===null||typeof v!=="object",cp=v=>v===undefined?undefined:JSON.parse(J(v));
  if(eq(mine,base))return cp(theirs);if(eq(theirs,base))return cp(mine);if(eq(mine,theirs))return cp(mine);
  if(obj(mine)&&obj(theirs)){const b=obj(base)?base:{},o={};for(const k of new Set([...Object.keys(b),...Object.keys(mine),...Object.keys(theirs)])){const v=gmMerge(b[k],mine[k],theirs[k],res);if(v!==undefined)o[k]=v}return o}
  if(Array.isArray(mine)&&Array.isArray(theirs)){const idd=a=>a.every(x=>obj(x)&&x.id!=null);
    if(idd(mine)&&idd(theirs)){const B=new Map((Array.isArray(base)&&idd(base)?base:[]).map(x=>[x.id,x])),M=new Map(mine.map(x=>[x.id,x])),T=new Map(theirs.map(x=>[x.id,x])),out=[];
      for(const i of [...mine.map(x=>x.id),...theirs.map(x=>x.id).filter(i=>!M.has(i))]){const v=gmMerge(B.get(i),M.get(i),T.get(i),res);if(v!==undefined)out.push(v)}return out}
    return cp(mine)}
  if(prim(mine)&&prim(theirs)){res.n++;return typeof mine==="string"||typeof theirs==="string"?"":undefined}
  return cp(mine)}
const EFF_MSG="⚠️ Une case a été tapée en même temps sur un autre poste : elle a été effacée, réécrivez-la.";
function gmNotice(msg){let n=document.getElementById("gtn");if(!n){n=document.createElement("div");n.id="gtn";n.setAttribute("role","alert");document.body.appendChild(n);n.addEventListener("click",()=>n.remove())}
  n.textContent=msg+"  ✕";clearTimeout(gmNotice.t);gmNotice.t=setTimeout(()=>{const x=document.getElementById("gtn");if(x)x.remove()},10000)}
function mark(path){const m=meta(blobOf(path));if(!(path in m.dirty)&&!(path in m.base))m.base[path]=STORE[path]===undefined?null:clone(STORE[path])}
function blobDocs(id){const o={};for(const k of Object.keys(STORE))if(blobOf(k)===id)o[k]=STORE[k];return o}
function knownIds(){const s=new Set(DEFAULT_IDS);Object.keys(STORE).forEach(k=>s.add(blobOf(k)));Object.keys(META).forEach(k=>s.add(k));return[...s]}
function saveBlob(id){const m=meta(id);rawSave("gesmar-"+id,JSON.stringify({app:"GESMAR",magasin:id,rev:m.rev,dirty:Object.keys(m.dirty),base:m.base,docs:blobDocs(id)}))}

/* --- chargement : fichiers par magasin ; sinon reprise de l'ancien fichier unique (ou des données de départ) --- */
(function boot(){
  let found=false,extra=[];try{extra=JSON.parse(rawLoad("gesmar-index")||"[]")}catch(e){}
  for(const id of new Set(DEFAULT_IDS.concat(extra))){
    let b=null;try{b=JSON.parse(rawLoad("gesmar-"+id)||"null")}catch(e){}
    if(b&&b.docs){found=true;Object.assign(STORE,b.docs);const m=meta(id);m.rev=b.rev||0;(b.dirty||[]).forEach(p=>m.dirty[p]=1);m.base=b.base||{}}
  }
  if(!found){
    let old=null;try{old=JSON.parse((PC?window.api.load("gesmar"):localStorage.getItem("gesmar.db.v1"))||"null")}catch(e){}
    if(old&&old.data&&typeof old.data==="object"&&!Array.isArray(old.data))old=old.data; // fichier d'export
    STORE=old&&typeof old==="object"?old:clone(SEED);
    for(const k of Object.keys(STORE))if(k.startsWith("__meta/"))delete STORE[k];
    try{knownIds().forEach(saveBlob);rawSave("gesmar-index",JSON.stringify(knownIds()))}catch(e){}
  }
})();

const LISTENERS=new Set();let notifyQueued=false;
function notify(){if(!notifyQueued){notifyQueued=true;setTimeout(()=>{notifyQueued=false;LISTENERS.forEach(f=>f())},0)}}
function persist(path){const id=blobOf(path),m=meta(id);m.dirty[path]=(m.dirty[path]||0)+1;
  try{saveBlob(id);if(!DEFAULT_IDS.includes(id))rawSave("gesmar-index",JSON.stringify(knownIds()))}
  catch(e){throw{code:"quota_exceeded",message:PC?"Enregistrement sur le disque impossible":"Stockage du navigateur plein"}}
  notify();SYNC.schedule(id)}
function deepMerge(t,p){for(const[k,v]of Object.entries(p)){if(v&&typeof v==="object"&&!Array.isArray(v)&&t[k]&&typeof t[k]==="object"&&!Array.isArray(t[k]))deepMerge(t[k],v);else t[k]=clone(v)}return t}
const freeze=o=>o==null?o:Object.freeze(clone(o));
function snapDoc(path){const b=STORE[path];return{id:path.split("/").pop(),exists:b!==undefined,data:()=>b===undefined?undefined:freeze(b),metadata:{fromCache:false,hasPendingWrites:false}}}
function docRef(path){
  const segs=path.split("/");if(segs.length%2)throw new TypeError("Chemin de document invalide : "+path);
  return{id:segs[segs.length-1],path,
    get:async()=>snapDoc(path),
    set:async b=>{mark(path);STORE[path]=clone(b);persist(path)},
    update:async p=>{if(STORE[path]===undefined)throw{code:"invalid_argument",message:"Document absent"};mark(path);deepMerge(STORE[path],p);persist(path)},
    delete:async()=>{mark(path);delete STORE[path];persist(path)},
    onSnapshot:(next)=>{const f=()=>next(snapDoc(path));LISTENERS.add(f);setTimeout(f,0);return()=>LISTENERS.delete(f)},
    collection:sub=>colRef(path+"/"+sub)};
}
function colRef(path){
  const pre=path+"/";
  const docs=()=>Object.keys(STORE).filter(k=>k.startsWith(pre)&&!k.slice(pre.length).includes("/")).sort().map(snapDoc);
  const snap=()=>{const d=docs();return{docs:d,size:d.length,empty:!d.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}}};
  return{path,doc:id=>docRef(pre+(id||("id"+Date.now().toString(36)+Math.random().toString(36).slice(2,8)))),
    add:async b=>{const r=docRef(pre+"id"+Date.now().toString(36)+Math.random().toString(36).slice(2,8));await r.set(b);return r},
    get:async()=>snap(),
    onSnapshot:(next)=>{const f=()=>next(snap());LISTENERS.add(f);setTimeout(f,0);return()=>LISTENERS.delete(f)},
    where(){return this},orderBy(){return this},limit(){return this}};
}
const LocalDB={doc:docRef,collection:colRef};

/* ================= Synchronisation Supabase ================= */
const SYNC=(()=>{
  const st={state:"off",msg:"Synchronisation non réglée",busy:false,timer:null,pend:new Set(),poll:null,started:false};
  function cfg(){let c=window.SYNC&&window.SYNC.url&&window.SYNC.key?{url:window.SYNC.url,key:window.SYNC.key}:null;
    if(!c){try{const s=JSON.parse(rawLoad("gesmar-sync")||"null");if(s&&s.url&&s.key)c=s}catch(e){}}
    if(c&&/VOTRE/.test(c.url+"|"+c.key))c=null;if(c)c={url:String(c.url).trim().replace(/\/+$/,""),key:String(c.key).trim()};return c}
  const ERR=/Erreur|Accès|Table/;
  function set(state,msg){const ch=st.state!==state||st.msg!==msg;st.state=state;st.msg=msg;if(ch&&typeof renderModal==="function"&&S.modal)renderModal()}
  async function req(path,opt){const c=cfg();
    const r=await fetch(c.url+"/rest/v1/"+path,Object.assign({},opt,{headers:Object.assign({apikey:c.key,"Content-Type":"application/json"},(c.key.split(".").length===3?{Authorization:"Bearer "+c.key}:{}),opt&&opt.headers)}));
    if(!r.ok){let t="";try{t=(await r.json()).message||""}catch(e){}
      throw new Error(r.status===401||r.status===403?"Accès refusé par la base (vérifiez la clé et le script SQL)":r.status===404||/does not exist|schema cache/.test(t)?"Table « gesmar » absente : lancez le script SQL dans Supabase":"Erreur "+r.status+(t?" : "+t:""))}
    return r.status===204||r.status===201?null:r.json()}
  const pull=async id=>{const a=await req("gesmar?id=eq."+encodeURIComponent(id)+"&select=data,rev");return a&&a[0]||null};
  const hasDocs=o=>!!(o&&o.docs&&Object.keys(o.docs).length);
  // Prend la version du serveur pour un magasin, en gardant les modifications locales pas encore envoyées.
  function adopt(id,row){const m=meta(id),rd=(row.data&&row.data.docs)||{};
    for(const k of Object.keys(STORE))if(blobOf(k)===id&&!(k in m.dirty)&&!(k in rd))delete STORE[k];
    for(const[k,v]of Object.entries(rd))if(!(k in m.dirty))STORE[k]=v;
    const res={n:0};
    for(const k of Object.keys(m.dirty)){ // case par case pour les documents que ce poste a modifiés
      const theirs=rd[k],v=(k in m.base)?gmMerge(m.base[k]===null?undefined:m.base[k],STORE[k],theirs,res):STORE[k];
      if(v===undefined)delete STORE[k];else STORE[k]=v;m.base[k]=theirs===undefined?null:clone(theirs)}
    m.rev=row.rev;
    if(res.n){m.eff=Date.now();m.effSeen=m.eff;gmNotice(EFF_MSG)}
    else{const e=row.data&&row.data.eff;if(e&&e>(m.effSeen||0)){if(st.started&&m.seenOnce)gmNotice(EFF_MSG);m.effSeen=e}}
    m.seenOnce=true;saveBlob(id);notify()}
  async function push(id){const m=meta(id);
    for(let essai=0;essai<4;essai++){
      const sent=Object.assign({},m.dirty),body={data:{app:"GESMAR",magasin:id,docs:blobDocs(id),eff:m.eff||undefined},rev:m.rev+1,updated_at:new Date().toISOString()};
      const a=await req("gesmar?id=eq."+encodeURIComponent(id)+"&rev=eq."+m.rev,{method:"PATCH",headers:{Prefer:"return=representation"},body:JSON.stringify(body)});
      if(a&&a.length){m.rev=a[0].rev;for(const[p,n]of Object.entries(sent))if(m.dirty[p]===n){delete m.dirty[p];delete m.base[p]}else m.base[p]=body.data.docs[p]===undefined?null:clone(body.data.docs[p]);saveBlob(id);return}
      const r=await pull(id);
      if(!r){await req("gesmar",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({id,data:{app:"GESMAR",magasin:id,docs:{}},rev:0})});m.rev=0;continue}
      adopt(id,r); // un autre poste venait d'enregistrer : on reprend sa version + nos modifications, puis on renvoie
    }
    throw new Error("Erreur : trop de modifications en même temps, nouvel essai bientôt")}
  async function flush(){if(st.busy||!cfg()||!st.started)return;st.busy=true;const ids=[...st.pend];st.pend.clear();set("wait","Envoi…");
    try{for(const id of ids)await push(id);set("ok","Synchronisé avec les autres postes")}
    catch(e){ids.forEach(i=>st.pend.add(i));set("ko",ERR.test(e.message)?e.message:"Hors ligne : modifications gardées sur cet appareil");setTimeout(flush,5000)}
    finally{st.busy=false;if(st.pend.size&&st.state!=="ko")setTimeout(flush,800)}}
  function schedule(id){if(!cfg()||!st.started)return;st.pend.add(id);clearTimeout(st.timer);st.timer=setTimeout(flush,800)}
  async function first(){ // au démarrage : on compare chaque magasin avec le serveur
    try{const all=await req("gesmar?select=id,rev");for(const x of all||[])meta(x.id)}catch(e){throw e}
    for(const id of knownIds()){const m=meta(id),r=await pull(id),n=Object.keys(blobDocs(id)).length;
      if(r&&r.data&&r.data.eff)m.effSeen=Math.max(m.effSeen||0,r.data.eff);
      if(!r){if(n)st.pend.add(id);continue}
      if(!hasDocs(r.data)){m.rev=r.rev;if(n)st.pend.add(id);continue} // ligne vide : ce poste y envoie ses données
      if(r.rev>m.rev){if(m.rev===0&&n){try{rawSave("gesmar-"+id+"-avant-synchro",JSON.stringify({app:"GESMAR",magasin:id,docs:blobDocs(id)}))}catch(e){}}
        adopt(id,r)}
      else if(r.rev<m.rev)m.rev=r.rev; // la base a été remise à zéro : on renvoie tout
      if(Object.keys(m.dirty).length)st.pend.add(id)}
    knownIds().forEach(id=>{meta(id).seenOnce=true});
    rawSave("gesmar-index",JSON.stringify(knownIds()))}
  async function poll(){if(!cfg()||!st.started||st.busy||st.pend.size)return;const a=document.activeElement;if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))return;
    try{const all=await req("gesmar?select=id,rev");let ch=false;
      for(const x of all||[]){const m=meta(x.id);if(x.rev>m.rev){const r=await pull(x.id);if(r){adopt(x.id,r);ch=true;if(Object.keys(m.dirty).length)st.pend.add(x.id)}}}
      if(st.pend.size)flush();else set("ok",ch?"Mis à jour depuis un autre poste":"Synchronisé avec les autres postes")}
    catch(e){set("ko",ERR.test(e.message)?e.message:"Hors ligne")}}
  let visHook=false;
  async function start(){if(st.started)return;if(!cfg()){set("off","Synchronisation non réglée");return}
    st.started=true;set("wait","Synchronisation…");
    try{await first();if(st.pend.size)await flush();else set("ok","Synchronisé avec les autres postes")}
    catch(e){st.started=false;set("ko",ERR.test(e.message)?e.message:"Hors ligne : modifications gardées sur cet appareil");setTimeout(start,15000);return}
    clearInterval(st.poll);st.poll=setInterval(poll,15000);
    if(!visHook){visHook=true;document.addEventListener("visibilitychange",()=>{if(!document.hidden)poll()})}}
  function configure(url,key){rawSave("gesmar-sync",JSON.stringify({url:String(url).trim(),key:String(key).trim()}));st.started=false;return start()}
  function markAll(){for(const k of Object.keys(STORE)){const m=meta(blobOf(k));m.dirty[k]=(m.dirty[k]||0)+1}knownIds().forEach(id=>{saveBlob(id);schedule(id)})}
  return{st,cfg,start,schedule,configure,markAll,poll};
})();
